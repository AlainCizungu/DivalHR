# DivalHR local development stack. DEVELOPMENT ONLY: seed credentials, realm and tenant IDs in
# this stack are published in the repository and must never be used elsewhere.
#
#   docker compose -f infrastructure/docker/compose.yaml --env-file .env.example up -d --build --wait
#
# Browser-facing ports: web 5173, Core API 8080, AI Service 8090 (status only), Keycloak 8180
# (127.0.0.1 only).
# Mailpit (development mail catcher) UI on 127.0.0.1:8025 only.
# Internal only: PostgreSQL, SMTP (Mailpit 1025), Core API management port, health probes.
name: divalhr

services:
  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      DIVALHR_DB_NAME: ${DIVALHR_DB_NAME:?}
      DIVALHR_DB_USER: ${DIVALHR_DB_USER:?}
      DIVALHR_DB_PASSWORD: ${DIVALHR_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/10-create-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
      - ./postgres/20-provision-extensions.sh:/docker-entrypoint-initdb.d/20-provision-extensions.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the Core API connects. Add "5432:5432" locally if you need psql.

  keycloak:
    # Pinned Keycloak plus the divalhr-provisioning extension (Issue #31): see keycloak/Dockerfile.
    build:
      context: ../..
      dockerfile: infrastructure/docker/keycloak/Dockerfile
    image: divalhr/keycloak:dev
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
      # divalhr-provisioning extension (Issue #31): the only realm it answers in, and where the
      # setup-email link returns to. Not secrets.
      KC_SPI_REALM_RESTAPI_EXTENSION__DIVALHR_PROVISIONING__REALMS: divalhr-dev
      KC_SPI_REALM_RESTAPI_EXTENSION__DIVALHR_PROVISIONING__WEB_REDIRECT_URI: http://localhost:${WEB_PORT:-5173}/auth/callback
    volumes:
      - ./keycloak/realm-divalhr-dev.json:/opt/keycloak/data/import/realm-divalhr-dev.json:ro
    # Loopback only (Issue #27): the development realm accepts plain HTTP (sslRequired: none),
    # so it must never be reachable from the network. The Core API uses keycloak:8080 inside the
    # Compose network, which this binding does not affect.
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8180}:8080'
    healthcheck:
      # The image has no curl/wget; use bash's /dev/tcp against the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailpit:
    # Catches every email of the stack (invitations from the Core API, password setup from
    # Keycloak); nothing leaves the machine. SMTP is reachable only inside the compose network.
    image: axllent/mailpit:v1.29.6@sha256:0b5c5f7ffd3c93474baa7fd3869c1462e5a3d03256ed0933dfc0e7d81d794036
    environment:
      MP_MAX_MESSAGES: '500'
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  core-api:
    build:
      context: ../../apps/core-api
    image: divalhr/core-api:dev
    environment:
      DIVALHR_ENVIRONMENT: development
      DIVALHR_DB_URL: jdbc:postgresql://postgres:5432/${DIVALHR_DB_NAME}
      DIVALHR_DB_USER: ${DIVALHR_DB_USER}
      DIVALHR_DB_PASSWORD: ${DIVALHR_DB_PASSWORD}
      DIVALHR_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/divalhr-dev
      DIVALHR_OIDC_JWKS_URI: http://keycloak:8080/realms/divalhr-dev/protocol/openid-connect/certs
      DIVALHR_OIDC_AUDIENCE: divalhr-core-api
      DIVALHR_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
      DIVALHR_API_DOCS_ENABLED: 'true'
      DIVALHR_CURSOR_SIGNING_KEY: ${DIVALHR_CURSOR_SIGNING_KEY:?set in .env / .env.example}
      # Invitations (MVP-010)
      DIVALHR_EMAIL_LOOKUP_KEY: ${DIVALHR_EMAIL_LOOKUP_KEY:?set in .env / .env.example}
      DIVALHR_WEB_BASE_URL: http://localhost:${WEB_PORT:-5173}
      DIVALHR_KEYCLOAK_ADMIN_URL: http://keycloak:8080
      DIVALHR_KEYCLOAK_PROVISIONER_SECRET: ${DIVALHR_KEYCLOAK_PROVISIONER_SECRET:?set in .env / .env.example}
      DIVALHR_MAIL_HOST: mailpit
      DIVALHR_MAIL_PORT: '1025'
      DIVALHR_MAIL_FROM: ${DIVALHR_MAIL_FROM:?set in .env / .env.example}
      DIVALHR_MAIL_STARTTLS: 'false'
      # First tenant administrator (MVP-014). DEVELOPMENT ONLY: the per-platform-administrator
      # bootstrap limit is raised to its maximum so repeated end-to-end runs within an hour pass.
      # Every other environment keeps the default of 5 per hour.
      DIVALHR_BOOTSTRAP_PER_ACTOR_PER_HOUR: ${DIVALHR_BOOTSTRAP_PER_ACTOR_PER_HOUR:-50}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - '${CORE_API_PORT:-8080}:8080'

  ai-service:
    build:
      context: ../../apps/ai-service
    image: divalhr/ai-service:dev
    environment:
      DIVALHR_AI_ENVIRONMENT: development
      DIVALHR_AI_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
    ports:
      - '${AI_SERVICE_PORT:-8090}:8090'

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: divalhr/web:dev
    environment:
      DIVALHR_ENVIRONMENT: development
      DIVALHR_CORE_API_URL: http://localhost:${CORE_API_PORT:-8080}/api/v1
      DIVALHR_AI_SERVICE_URL: http://localhost:${AI_SERVICE_PORT:-8090}/api/v1
      DIVALHR_OIDC_AUTHORITY: http://localhost:${KEYCLOAK_PORT:-8180}/realms/divalhr-dev
      DIVALHR_OIDC_CLIENT_ID: divalhr-web
      DIVALHR_OIDC_ORIGIN: http://localhost:${KEYCLOAK_PORT:-8180}
      DIVALHR_CSP_CONNECT_SRC: >-
        http://localhost:${CORE_API_PORT:-8080}
        http://localhost:${AI_SERVICE_PORT:-8090}
        http://localhost:${KEYCLOAK_PORT:-8180}
    depends_on:
      core-api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-5173}:8080'

volumes:
  postgres-data:
