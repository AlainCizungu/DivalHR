# OPS-001 (Issue #65): the DivalHR test environment at https://hr-dev.dival.ai.
#
# TEST ENVIRONMENT. Synthetic data only. Never start it with .env.example or the development realm.
#
#   Started only by ops/hr-dev/remote-deploy.sh (or rehearse.sh), which sets:
#     HR_DEV_DATA      encrypted data root (A65-1), default /srv/divalhr-test
#     HR_DEV_RELEASE   full commit SHA of the images to run (A65-7)
#     HR_DEV_HOST / HR_DEV_ORIGIN / HR_DEV_TLS   public name, origin and TLS mode
#   Rehearsals (ops/hr-dev/rehearse.sh) also change the project name, image prefix, subnets and
#   published ports so they never touch the live project.
#
# Isolation (section 2): project "divalhr-test", its own networks and addresses, bind mounts
# under HR_DEV_DATA only (no Docker named volumes, which would live on the unencrypted root
# disk), and no published port except Caddy's 80/443 and two loopback-only operator ports.
# Secrets are files under HR_DEV_DATA/secrets, mounted read-only; none is passed as an
# environment variable, so none is stored in a container's configuration on the root disk.
name: ${HR_DEV_PROJECT:-divalhr-test}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-service: &service
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

networks:
  # Caddy only; the one network with outside connectivity (ACME, published ports).
  edge:
    ipam:
      config:
        - subnet: ${HR_DEV_SUBNET_PREFIX:-10.71}.0.0/24
          # Dynamic addresses only in the upper half: Caddy's fixed .2 addresses never collide.
          ip_range: ${HR_DEV_SUBNET_PREFIX:-10.71}.0.128/25
  # Browser-facing services behind Caddy. Core reaches Keycloak only through Caddy here.
  app:
    internal: true
    ipam:
      config:
        - subnet: ${HR_DEV_SUBNET_PREFIX:-10.71}.1.0/24
          # Dynamic addresses only in the upper half: Caddy's fixed .2 addresses never collide.
          ip_range: ${HR_DEV_SUBNET_PREFIX:-10.71}.1.128/25
  # Caddy and Keycloak only: every request Keycloak sees comes from Caddy (A65-2).
  idp:
    internal: true
    ipam:
      config:
        - subnet: ${HR_DEV_SUBNET_PREFIX:-10.71}.2.0/24
          # Dynamic addresses only in the upper half: Caddy's fixed .2 addresses never collide.
          ip_range: ${HR_DEV_SUBNET_PREFIX:-10.71}.2.128/25
  # Core API data: PostgreSQL and the mail catcher.
  core-data:
    internal: true
    ipam:
      config:
        - subnet: ${HR_DEV_SUBNET_PREFIX:-10.71}.3.0/24
          # Dynamic addresses only in the upper half: Caddy's fixed .2 addresses never collide.
          ip_range: ${HR_DEV_SUBNET_PREFIX:-10.71}.3.128/25
  # Keycloak data: PostgreSQL and the mail catcher.
  idp-data:
    internal: true
    ipam:
      config:
        - subnet: ${HR_DEV_SUBNET_PREFIX:-10.71}.4.0/24
          # Dynamic addresses only in the upper half: Caddy's fixed .2 addresses never collide.
          ip_range: ${HR_DEV_SUBNET_PREFIX:-10.71}.4.128/25
  # Caddy's admin site and the Mailpit UI.
  mail:
    internal: true
    ipam:
      config:
        - subnet: ${HR_DEV_SUBNET_PREFIX:-10.71}.5.0/24
          # Dynamic addresses only in the upper half: Caddy's fixed .2 addresses never collide.
          ip_range: ${HR_DEV_SUBNET_PREFIX:-10.71}.5.128/25

services:
  caddy:
    <<: *service
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      HR_DEV_HOST: ${HR_DEV_HOST:?}
      HR_DEV_TLS: ${HR_DEV_TLS:?}
      KEYCLOAK_UPSTREAM: keycloak:8080
      KEYCLOAK_REALM: divalhr-test
      CORE_UPSTREAM: core-api:8080
      AI_UPSTREAM: ai-service:8090
      WEB_UPSTREAM: web:8080
      MAILPIT_UPSTREAM: mailpit:8025
      HR_DEV_ADMIN_PORT: ${HR_DEV_ADMIN_PORT:-18180}
      CADDY_IDP_INTERNAL_BIND: ${HR_DEV_SUBNET_PREFIX:-10.71}.1.2
      CADDY_ADMIN_BIND: ${HR_DEV_SUBNET_PREFIX:-10.71}.0.2
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HR_DEV_DATA:?}/caddy/data:/data
      - ${HR_DEV_DATA:?}/caddy/config:/config
    ports:
      - '${HR_DEV_HTTP_PUBLISH:-80}:80'
      - '${HR_DEV_HTTPS_PUBLISH:-443}:443'
      # Keycloak admin console and Mailpit UI, through an SSH tunnel only.
      - '127.0.0.1:${HR_DEV_ADMIN_PORT:-18180}:18180'
    networks:
      edge:
        ipv4_address: ${HR_DEV_SUBNET_PREFIX:-10.71}.0.2
      app:
        ipv4_address: ${HR_DEV_SUBNET_PREFIX:-10.71}.1.2
        aliases: [idp-internal]
      idp:
        ipv4_address: ${HR_DEV_SUBNET_PREFIX:-10.71}.2.2
      mail:
        ipv4_address: ${HR_DEV_SUBNET_PREFIX:-10.71}.5.2
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
    depends_on:
      web:
        condition: service_healthy
      core-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  postgres:
    <<: *service
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres/POSTGRES_PASSWORD
      DIVALHR_DB_NAME: divalhr
      DIVALHR_DB_USER: divalhr_app
      KEYCLOAK_DB_NAME: keycloak
      KEYCLOAK_DB_USER: keycloak
      SECRETS_DIR: /run/secrets/postgres
    volumes:
      - ${HR_DEV_DATA:?}/postgres:/var/lib/postgresql/data
      - ${HR_DEV_DATA:?}/secrets/postgres:/run/secrets/postgres:ro
      - ./postgres/10-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    networks: [core-data, idp-data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  mailpit:
    <<: *service
    image: axllent/mailpit:v1.29.6@sha256:0b5c5f7ffd3c93474baa7fd3869c1462e5a3d03256ed0933dfc0e7d81d794036
    environment:
      MP_MAX_MESSAGES: '1000'
      MP_DATABASE: /data/mailpit.db
      MP_WEBROOT: /mail/
    volumes:
      - ${HR_DEV_DATA:?}/mailpit:/data
    networks: [core-data, idp-data, mail]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 128m

  keycloak:
    <<: *service
    image: ${HR_DEV_IMAGE_PREFIX:-divalhr-test}/keycloak:${HR_DEV_RELEASE:?}
    build:
      context: ../..
      dockerfile: infrastructure/docker/keycloak/Dockerfile
      args:
        # Production-mode build (section 4): PostgreSQL, single node, /identity, health.
        KC_BUILD_OPTIONS: --db=postgres --cache=local --http-relative-path=/identity --health-enabled=true
    command: ['start', '--optimized', '--import-realm']
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: ${HR_DEV_ORIGIN:?}/identity
      # Owner's console through the SSH tunnel (A65-2): the admin URL is not the public one.
      KC_HOSTNAME_ADMIN: http://localhost:${HR_DEV_ADMIN_PORT:-18180}/identity
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      # One node: no cluster discovery (otherwise a restarted Keycloak waits for its former self).
      KC_CACHE: local
      # Only Caddy's address on the idp network may set X-Forwarded-*.
      KC_PROXY_TRUSTED_ADDRESSES: ${HR_DEV_SUBNET_PREFIX:-10.71}.2.2
      KC_SPI_REALM_RESTAPI_EXTENSION__DIVALHR_PROVISIONING__REALMS: divalhr-test
      KC_SPI_REALM_RESTAPI_EXTENSION__DIVALHR_PROVISIONING__WEB_REDIRECT_URI: ${HR_DEV_ORIGIN:?}/auth/callback
    volumes:
      # db-password and the one-time bootstrap-admin-password (removed after first start).
      - ${HR_DEV_DATA:?}/secrets/keycloak/keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
      # Rendered by remote-deploy.sh from realm-divalhr-test.json; imported on first start only.
      - ${HR_DEV_DATA:?}/keycloak/import:/opt/keycloak/data/import:ro
    networks: [idp, idp-data]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /identity/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  core-api:
    <<: *service
    image: ${HR_DEV_IMAGE_PREFIX:-divalhr-test}/core-api:${HR_DEV_RELEASE:?}
    build:
      context: ../../apps/core-api
    environment:
      DIVALHR_ENVIRONMENT: test
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/core/
      DIVALHR_DB_URL: jdbc:postgresql://postgres:5432/divalhr
      DIVALHR_DB_USER: divalhr_app
      DIVALHR_OIDC_ISSUER: ${HR_DEV_ORIGIN:?}/identity/realms/divalhr-test
      # Backchannel through Caddy's internal route (A65-2), never to Keycloak directly.
      DIVALHR_OIDC_JWKS_URI: http://idp-internal:8081/identity/realms/divalhr-test/protocol/openid-connect/certs
      DIVALHR_OIDC_AUDIENCE: divalhr-core-api
      DIVALHR_CORS_ALLOWED_ORIGINS: ${HR_DEV_ORIGIN:?}
      DIVALHR_API_DOCS_ENABLED: 'false'
      DIVALHR_WEB_BASE_URL: ${HR_DEV_ORIGIN:?}
      DIVALHR_KEYCLOAK_ADMIN_URL: http://idp-internal:8081/identity
      DIVALHR_KEYCLOAK_REALM: divalhr-test
      DIVALHR_MAIL_HOST: mailpit
      DIVALHR_MAIL_PORT: '1025'
      DIVALHR_MAIL_FROM: no-reply@hr-dev.example.test
      DIVALHR_MAIL_STARTTLS: 'false'
    volumes:
      - ${HR_DEV_DATA:?}/secrets/core:/run/secrets/core:ro
    networks: [app, core-data]
    deploy:
      resources:
        limits:
          memory: 1536m
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  ai-service:
    <<: *service
    image: ${HR_DEV_IMAGE_PREFIX:-divalhr-test}/ai-service:${HR_DEV_RELEASE:?}
    build:
      context: ../../apps/ai-service
    environment:
      DIVALHR_AI_ENVIRONMENT: test
      DIVALHR_AI_CORS_ALLOWED_ORIGINS: ${HR_DEV_ORIGIN:?}
    networks: [app]
    deploy:
      resources:
        limits:
          memory: 256m

  web:
    <<: *service
    image: ${HR_DEV_IMAGE_PREFIX:-divalhr-test}/web:${HR_DEV_RELEASE:?}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      DIVALHR_ENVIRONMENT: test
      DIVALHR_CORE_API_URL: ${HR_DEV_ORIGIN:?}/api/v1
      DIVALHR_AI_SERVICE_URL: ${HR_DEV_ORIGIN:?}/ai/api/v1
      DIVALHR_OIDC_AUTHORITY: ${HR_DEV_ORIGIN:?}/identity/realms/divalhr-test
      DIVALHR_OIDC_CLIENT_ID: divalhr-web
      DIVALHR_OIDC_ORIGIN: ${HR_DEV_ORIGIN:?}
      DIVALHR_CSP_CONNECT_SRC: ${HR_DEV_ORIGIN:?}
    networks: [app]
    deploy:
      resources:
        limits:
          memory: 128m
