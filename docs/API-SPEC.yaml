      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Approve or reject a leave request that no qualifying manager covers
      description: >-
        MVP-041E. An administrator override of a routing exception: under the tenant's manager-graph
        lock, the request's policy route must be MANAGER, the request PENDING and no active,
        non-superseded MANAGER line may cover its employment on its first day; then it moves to
        APPROVED or REJECTED, once, with its reason, in one transaction with the decision record
        (approvalRoute stays MANAGER, decisionAuthority TENANT_ADMIN_OVERRIDE, no manager), the
        audit record (leave-request.routing-exception.approve or .reject) and the outbox event
        (people.leave-request.routing-exception-approved.v1 or -rejected.v1). The policy version and
        the request's route are never rewritten. Unknown, foreign-tenant, TENANT_ADMIN-routed and
        currently managed requests are the same 404 LEAVE_REQUEST_NOT_FOUND with no params; a
        terminal MANAGER-routed request is 409 LEAVE_REQUEST_ALREADY_DECIDED,
        LEAVE_REQUEST_ALREADY_CANCELLED or LEAVE_REQUEST_ALREADY_AMENDED (no params). Approving
        requires the request's employment to still cover its whole interval (409
        LEAVE_REQUEST_NOT_ELIGIBLE with params.reason EMPLOYMENT_PERIOD); rejecting does not. Only
        the body's shape is checked before the idempotency decision: an exact retry returns the
        stored 200 with Idempotent-Replayed true while the stored decision is this tenant's
        override (a manager assigned after it does not invalidate it), a changed body on the same
        key is 409 IDEMPOTENCY_KEY_REUSED. The receipt never contains the reason; errors never echo
        it. Shares the leave-approval-write limits. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideLeaveRequest"
      responses:
        "200":
          description: Decided, or the original override replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveDecisionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
