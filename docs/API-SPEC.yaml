        - locale
        - versionNumber
        - state
        - title
        - body
        - placeholders
        - bodySha256
        - grammarVersion
        - digestVersion
        - createdAt
        - updatedAt
        - approvedAt
        - retiredAt
        - version
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        locale:
          $ref: "#/components/schemas/ContractLocale"
        versionNumber:
          type: integer
          minimum: 1
        state:
          $ref: "#/components/schemas/ContractTemplateVersionState"
        title:
          type: string
        body:
