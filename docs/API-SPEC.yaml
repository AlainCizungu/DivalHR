          schema:
            $ref: "#/components/schemas/AssignmentKind"
        - name: includeSuperseded
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/TimelineLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of assignment rows
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
