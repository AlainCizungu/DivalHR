  /work-schedules/preview:
    post:
      operationId: previewWorkSchedule
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Preview a site work schedule
      description: >-
        MVP-050A. Evaluates a complete proposed schedule against the current facts and stores
        nothing but its disclosure audit record (work-schedule.preview); there is no draft. The
        site is the operational clock: the server resolves the selected site's IANA time zone
        (siteTimezone) and its business date (asOf, today in that zone), which the client cannot
        choose; the organization's time zone plays no part. Whole-schedule rules are errors: the
        dates in order, at most 31 days, the first today or later in the site's calendar (422
        WORK_SCHEDULE_PERIOD_INVALID, params.reason ORDER, TOO_LONG or PAST); a site of the
        organization in effect on every date (422 WORK_SCHEDULE_SITE_NOT_ACTIVE, unknown and
        foreign alike); no operational (published, not cancelled or replaced, MVP-050B) schedule of the site
        on any of the dates (409 WORK_SCHEDULE_OVERLAP); 1 to 500 slots (400 slots REQUIRED; 422
        WORK_SCHEDULE_LIMIT_EXCEEDED, params.maximum 500). Slot rules are per-slot issues, the
        first one found: WORK_SCHEDULE_SLOT_INVALID (OUTSIDE_PERIOD, END_NOT_AFTER_START,
        TOO_LONG: beyond the next date or 24 hours, LOCAL_TIME_INVALID: a local time that does not
        exist or happens twice in the site's time zone, never guessed), WORK_SCHEDULE_EMPLOYEE_NOT_ELIGIBLE
        (NOT_FOUND: unknown or foreign, SEPARATED: a separation effective before the slot ends,
        NOT_EMPLOYED: not employed on every local date the slot occupies, NOT_AT_SITE: no placement
        at the site on its start date) and WORK_SCHEDULE_EMPLOYEE_CONFLICT (PUBLISHED: an
        overlapping operational assignment at any site, IN_SCHEDULE: an earlier overlapping slot of
        this proposal). Returns the normalized slots with their instants, assigned employees'
        current directory names, issues, derived totals, warnings (UNCOVERED_SLOTS), whether it is
        publishable and the domain-separated previewDigest binding the site's business date and
        time zone, the site, every slot and every eligibility fact (employments with their versions, placements,
        separations). Restricted HR: a fail-closed disclosure. Shares the work-schedule-write
        limit. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkScheduleRequest"
      responses:
        "200":
          description: The evaluated proposal
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSchedulePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
