      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Preview the weekly draft timesheets of one site
      description: >-
        MVP-070A. Resolves, in the verified tenant, the site and its site-local week (Monday 00:00
        to the next Monday 00:00 in the site's IANA time zone; weekStart is the local Monday of the
        current week or an earlier one, never derived from the browser) and returns the week's exact
        UTC boundaries, the week's existing generation if any, and what a generation would hold now:
