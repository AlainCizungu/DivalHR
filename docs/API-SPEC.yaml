components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.divalhr.com/oauth2/authorize
          tokenUrl: https://identity.divalhr.com/oauth2/token
          scopes:
            organizations:read: Read authorized organizations
            employees:read: Read authorized employees
            employees:write: Manage authorized employees
            attendance:write: Record attendance
            payroll:read: Read authorized payroll data
  headers:
    CorrelationId:
      description: Correlation ID echoed from the request or generated by the server.
      schema:
        type: string
    IdempotentReplayed:
      description: Present with value "true" when the response replays an earlier successful request.
      schema:
        type: string
        enum: ["true"]
    CacheControlNoStore:
      description: Public invitation responses are never stored by browsers or intermediaries.
      schema:
        type: string
        enum: [no-store]
    CacheControlPrivateNoStore:
      description: >-
        Invitation administration responses may contain email addresses; browsers, offline caches
        and intermediaries must not retain them.
      schema:
        type: string
        enum: ["private, no-store"]
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    WwwAuthenticateStepUp:
      description: >-
        RFC 9470 step-up challenge, sent with MFA_REQUIRED only:
        Bearer error="insufficient_user_authentication", acr_values="urn:divalhr:loa:mfa".
        The client starts a new authorization request with those acr_values.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not permitted (including missing or foreign tenant)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PrivilegedForbidden:
      description: >-
        Authenticated but not permitted. Privileged operations (x-divalhr-required-assurance: mfa)
        additionally return MFA_REQUIRED when the verified access token's acr claim is not exactly
        urn:divalhr:loa:mfa (multifactor authentication not completed for this session). Checks run
        in this order before the request is read: verified subject, required role (ACCESS_DENIED),
        verified tenant (TENANT_CONTEXT_MISSING), then MFA assurance (MFA_REQUIRED), then, for
        tenant-scoped operations, a matching tenant membership (MVP-012A): the caller's membership
        must belong to the token's tenant and carry exactly the required role, which the token must
        also hold. A missing or non-matching membership returns the same ACCESS_DENIED as a missing
        role, with no further detail. MFA_REQUIRED carries no params and never echoes claims,
        roles, subject, tenant or request data.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticateStepUp"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: >-
        Invalid request. VALIDATION_FAILED lists params.fields[{field, constraint}] with
        constraint REQUIRED, LENGTH, FORMAT, RANGE, DUPLICATE or UNKNOWN_PROPERTY. The
        *_NOT_SUPPORTED codes carry params.field and params.supported. EFFECTIVE_DATE_INVALID,
        SITE_PERIOD_OUTSIDE_LEGAL_ENTITY, DEPARTMENT_PERIOD_OUTSIDE_SITE,
        COST_CENTER_PERIOD_OUTSIDE_SITE, REGION_PERIOD_OUTSIDE_LEGAL_ENTITY,
        TEAM_PERIOD_OUTSIDE_DEPARTMENT and TEAM_PERIOD_OUTSIDE_COST_CENTER carry params.field
        (effectiveFrom or effectiveTo). TEAM_PARENT_REQUIRED (no parent supplied) and
        TEAM_PARENT_AMBIGUOUS (both parents supplied) carry no params and follow format
        validation. SITE_PERIOD_OUTSIDE_REGION and
        SITE_REGION_LEGAL_ENTITY_MISMATCH carry params.field = regionId. CURSOR_INVALID carries no
        params. Invitation fields (email, role, locale) use VALIDATION_FAILED; an unsupported role,
        including platform-admin, is constraint FORMAT exactly like any unknown value. Submitted
        values, and email addresses in particular, are never echoed. IMPORT_FILE_INVALID (MVP-020)
        carries params.reason (EMPTY, ENCODING, DELIMITER, MALFORMED, LINE_TOO_LONG,
        TOO_MANY_COLUMNS, COLUMN_UNKNOWN, COLUMN_DUPLICATE, COLUMN_MISSING, NO_ROWS or
        TOO_MANY_ROWS) and, for header problems, params.column (1-based header position, or the
        missing column key for COLUMN_MISSING); the file content is never echoed. A request body
        that is not text/csv (multipart included) is VALIDATION_FAILED on field Content-Type.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        IDEMPOTENCY_KEY_REUSED (the key was already used with a different payload), or
        DUPLICATE_LEGAL_ENTITY_CODE / DUPLICATE_SITE_CODE / DUPLICATE_DEPARTMENT_CODE /
        DUPLICATE_COST_CENTER_CODE / DUPLICATE_REGION_CODE / DUPLICATE_TEAM_CODE (the code
        already exists for that
        resource type in the tenant, in any letter case), or SITE_REGION_ALREADY_ASSIGNED (the site
        already has a different region; carries no params), or INVITATION_ALREADY_PENDING /
        INVITATION_RECIPIENT_ALREADY_MEMBER (params.field = email; only the caller's own tenant is
        consulted), INVITATION_NOT_PENDING (the invitation is accepted, expired or being
        accepted), INVITATION_CANNOT_BE_ACCEPTED or INVITATION_ACCEPTANCE_IN_PROGRESS (no params),
        or TENANT_ADMIN_BOOTSTRAP_UNAVAILABLE (the organization already has a tenant administrator
        or an open tenant-admin invitation; no params, and which of the two is not disclosed), or,
        for employee imports (MVP-020), IMPORT_LIMIT_REACHED (3 open imports in the tenant),
        IMPORT_NOT_COMMITTABLE (params.status: the import is no longer open), IMPORT_PREVIEW_CHANGED
        (the commit does not repeat the staged preview), IMPORT_STALE (a row became invalid since
        the preview; nothing was created) or IMPORT_NOTHING_TO_COMMIT (no valid row), or, for
        employment history (MVP-021), EMPLOYMENT_VERSION_CONFLICT (the employment changed since the
        preview), EMPLOYMENT_PREVIEW_CHANGED (the recomputed change differs from the preview),
        EMPLOYMENT_CHANGE_DATE_TAKEN (the kind already changes on that date),
        EMPLOYMENT_CHANGE_NOT_CANCELLABLE (not an active future change) or
        EMPLOYMENT_CHANGE_HAS_DEPENDENTS (a later row derives from the change), or, for
        separations (MVP-022), SEPARATION_EXISTS (the employment already has a separation that is
        not cancelled), SEPARATION_FUTURE_CHANGES (future effects after the last day must be
        cancelled first; params.count), SEPARATION_PROTECTED (params.reason SELF or ADMIN_ACCESS),
        SEPARATION_PREVIEW_CHANGED, SEPARATION_NOT_CANCELLABLE (params.reason NOT_SCHEDULED,
        ACCESS_ALREADY_REVOKED or HISTORY_CHANGED_SINCE), SEPARATION_TASK_VERSION_CONFLICT,
        SEPARATION_TASK_CLOSED, ACCESS_LINK_CONFLICT (params.reason EMPLOYEE_LINKED,
        ALREADY_LINKED or ACCESS_REVOKED), ACCESS_LINK_LOCKED, ACCESS_LINK_VERSION_CONFLICT or
        ACCESS_REVOCATION_NOT_RETRYABLE. Other MVP-021/022 codes carry no params.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: >-
        LEGAL_ENTITY_NOT_FOUND, SITE_NOT_FOUND, REGION_NOT_FOUND, DEPARTMENT_NOT_FOUND,
        COST_CENTER_NOT_FOUND, INVITATION_NOT_FOUND, EMPLOYEE_IMPORT_NOT_FOUND, EMPLOYEE_NOT_FOUND,
        EMPLOYMENT_CHANGE_NOT_FOUND, SEPARATION_NOT_FOUND, SEPARATION_TASK_NOT_FOUND or
        MEMBERSHIP_NOT_FOUND (MVP-022; also for an address with no membership) - the referenced
        resource does not exist in the caller's tenant. Missing and foreign-tenant resources are
        indistinguishable. ORGANIZATION_NOT_FOUND (platform operations) - the organization ID is
        malformed, unknown or not active; the cases are indistinguishable and the ID is never
        echoed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >-
        INVITATION_RATE_LIMITED (the tenant's invitation quota is used up),
        INVITATION_RESEND_LIMITED (at most 3 reissues per invitation, at least 5 minutes apart) or
        RATE_LIMITED (too many anonymous requests from one client, too many bootstrap
        invitations created by one platform administrator, more than 30 access-review requests
        per minute by one subject, or, for employee imports, more than 10 upload and commit
        requests per minute by one subject, 30 uploads or 60 commits per 10 minutes in one tenant,
        or, for employees and employment history, more than 60 reads, searches and previews or 20
        changes and cancellations per minute by one subject, 300 searches or 200 changes and
        cancellations per 10 minutes in one tenant).
        Limits are per instance. No params.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: >-
        IDENTITY_PROVIDER_UNAVAILABLE - the identity provider could not be reached; retry with the
        same token. IMPORT_TIMEOUT - an employee import's database work exceeded its time limit and
        was rolled back entirely; retry with the same Idempotency-Key. EMPLOYMENT_CHANGE_TIMEOUT -
        an employment change or cancellation, a separation, its cancellation or an access-link
        change exceeded its time limit or met a lock held by a background job, and nothing was
        written; retry with the same Idempotency-Key. No params.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestTimeout:
      description: >-
        IMPORT_UPLOAD_TIMEOUT - the CSV body was not received within the upload time limit; nothing
        was stored. No params.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: >-
        IMPORT_FILE_TOO_LARGE - the CSV body exceeds 2 MiB; reading stopped at the limit and nothing
        was stored. No params.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: >-
        MVP-021 business rules. EMPLOYMENT_CHANGE_NO_EFFECT (params.field: the assignment kind whose
        value would not change), EMPLOYMENT_DATE_OUTSIDE_EMPLOYMENT, RETROACTIVE_WINDOW_EXCEEDED
        (before the configurable pilot window, 60 days by default), MANAGER_INVALID (params.reason:
        NOT_FOUND, SELF, NOT_EMPLOYED, CYCLE or CHAIN_TOO_DEEP) or PLACEMENT_INVALID (params.field:
        legalEntityId, siteId, departmentId, costCenterId or teamId; params.reason: NOT_FOUND,
        MISMATCH, NOT_EFFECTIVE or ENDS_DURING_PERIOD). MVP-022: SEPARATION_DATE_OUT_OF_RANGE
        (before the employment start, the retroactive window, or more than 180 days ahead),
        SEPARATION_ACCESS_TIMING_INVALID (IMMEDIATELY with a future last day),
        SEPARATION_ACKNOWLEDGEMENT_REQUIRED (params.acknowledgement),
        SEPARATION_REPORT_PLAN_REQUIRED, SEPARATION_TOO_MANY_INTERVALS (params.count) and
        MANAGER_INVALID for the replacement manager. Params never carry a date, a value or an ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: >-
        INTERNAL_ERROR - the request could not be completed; nothing was disclosed or changed. For
        the access review this includes a disclosure audit that could not be committed. No params.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvitationInvalid:
      description: >-
        INVITATION_INVALID - the token is unknown, malformed, expired, revoked or already used. The
        cases are indistinguishable. No params.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional caller-supplied ID (8-64 chars of A-Z a-z 0-9 . _ -); otherwise generated.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{8,64}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated key, scoped to the operation and the authenticated subject. Records are
        retained for at least 7 days and honoured until cleanup removes them; cleanup never removes
        a record before its retention boundary.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{16,128}$"
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: >-
        The target organization (its ID is the tenant ID). Taken only from the path; never from
        the caller's tenant claim. Malformed, missing and non-active IDs give the same 404
        ORGANIZATION_NOT_FOUND.
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque, signed continuation token from a previous page's nextCursor. It is bound to the
        operation, tenant and filters that produced it; any other use returns CURSOR_INVALID.
      schema:
        type: string
        maxLength: 512
    EmployeeImportId:
      name: importId
      in: path
      required: true
      description: Malformed, unknown and foreign IDs give the same 404 EMPLOYEE_IMPORT_NOT_FOUND.
      schema:
        type: string
    EmployeeImportRowLimit:
      name: limit
      in: query
      description: Rows per page for the import preview (1-100, default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EmployeeId:
      name: employeeId
      in: path
      required: true
      description: Malformed, unknown and foreign IDs give the same 404 EMPLOYEE_NOT_FOUND.
      schema:
        type: string
    EmploymentChangeId:
      name: changeId
      in: path
      required: true
      description: >-
        Malformed, unknown, foreign and other-employee IDs give the same 404
        EMPLOYMENT_CHANGE_NOT_FOUND.
      schema:
        type: string
    SeparationId:
      name: separationId
      in: path
      required: true
      description: >-
        Malformed, unknown, foreign and other-employee IDs give the same 404 SEPARATION_NOT_FOUND.
      schema:
        type: string
    SeparationTaskId:
      name: taskId
      in: path
      required: true
      description: Malformed, unknown and other-separation IDs give the same 404 SEPARATION_TASK_NOT_FOUND.
      schema:
        type: string
    EmployeeLimit:
      name: limit
      in: query
      description: Items per page (1-50, default 25).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    TimelineLimit:
      name: limit
      in: query
      description: Rows per page (1-100, default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AccessReviewLimit:
      name: limit
      in: query
      description: Entries per page for the access review (1-50, default 25).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ContractTemplateId:
      name: templateId
      in: path
      required: true
      description: Malformed, unknown and foreign IDs give the same 404 CONTRACT_TEMPLATE_NOT_FOUND.
      schema:
        type: string
    ContractTemplateVersionId:
      name: versionId
      in: path
      required: true
      description: Malformed, unknown, foreign and other-template IDs give the same 404 CONTRACT_TEMPLATE_NOT_FOUND.
      schema:
        type: string
    ContractId:
      name: contractId
      in: path
      required: true
      description: Malformed, unknown, foreign and other-employee IDs give the same 404 CONTRACT_NOT_FOUND.
      schema:
        type: string
    ContractLimit:
      name: limit
      in: query
      description: Items per page (1-50, default 25).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
  schemas:
    AccessReviewLookup:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
          description: Exact address; normalized like invitations. Never echoed or logged.
    AccessReviewPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AccessReviewEntry"
        nextCursor:
          type: string
          description: Present only when another page exists.
    AccessReviewEntry:
      type: object
      description: >-
        One tenant membership: an active one, or (MVP-022) one whose access a separation revoked,
        labelled accessState REVOKED. Never contains the identity subject, username, name, source
        invitation, tokens, credential or MFA state, or identity-provider roles.
      required:
        [membershipId, email, role, grantedAt, accessState, directScope, effectiveScope,
         matchedUnit]
      properties:
        accessState:
          type: string
          description: >-
            ACTIVE (the membership gate admits it) or REVOKED (MVP-022: a separation ended its
            DivalHR access; the gate denies it). A revocation that is only scheduled is still
            ACTIVE until it takes effect.
          enum: [ACTIVE, REVOKED]
        membershipId:
          type: string
          format: uuid
        email:
          type: [string, "null"]
          description: Confidential; null when the address was not recorded (historical rows).
        role:
          $ref: "#/components/schemas/InvitationRole"
        grantedAt:
          type: string
          format: date-time
        directScope:
          $ref: "#/components/schemas/AccessReviewDirectScope"
        effectiveScope:
          $ref: "#/components/schemas/AccessReviewEffectiveScope"
        matchedUnit:
          oneOf:
            - $ref: "#/components/schemas/AccessReviewMatchedUnit"
            - type: "null"
    AccessReviewDirectScope:
      type: object
      description: >-
        The scope granted by the membership. Only TENANT exists today; LEGAL_ENTITY and SITE are
        reserved for story S1 and will be added with it.
      required: [type]
      properties:
        type:
          type: string
          enum: [TENANT]
    AccessReviewEffectiveScope:
      type: object
      required: [type, coversAllLegalEntitiesAndSites]
      properties:
        type:
          type: string
          enum: [TENANT]
        coversAllLegalEntitiesAndSites:
          type: boolean
          enum: [true]
    AccessReviewMatchedUnit:
      type: object
      description: >-
        Present when the request filtered by a unit. Only INHERITED_FROM_TENANT exists today;
        DIRECT is reserved for story S1.
      required: [type, id, inheritance]
      properties:
        type:
          type: string
          enum: [LEGAL_ENTITY, SITE]
        id:
          type: string
          format: uuid
        inheritance:
          type: string
          enum: [INHERITED_FROM_TENANT]
    AccessReviewSummary:
      type: object
      required: [byRole]
      properties:
        byRole:
          type: object
          additionalProperties: false
          required: [tenant-admin, employee]
          properties:
            tenant-admin:
              type: integer
              minimum: 0
            employee:
              type: integer
              minimum: 0
    Organization:
      type: object
      description: An organization. Its id is also the tenant identifier.
      required: [id, name, countryCode, defaultLocale, timezone, currencies, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        countryCode:
          type: string
          enum: [CD]
        defaultLocale:
          type: string
          enum: [fr, en]
        timezone:
          type: string
          enum: [Africa/Kinshasa, Africa/Lubumbashi]
        currencies:
          type: array
          items:
            type: string
            enum: [CDF, USD]
        status:
          type: string
          enum: [ACTIVE]
        createdAt:
          type: string
          format: date-time
    CreateOrganization:
      type: object
      additionalProperties: false
      required: [name, countryCode, defaultLocale, timezone, currencies]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
          description: Trimmed before validation; 2-160 Unicode characters.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2. The MVP supports CD only.
          enum: [CD]
          example: CD
        defaultLocale:
          type: string
          enum: [fr, en]
        timezone:
          type: string
          description: IANA time zone supported for the country.
          enum: [Africa/Kinshasa, Africa/Lubumbashi]
          x-divalhr-timezones-by-country:
            CD: [Africa/Kinshasa, Africa/Lubumbashi]
        currencies:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [CDF, USD]
    LegalEntity:
      type: object
      required: [id, code, name, countryCode, effectiveFrom, effectiveTo, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[A-Z0-9_-]{2,20}$"
        name:
          type: string
        countryCode:
          type: string
          enum: [CD]
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
        createdAt:
          type: string
          format: date-time
    CreateLegalEntity:
      type: object
      additionalProperties: false
      required: [code, name, countryCode, effectiveFrom]
      properties:
        code:
          type: string
          description: Trimmed and upper-cased; 2-20 of A-Z, 0-9, hyphen and underscore.
          pattern: "^\\s*[A-Za-z0-9_-]{2,20}\\s*$"
        name:
          type: string
          minLength: 2
          maxLength: 160
        countryCode:
          type: string
          enum: [CD]
        effectiveFrom:
          type: string
          format: date
          description: Inclusive, between 1900-01-01 and 2999-12-31.
        effectiveTo:
          type: [string, "null"]
          format: date
          description: Inclusive and not earlier than effectiveFrom; omit or null for open-ended.
    LegalEntityPage:
