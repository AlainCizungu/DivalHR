      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTimesheet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/timesheets/{timesheetId}/submissions:
    post:
      operationId: submitMyTimesheet
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Submit my clean weekly timesheet to my manager
      description: >-
        MVP-070B/C. The employee of the caller's active employee-access link submits one of their
        own DRAFT timesheets: the reviewed revision and generation version must still be current
        (otherwise 409 TIMESHEET_DECISION_STALE), the revision must have at least one READY row and
        no MISSING_ATTENDANCE, OPEN_ATTENDANCE or SOURCE_CHANGED row (otherwise 409
        TIMESHEET_SUBMISSION_NOT_ALLOWED), and the approval route must resolve to exactly one
        manager, effective on the site-local Sunday of the week under the current employment
        history, who is not the employee and holds an active employee membership and link
        (otherwise 409 TIMESHEET_APPROVAL_ROUTE_UNAVAILABLE, never naming anyone). One transaction
        with the append-only SUBMITTED action (the next cycle, the revision, its source digest and
        totals, the generation version, the employment, the routed manager, the verified subject
        and the instant), the timesheet's SUBMITTED state, the audit record (timesheet.submit) and
        the outbox event (people.timesheet.submitted.v1). Employee, tenant, actor and route never
        come from the request. Another employee's, a foreign, malformed or unknown timesheet is the
        same 404 TIMESHEET_TARGET_NOT_FOUND. Idempotent. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTimesheetRequest"
      responses:
        "200":
          description: Submitted, or the original replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetActionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/time-approvals:
    get:
      operationId: listMyTimeApprovals
