        - state
      properties:
        id:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        employee:
          $ref: "#/components/schemas/LeaveApprovalEmployee"
        policyId:
          type: string
          format: uuid
        policyVersionId:
          type: string
          format: uuid
        policyCode:
          type: string
        policyNames:
          $ref: "#/components/schemas/LeavePolicyNames"
        unit:
          $ref: "#/components/schemas/LeaveUnit"
        amount:
