        - $ref: "#/components/parameters/LeavePolicyLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveApprovalSubstitutionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
