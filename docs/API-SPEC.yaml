        approved worked minutes of the rows within the period from LOCKED weeks whose current
        timesheets and approvals still match their lock evidence; the exclusions with stable codes
        (ROW_OUTSIDE_PERIOD, TIMESHEET_WITHOUT_TIME); the blockers with stable codes
        (WEEK_NOT_GENERATED, WEEK_NOT_LOCKED, EVIDENCE_CHANGED, ATTRIBUTION_AMBIGUOUS,
        NO_APPROVED_TIME; any blocker fails the whole period closed, never a partial run); the
        source versions digest; a preview digest valid while the evidence, versions and readiness
        are identical and until expiresAt (15 to 30 minutes); and the existing run of this legal
        entity and period, if any, with whether its evidence is unchanged. Payroll inputs only:
        nothing here calculates pay. No name, employee number, subject or amount. A malformed,
        unknown or foreign legal entity is 404 PAYROLL_INPUT_TARGET_NOT_FOUND. A fail-closed
        disclosure (audit payroll-input.preview). Shares the payroll-input-write limit.
