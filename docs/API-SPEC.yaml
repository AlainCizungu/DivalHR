    ErrorCode:
      type: string
      description: Stable machine-readable code. Clients translate it; it is never localized text.
      enum:
        - VALIDATION_FAILED
        - AUTHENTICATION_REQUIRED
        - ACCESS_DENIED
        - TENANT_CONTEXT_MISSING
        - TENANT_ACCESS_DENIED
        - NOT_FOUND
        - IDEMPOTENCY_KEY_REUSED
        - COUNTRY_NOT_SUPPORTED
        - LOCALE_NOT_SUPPORTED
        - TIMEZONE_NOT_SUPPORTED
        - CURRENCY_NOT_SUPPORTED
        - LEGAL_ENTITY_NOT_FOUND
        - DUPLICATE_LEGAL_ENTITY_CODE
        - DUPLICATE_SITE_CODE
        - EFFECTIVE_DATE_INVALID
        - SITE_PERIOD_OUTSIDE_LEGAL_ENTITY
        - CURSOR_INVALID
        - SITE_NOT_FOUND
        - DUPLICATE_DEPARTMENT_CODE
        - DUPLICATE_COST_CENTER_CODE
        - DEPARTMENT_PERIOD_OUTSIDE_SITE
        - COST_CENTER_PERIOD_OUTSIDE_SITE
        - REGION_NOT_FOUND
        - DUPLICATE_REGION_CODE
        - REGION_PERIOD_OUTSIDE_LEGAL_ENTITY
        - SITE_PERIOD_OUTSIDE_REGION
        - SITE_REGION_LEGAL_ENTITY_MISMATCH
        - SITE_REGION_ALREADY_ASSIGNED
        - TEAM_PARENT_REQUIRED
        - TEAM_PARENT_AMBIGUOUS
        - DEPARTMENT_NOT_FOUND
        - COST_CENTER_NOT_FOUND
        - DUPLICATE_TEAM_CODE
        - TEAM_PERIOD_OUTSIDE_DEPARTMENT
        - TEAM_PERIOD_OUTSIDE_COST_CENTER
        - INTERNAL_ERROR
    Problem:
      type: object
      description: RFC 9457 problem details with DivalHR extensions.
      required: [type, title, status, code, params, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        params:
          type: object
          description: Safe interpolation parameters. Never contains personal data.
          additionalProperties: true
        correlationId:
          type: string
