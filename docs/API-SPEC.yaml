  /me/time-approvals/{timesheetId}/approval:
    post:
      operationId: approveTimesheet
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Approve a submitted timesheet
      description: >-
        MVP-070B/C. The routed manager approves exactly the reviewed submission: the timesheet must
        be SUBMITTED (otherwise 409 TIMESHEET_DECISION_NOT_ALLOWED); the reviewed revision,
        generation version, cycle and submission action must still be current and the timesheet's
        sources, evaluated again under the scheduling lock and the employments FOR SHARE, must
        still produce exactly the submitted digest and totals (otherwise 409
        TIMESHEET_DECISION_STALE; never a recomputed value); the route must still resolve to the
        caller (otherwise the same 404 TIMESHEET_TARGET_NOT_FOUND as anything unknown). One
        transaction with the append-only APPROVED action, the APPROVED state, the audit record
        (timesheet.approve) and the outbox event (people.timesheet.approved.v1). No note. A tenant
        administrator role grants nothing here. Idempotent; a replay is answered only while the
        caller still holds the route. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveTimesheetRequest"
      responses:
        "200":
          description: Approved, or the original replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetActionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/time-approvals/{timesheetId}/return:
    post:
      operationId: returnTimesheet
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Return a submitted timesheet with a reason
      description: >-
        MVP-070B/C. The same authority and freshness as an approval, with a required reason (10 to
        500 characters after trimming; no control or format character, markup or link; Restricted
        HR/Operations, visible only to the employee, tenant administrators and the routed manager).
