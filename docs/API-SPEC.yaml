  /timesheet-exports:
    post:
      operationId: createTimesheetExport
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Create the immutable export of a reviewed preview
      description: >-
        MVP-070E. Under the tenant's scheduling lock (taken first by every timesheet command), the
        eligibility is evaluated again; a preview digest that no longer matches the evidence, or an
        expired preview, is 409 TIMESHEET_EXPORT_PREVIEW_STALE; no eligible timesheet is 409
        TIMESHEET_EXPORT_EMPTY. The export of identical evidence for the site and week is returned
        as it is (outcome EXISTING); otherwise one transaction writes the immutable READY header,
