      summary: List my timesheets
      description: >-
        MVP-070A. The drafts of the employee of the caller's current active employee-access link
        (403 EMPLOYEE_LINK_REQUIRED otherwise), newest week first, with the site, week, current
        revision, state (DRAFT, SUBMITTED or APPROVED), latest submission cycle and totals. Never
        another employee's timesheet. A fail-closed disclosure (audit
        timesheet.self-list). The signed cursor is bound to the operation, tenant, link, employee
