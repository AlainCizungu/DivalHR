        the week, with exactly one qualifying employment), and one row per slot from the effective
        attendance projection (READY, MISSING_ATTENDANCE or OPEN_ATTENDANCE; worked minutes only for
        READY). At most 500 drafts and 5,000 source rows (422 TIMESHEET_GENERATION_LIMIT_EXCEEDED).
