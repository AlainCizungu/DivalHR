    post:
      operationId: disableWebhook
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Disable a webhook
      description: >-
        MVP-110. Stops new attempts and cancels open deliveries; history stays readable. 409 WEBHOOK_ALREADY_DISABLED when already disabled. Audit webhook.disable. Idempotent.
      tags: [integrations]
