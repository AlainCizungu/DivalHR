        the reason as written, the creation time and, once revoked, the revocation's time and
        reason. The state is derived on the organization's business date (asOf): REVOKED once a
        revocation exists, otherwise SCHEDULED before the first day, ACTIVE within the period and
        EXPIRED after the last day. Never a subject or actor. Restricted HR: recorded as a
        fail-closed disclosure (audit leave-approval-substitution.read); if the audit record cannot
        be written, nothing is returned. The signed cursor is bound to the operation, tenant, caller
        and page size. Shares the leave-approval-read limit. Cache-Control private, no-store.
