          application/json:
            schema:
              $ref: "#/components/schemas/TimesheetPeriodUnlockPreviewRequest"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetPeriodUnlockPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /timesheet-periods/unlocks:
    post:
      operationId: unlockTimesheetPeriod
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Unlock a locked week after its reviewed preview
      description: >-
        MVP-071. Under the tenant's scheduling lock, the generation and its lock projection are
        locked again. A lock version or current LOCKED action that differs from the reviewed one,
        an expired preview, or a preview digest that does not match the current lock, the reason
        and the identical canonical explanation is 409 TIMESHEET_PERIOD_PREVIEW_STALE; a week that
        is not locked is 409 TIMESHEET_PERIOD_NOT_LOCKED. Otherwise one transaction appends the
        immutable UNLOCKED period action (the reversed lock, its evidence and counts, the reason and
        the explanation), moves the projection to OPEN at the next version, writes the audit record
        (timesheet-period.unlock; the explanation only as a digest inside the state digest) and the
        outbox event (people.timesheet-period.unlocked.v1, never the explanation); a failure of any
        of them writes nothing. Unlocking alone changes no timesheet and no export: a later
        attendance correction reopens only the affected timesheets (MVP-070D). Idempotent (an
        identical replay returns the original; a changed payload with the same key is 409
        IDEMPOTENCY_KEY_REUSED). Shares the work-schedule-write limits. Cache-Control private,
        no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
