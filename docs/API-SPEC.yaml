          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkScheduleSubstitutionApprovalPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
