  /me/work-schedule:
    get:
      operationId: listMyWorkSchedule
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: List my published shifts
      description: >-
        MVP-050A. The operational shifts (MVP-051: the slot coverage, so a shift given away by an
        approved substitution leaves the original employee's view and appears in the
        substitute's with assignmentSource SUBSTITUTION) of the employee of the caller's current
        active employee-access link (403 EMPLOYEE_LINK_REQUIRED otherwise), in start order. Without from,
        the default view (R100-2) holds the shifts not yet ended at one server-owned instant
        (asOfInstant, from the server clock): shifts in progress and to come, never ended ones; no
        calendar date is used, since schedules of sites in different time zones share no "today".
        The instant is pinned in the signed cursor and reused by every later page. With from, and
        optionally to (at most 366 days later), the view holds the shifts whose local start date,
        in their own schedule's site time zone, is within the dates; to without from is 400
        (from REQUIRED). Each shift carries both labels, the site's code and name, its local start
        and end and its schedule's siteTimezone (never converted), and an overnight flag. Never
        another employee, an uncovered slot, the publisher or audit data. A fail-closed disclosure
        (audit work-schedule.self-list), not privileged-denial evidence. The signed cursor is
        bound to the operation, tenant, caller, the view's mode and dates (and, for the default
        view, its instant) and the page size; a cursor of one view is refused in the other (400
        CURSOR_INVALID). MVP-060A: each shift carries the caller's own attendance on it
        (NOT_RECORDED, OPEN with the check-in instant, COMPLETED with both instants) and whether
        a check-in or check-out is possible at the view's instant. MVP-060B: how each event was
        recorded (SELF or SUPERVISOR) and, for a supervisor-assisted event, the supervisor's reason
        exactly as submitted; never the supervisor's identity. Shares the
        work-schedule-self-read limit. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/WorkScheduleFrom"
        - $ref: "#/components/parameters/WorkScheduleTo"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LeavePolicyLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyWorkSchedulePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/work-schedule-substitutions:
