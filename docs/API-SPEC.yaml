  /attendance/records/{attendanceRecordId}/correction-preview:
    post:
      operationId: previewAttendanceRecordCorrection
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Preview a correction of an attendance record
      description: >-
        MVP-062 (REPLACE_TIMES). Evaluates the complete new effective check-in and optional
        check-out of one attendance record of the organization, with a closed reasonCode and an
        explanation (10 to 500 characters after trimming; no control character, markup or link).
        An unknown, foreign, malformed or undisclosable record is 404
        ATTENDANCE_CORRECTION_TARGET_NOT_FOUND without params. The values are RFC 3339 instants
        with an explicit offset and at most six fractional digits (microseconds), never clamped,
        reordered or converted: the check-in from 2 hours before the scheduled start (inclusive)
        to the scheduled end (exclusive), the check-out strictly after it and at most 24 hours
        after the scheduled end, and neither more than 5 minutes after the server's instant (400
        VALIDATION_FAILED with RANGE on the field otherwise); values identical to the current ones
        are 409 ATTENDANCE_CORRECTION_NOT_ALLOWED. The employee, employment, schedule and slot
        never change; a record of a schedule cancelled or replaced later stays correctable (warning
        SCHEDULE_NOT_OPERATIONAL). Returns the target (employee ID, number and current name; the
        site and bilingual shift; the immutable boundaries), the before and after values, the
        factual exception types before and after at the same server instant (MVP-060C rules),
        neutral warnings, the server's previewedAt, the targetVersion (the record's correction
        count) and the previewDigest a commit must present. Writes no correction, event or outbox
        row: a fail-closed disclosure (audit attendance.correction-preview, metadata view and
        count only). Shares the work-schedule-write limit. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/AttendanceRecordId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceCorrectionRequest"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCorrectionPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
