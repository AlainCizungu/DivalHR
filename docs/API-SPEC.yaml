  /me/expenses/{expenseId}/receipt:
    put:
      operationId: setMyExpenseReceipt
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Attach or replace the receipt
      description: >-
        MVP-081. Attaches or replaces the one receipt of the editable revision. The body is the raw file (Content-Type application/pdf, image/jpeg or image/png; no multipart), at most 2 MiB and read within 30 seconds, only after the caller, the expense and the expected version have been established; the version is X-Expected-Version and the display name X-Receipt-File-Name (percent-encoded UTF-8, 1-120 characters, no path or markup). The server verifies the leading bytes and structure against the declared type (413 EXPENSE_RECEIPT_TOO_LARGE, 415 EXPENSE_RECEIPT_MEDIA_UNSUPPORTED, 400 EXPENSE_RECEIPT_INVALID, 408 EXPENSE_RECEIPT_UPLOAD_TIMEOUT), computes the SHA-256 digest itself and stores the bytes in PostgreSQL (pilot only; object storage is the production follow-up). Content, name and digest never reach logs, metrics, audit, events or errors. At most 30 receipt changes per employee and 300 per tenant per hour. Idempotent. Audit expense.receipt-set. Cache-Control private, no-store.
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersionHeader"
        - $ref: "#/components/parameters/ReceiptFileNameHeader"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        description: The raw file, at most 2 MiB. The media type must be one of the three and match the bytes; multipart is not accepted.
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: OK, or the original result replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
