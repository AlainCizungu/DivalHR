  /payroll-inputs/{runId}/variance:
    get:
      operationId: reviewPayrollVariance
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Review the worked-time variance between two payroll-input runs
      description: >-
        MVP-091. Compares the worked-minute inputs of a current run with a comparison run of the
        same legal entity, employee by employee (matched by the immutable employee ID; the run's
        employments are listed, never merged across runs). Without comparisonRunId the newest
        eligible run is used. NEW (only in the current run) and MISSING (only in the comparison
        run) are always material; a CHANGED employee is material when the absolute minute delta
        reaches absoluteMinuteThreshold (default 120) or, when the comparison minutes are
        greater than zero, when the absolute percentage reaches percentageThreshold (default 20),
        in exact integer arithmetic; an UNCHANGED employee is never material. Percentages are
        signed basis points, present only when the comparison minutes are greater than zero. The
        totals cover every employee whatever the view and reconcile exactly to the lines. Lines
        are ordered material first, then by largest absolute minute delta, then employee ID. The
        signed cursor is bound to the operation, tenant, both runs, thresholds, view and page
        size. An unknown, foreign, malformed or incompatible run, or no eligible comparison run, is
        404 PAYROLL_VARIANCE_TARGET_NOT_FOUND; invalid thresholds, view or limit are 400 with the
        field only. Worked-time inputs only: no pay, tax, deduction or payment is calculated.
        Read-only: no payroll evidence is written, nothing is stored and no event is emitted. A
        fail-closed disclosure (audit payroll-variance.review). Shares the payroll-input-read limit.
        Cache-Control private, no-store.
      tags: [payroll]
      parameters:
        - $ref: "#/components/parameters/PayrollVarianceRunId"
        - name: comparisonRunId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: absoluteMinuteThreshold
          in: query
          required: false
          description: Whole minutes, 0 to 10080 (default 120).
          schema:
            type: integer
            minimum: 0
            maximum: 10080
            default: 120
        - name: percentageThreshold
          in: query
          required: false
          description: Whole percent, 0 to 100 (default 20).
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
        - name: view
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PayrollVarianceView"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          description: Items per page (1-100, default 25).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollVarianceReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
