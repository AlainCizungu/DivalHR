      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Record a separation
      description: >-
        MVP-022. Repeats a previewed separation with the expectedVersion and previewDigest the
        preview returned and the acknowledgements it required. In one transaction the reporting
        graph, the employments and the access link are locked in the global order, everything is
        recomputed, and the employment is closed on the last day; direct-report intervals are
        rewritten by lineage-backed changes; the linked membership's revocation is scheduled; the
        checklist is created; audit and outbox commit together. Nothing is deleted. Retries with the
        same Idempotency-Key replay the original 201.
        MVP-093A: a last day before the first day of the employee's latest active monthly
        compensation interval is 409 COMPENSATION_EMPLOYMENT_CONFLICT; a separation never rewrites
        compensation, so correct the compensation first.
