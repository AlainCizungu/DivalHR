        cycle:
          type: integer
          minimum: 1
        submissionActionId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
    ReturnTimesheetRequest:
      type: object
      description: MVP-070B/C. Return exactly the reviewed submission with a reason.
