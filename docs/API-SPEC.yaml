        withdrawal record, the audit record (leave-request.withdraw) and the outbox event
        (people.leave-request.withdrawn.v1); the original approval decision is kept unchanged and
        the dates are released in the same commit. Unknown, foreign-tenant and another employee's
        requests are the same 404 LEAVE_REQUEST_NOT_FOUND with no params. A pending request is 409
        LEAVE_REQUEST_NOT_APPROVED, a rejected one 409 LEAVE_REQUEST_ALREADY_DECIDED, a cancelled one
        409 LEAVE_REQUEST_ALREADY_CANCELLED, an amended one 409 LEAVE_REQUEST_ALREADY_AMENDED, an
        already withdrawn one 409 LEAVE_REQUEST_ALREADY_WITHDRAWN and approved leave whose first day
