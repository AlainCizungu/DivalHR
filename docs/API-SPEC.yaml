          format: date
        timezone:
          type: string
        status:
          type: string
          enum: [LOCKED, NOT_GENERATED, NOT_LOCKED, EVIDENCE_CHANGED, EMPTY]
        generationId:
          type: [string, "null"]
          format: uuid
        generationVersion:
          type: [integer, "null"]
          minimum: 1
        lockActionId:
          type: [string, "null"]
          format: uuid
        lockVersion:
          type: [integer, "null"]
