          $ref: "#/components/schemas/LeaveApprovalSubstitutionEmployee"
        substitute:
          $ref: "#/components/schemas/LeaveApprovalSubstitutionEmployee"
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        state:
          $ref: "#/components/schemas/LeaveApprovalSubstitutionState"
        reasonLocale:
          type: string
          enum: [en, fr]
        reason:
          type: string
          description: Plain text, never HTML or Markdown.
        createdAt:
          type: string
          format: date-time
        revocation:
          oneOf:
            - $ref: "#/components/schemas/LeaveApprovalSubstitutionRevocation"
