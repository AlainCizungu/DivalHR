  /me/leave-requests/{requestId}/amendment:
    post:
      operationId: amendMyLeaveRequest
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Amend one of my pending leave requests by replacing it
      description: >-
        MVP-041D. Replaces a PENDING request of the caller's own employee (resolved from the
        caller's current active employee-access link; 403 EMPLOYEE_LINK_REQUIRED otherwise): in one
        transaction the original becomes AMENDED and a new PENDING replacement is created with the
        immutable amendment record (the reason and both request IDs), the audit record
        (leave-request.amend) and the outbox event (people.leave-request.amended.v1). The
        replacement passes every current rule of createMyLeaveRequest on the organization's business
        date (policy coverage, dates, maximum interval, employment coverage, minimum service, amount
        and overlap); only the original is excluded from the overlap, so the replacement may keep,
        move or extend its dates and its policy may change (and with it the approval route).
        Changing nothing but the reason is allowed: the chain still records the explicit
        replacement. A replacement may itself be amended, cancelled or decided later. Unknown,
        foreign-tenant and another employee's requests are the same 404 LEAVE_REQUEST_NOT_FOUND with
        no params; an approved or rejected request is 409 LEAVE_REQUEST_ALREADY_DECIDED, a cancelled
        one 409 LEAVE_REQUEST_ALREADY_CANCELLED and an already amended one 409
        LEAVE_REQUEST_ALREADY_AMENDED, all without params. Only the body's shape is checked before
        the idempotency decision: an exact retry (same Idempotency-Key and body) returns the stored
        201 with Idempotent-Replayed true while the caller is still linked to the same employee;
        with no active link it is 403 EMPLOYEE_LINK_REQUIRED and linked to another employee 404
        LEAVE_REQUEST_NOT_FOUND, with no stored response. A changed body on the key is 409
        IDEMPOTENCY_KEY_REUSED. The receipt never carries the reason; errors never echo a submitted
        value. Shares the leave-request-write limits with createMyLeaveRequest. Cache-Control
        private, no-store.
