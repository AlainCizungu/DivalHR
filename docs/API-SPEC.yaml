        foreign export is 404 PAYROLL_INPUT_TARGET_NOT_FOUND. Worked-time inputs only. Monthly
        salary is not calculated from these minutes. This export does not calculate or authorize
        pay, tax, deductions or payment. Attachment, Cache-Control private, no-store.
