        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LeavePolicyLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveApprovalSubstitutionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createLeaveApprovalSubstitution
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Appoint a leave approval substitute for a manager
      description: >-
        MVP-041G. Appoints one substitute for a manager over inclusive business dates, with a
        reason. While the appointment is effective (the organization's business date within its
        period and no revocation), the substitute lists and decides the MANAGER-routed requests
        whose employment reports to the manager on the request's first day, beside the manager,
        who keeps every right: the first valid decision wins. No chain, sub-delegation,
        notification or automatic activation. Under the tenant's manager-graph lock: manager and
        substitute differ (422 LEAVE_APPROVAL_SUBSTITUTION_SAME_EMPLOYEE); both are employees of
        the organization (404 EMPLOYEE_NOT_FOUND) employed on every day of the period (422
        LEAVE_APPROVAL_SUBSTITUTION_EMPLOYMENT_PERIOD); the manager has an active MANAGER
        reporting line, as the manager, overlapping the period (422
        LEAVE_APPROVAL_SUBSTITUTION_NO_REPORTING_LINE); no other unrevoked appointment of the
        manager overlaps the period (409 LEAVE_APPROVAL_SUBSTITUTION_OVERLAP); all without
        params. One transaction with the append-only appointment, the audit record
        (leave-approval-substitution.create) and the outbox event
        (people.leave-approval-substitution.created.v1). Only the body's shape is checked before
        the idempotency decision: an exact retry returns the stored 201 with Idempotent-Replayed
        true, a changed body on the same key is 409 IDEMPOTENCY_KEY_REUSED. The receipt never
        contains the reason; errors never echo a value. Shares the leave-approval-write limits.
