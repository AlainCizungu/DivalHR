      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Preview an effective-dated change or a correction
      description: >-
        MVP-021. Validates the command and returns, per affected kind, the exact rows before and
        after, the timing, whether a reason and acknowledgement are needed, warnings, the
        employment version and a previewDigest to repeat in the commit. Writes nothing. Recorded as
        a disclosure (audit employment-change.preview). Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmploymentChangeCommand"
      responses:
        "200":
          description: The preview
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentChangePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /employees/{employeeId}/employment-changes/{changeId}/cancel/preview:
    post:
      operationId: previewEmploymentChangeCancellation
