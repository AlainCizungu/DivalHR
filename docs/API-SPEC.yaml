  /invitations:
    get:
      operationId: listInvitations
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: List invitations of the caller's tenant
      description: >-
        Newest first (createdAt then id, both descending), keyset-paginated. The optional status
        filter uses the public status: a PENDING invitation past its expiry is reported and
        filtered as EXPIRED, and one whose acceptance is in progress as PENDING. The response
        contains invitee email addresses (confidential personal data) and is marked
        Cache-Control private, no-store. It never contains tokens, token hashes or identity
        subjects. Cursors are bound to invitation.list, the verified tenant and the status filter.
      tags: [identity]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InvitationStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of invitations
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
    post:
      operationId: createInvitation
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Invite a person by email with one tenant role
      description: >-
        Creates a PENDING invitation in the caller's verified tenant and, after the transaction
        commits, sends the invitation email once. Only tenant-admin and employee can be assigned;
        platform-admin and any other value are rejected like an unknown role. The email address is
        normalized (trimmed, NFC, lower-cased; the domain converted to ASCII) and compared case
        insensitively. Only the caller's own tenant is consulted: 409 INVITATION_ALREADY_PENDING
        when an open invitation for the address exists in the tenant, 409
        INVITATION_RECIPIENT_ALREADY_MEMBER when the address already belongs to a member of the
        tenant. An address known elsewhere gives the same 201 as any other. The response is an
        InvitationReceipt without the email address; retries with the same Idempotency-Key and an
        identical payload replay the original 201 exactly (Idempotent-Replayed), even after the
        invitation changed.
      tags: [identity]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitation"
      responses:
        "201":
          description: Invitation created, or the original creation replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /invitations/{invitationId}/revoke:
    post:
      operationId: revokeInvitation
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Revoke a pending invitation
      description: >-
        PENDING becomes REVOKED and the invitation link stops working immediately. Revoking an
        invitation that is already REVOKED returns 200 with the current invitation and records
        nothing new. An accepted, expired or accepting invitation returns 409
        INVITATION_NOT_PENDING. A missing invitation and one of another tenant return the same
        404 INVITATION_NOT_FOUND; a malformed invitationId returns 400 VALIDATION_FAILED.
      tags: [identity]
      parameters:
        - $ref: "#/components/parameters/InvitationId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The revoked invitation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /invitations/{invitationId}/resend:
    post:
      operationId: resendInvitation
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Reissue a pending invitation with a new link
      description: >-
        Generates a new token, invalidates the previous link, restarts the expiry and sends the
        email once after commit. Only the newest link is valid. At most 3 reissues per invitation,
        at least 5 minutes apart (429 INVITATION_RESEND_LIMITED with Retry-After). Replays with the
        same Idempotency-Key replay the original 200 exactly and send nothing. An invitation whose
        origin is PLATFORM_BOOTSTRAP is never reissued by a tenant administrator (409
        TENANT_ADMIN_BOOTSTRAP_UNAVAILABLE; MVP-014); it can still be revoked.
      tags: [identity]
      parameters:
        - $ref: "#/components/parameters/InvitationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The reissued invitation, or the original reissue replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /access-review/entries:
    get:
      operationId: listAccessReviewEntries
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Review the active access of the caller's organization
      description: >-
        MVP-012B. Lists the caller's organization's tenant memberships with the same authority the
        membership gate enforces (MVP-012A): accessState ACTIVE exactly when the gate admits the
        membership; MVP-022 adds memberships whose access a separation revoked, labelled REVOKED.
        Every member has organization-wide access, so a legal-entity or site filter returns every member with matchedUnit INHERITED_FROM_TENANT
        after checking that the unit exists in the caller's tenant (missing and foreign units are
        indistinguishable 404s). At most one of legalEntityId and siteId. Newest grant first
        (grantedAt then membershipId, both descending), keyset-paginated: stable and
        duplicate-free under concurrent inserts, but not a snapshot (a membership added after the
        first page may be omitted from that traversal and appears on a fresh review). Cursors are
        bound to the operation, tenant, role filter, unit type, unit ID and page size. Contains
        confidential email addresses: Cache-Control private, no-store on every response. Every 200
        is durably audited as access-review.read before the body is written; if the audit cannot
        be committed the response is 500 INTERNAL_ERROR without review data. At most 30 review
        requests per minute per subject across the three access-review operations (429
        RATE_LIMITED with Retry-After). Future direct scopes (LEGAL_ENTITY, SITE; inheritance
        DIRECT) are reserved for story S1 and are not part of this contract yet.
      tags: [identity]
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InvitationRole"
        - name: legalEntityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: siteId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AccessReviewLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of active access
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessReviewPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /access-review/lookup:
    post:
      operationId: lookupAccessReviewEntry
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Find the active access of one exact email address
      description: >-
        MVP-012B. Exact, normalized address match (no partial or prefix search) through the keyed
        address lookup, in the caller's tenant only. Returns the same page shape with zero or one
        entry; a non-member, an unknown address and a member of another tenant all give the same
        empty page. The submitted address is never echoed: a matched membership whose address was
        not recorded is returned with email null. A read: no Idempotency-Key and no state change.
        Cache-Control private, no-store; durable access-review.read audit before the body is
        written (also for an empty result); shared 30 requests per minute per subject.
      tags: [identity]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessReviewLookup"
      responses:
        "200":
          description: Zero or one entry
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessReviewPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /access-review/summary:
    get:
      operationId: getAccessReviewSummary
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Count the active members of the caller's organization per role
      description: >-
        MVP-012B. Counts computed with the same active-membership predicate as the entries, so the
        two never disagree. Cache-Control private, no-store; durable access-review.read audit
        before the body is written; shared 30 requests per minute per subject.
      tags: [identity]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Members per role
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessReviewSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /employee-imports/template:
    get:
      operationId: getEmployeeImportTemplate
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Download the employee import template
      description: >-
        MVP-020. A server-owned CSV with the header row only, in French or English (no sample row,
        so nothing fictitious can be imported). UTF-8 with a byte-order mark and a comma delimiter;
        the header labels are those the import accepts.
      tags: [people]
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
            enum: [fr, en]
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The CSV template
          headers:
            Content-Disposition:
              description: attachment; filename="divalhr-employee-import-<lang>.csv"
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
  /employee-imports:
    post:
      operationId: createEmployeeImport
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Upload and validate an employee CSV
      description: >-
        MVP-020. The request body is the CSV itself (text/csv; multipart is rejected). It is read
        only after authorization and the per-subject and per-tenant request limits, as a stream
        bounded to 2 MiB and 30 seconds, decoded as strict UTF-8 (a byte-order mark is ignored),
        and never stored: valid rows are staged as normalized values for 2 hours and invalid rows
        keep only their error codes. A file-level problem creates nothing (400
        IMPORT_FILE_INVALID with params.reason and, for header problems, params.column = the
        1-based header position; 413 IMPORT_FILE_TOO_LARGE; 408 IMPORT_UPLOAD_TIMEOUT). At most 3
        open imports per tenant (409 IMPORT_LIMIT_REACHED). Retries with the same Idempotency-Key
        and identical bytes replay the original 201. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              maxLength: 2097152
      responses:
        "201":
          description: Import validated and staged, or the original creation replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /employee-imports/{importId}:
    get:
      operationId: getEmployeeImport
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Read an employee import's status and counts
      description: >-
        MVP-020. Counts and status only, never personal data. Imports of another tenant, unknown
        and malformed IDs give the same 404 EMPLOYEE_IMPORT_NOT_FOUND. Import details are kept for
        30 days after the import is closed (operational policy, configurable 1-90 days).
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/EmployeeImportId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The import
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeImport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /employee-imports/{importId}/rows:
    get:
      operationId: listEmployeeImportRows
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Preview an employee import row by row
      description: >-
        MVP-020. Rows in file order, keyset-paginated on the row number; cursors are bound to the
        operation, tenant, import, status filter and page size. Valid rows of an open import carry
        the normalized values that will be created; invalid rows carry only the row number, column
        keys and stable codes, never a submitted value. After commit, discard or expiry no row
        carries values and the new employees are not identified. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/EmployeeImportId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, valid, invalid]
            default: all
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EmployeeImportRowLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of rows
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeImportRowPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /employee-imports/{importId}/commit:
    post:
      operationId: commitEmployeeImport
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Create the employees of the valid rows
      description: >-
        MVP-020. Creates one employee and one employment per valid row in a single transaction,
        or nothing. The command repeats what the administrator reviewed: previewDigest and
        validRows must match the staged import (409 IMPORT_PREVIEW_CHANGED), and
        acknowledgeInvalidRows must be true when some rows are invalid (400 VALIDATION_FAILED).
        Rows are re-validated inside the transaction; any change since the preview (an employee
        number now taken, a unit no longer valid) creates nothing (409 IMPORT_STALE). An import
        that is not open answers 409 IMPORT_NOT_COMMITTABLE with params.status; zero valid rows
        answers 409 IMPORT_NOTHING_TO_COMMIT. A database timeout creates nothing (503
        IMPORT_TIMEOUT). Existing employees are never updated, and no user account, invitation or
        membership is created. Retries with the same Idempotency-Key replay the original 200.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/EmployeeImportId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitEmployeeImport"
      responses:
        "200":
          description: Employees created, or the original commit replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /employee-imports/{importId}/discard:
