  /payroll-inputs/preview:
    post:
      operationId: previewPayrollInputs
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Preview the time-based payroll inputs of a legal entity and period
      description: >-
        MVP-090A. For one legal entity and one inclusive date range (business-zone dates; one to 31
        days, not before 2026-01-01, ending no later than today in the business zone, else 400
        VALIDATION_FAILED): every site-local week of the legal entity's sites that the period
        touches and that matters (generated, or holding scheduled work), each with its lock status
        (LOCKED, NOT_GENERATED, NOT_LOCKED, EVIDENCE_CHANGED or EMPTY); the eligible counts and
        approved worked minutes of the rows within the period from LOCKED weeks whose current
        timesheets and approvals still match their lock evidence; the exclusions with stable codes
        (ROW_OUTSIDE_PERIOD, TIMESHEET_WITHOUT_TIME); the blockers with stable codes
        (WEEK_NOT_GENERATED, WEEK_NOT_LOCKED, EVIDENCE_CHANGED, ATTRIBUTION_AMBIGUOUS,
        NO_APPROVED_TIME; any blocker fails the whole period closed, never a partial run); the
        source versions digest; a preview digest valid while the evidence, versions and readiness
        are identical and until expiresAt (15 to 30 minutes); and the existing run of this legal
        entity and period, if any, with whether its evidence is unchanged. Payroll inputs only:
        nothing here calculates pay. No name, employee number, subject or amount. A malformed,
        unknown or foreign legal entity is 404 PAYROLL_INPUT_TARGET_NOT_FOUND. A fail-closed
        disclosure (audit payroll-input.preview). Shares the payroll-input-write limit.
        Cache-Control private, no-store.
      tags: [payroll]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollInputPreviewRequest"
      responses:
        "200":
          description: The preview
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollInputPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /payroll-inputs:
    post:
      operationId: generatePayrollInputs
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Generate the immutable payroll inputs of a reviewed preview
      description: >-
        MVP-090A. Under the tenant's scheduling lock (taken first by every timesheet command, so no
        lock, unlock, correction, refresh or approval interleaves), the period is evaluated again;
        a preview digest or source versions digest that no longer matches the evidence, or an
        expired preview, is 409 PAYROLL_INPUT_PREVIEW_STALE; a period that is not ready (a week
        that matters is not generated or not locked, a locked week whose evidence changed, a row
        that cannot be attributed to the legal entity, no approved time) is 409
        PAYROLL_INPUT_NOT_READY. A run of this legal entity and period that already exists with
        identical evidence is returned as it is (outcome EXISTING); with different evidence it is
        409 PAYROLL_INPUT_RUN_EXISTS (generated evidence is never replaced; a replacement is a new
        version created with supersedePayrollInputRun, MVP-092). The latest version is the one compared. Otherwise one transaction writes the immutable run, its source weeks
        (generation, version, LOCKED action, lock version, lock evidence digest), one employee row
        per employee and employment, one source row per approved timesheet row within the period
        (bound to its timesheet, revision, current APPROVED action, cycle and lock action), the
        audit record (payroll-input.generate) and the outbox event
        (payroll.payroll-input.generated.v1); the database proves at commit that the run, its
        weeks and its employees count exactly their rows and that every row lies in the period; a
        failure of any of them writes nothing. Idempotent (an identical replay returns the
        original; a changed payload with the same key is 409 IDEMPOTENCY_KEY_REUSED). Shares the
        payroll-input-write limits. Cache-Control private, no-store.
      tags: [payroll]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePayrollInputsRequest"
      responses:
        "200":
          description: Generated, the existing run of identical evidence, or the original replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollInputResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      operationId: listPayrollInputRuns
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: List the tenant's payroll-input runs
      description: >-
        MVP-090A. The tenant's runs, newest first, optionally of one legal entity (a malformed
        filter is 400). Each item carries the run's facts: the scope, the counts and approved
        worked minutes, the exclusions, the evidence digest and the generation instant; never the
        actor, a name or an employee number. The signed cursor is bound to the operation, tenant,
        filter and page size. A fail-closed disclosure (audit payroll-input.list). Shares the
        payroll-input-read limit. Cache-Control private, no-store.
      tags: [payroll]
      parameters:
        - name: legalEntityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
