        - policyId
        - policyVersionId
        - policyCode
        - policyNames
        - unit
        - amount
        - startDate
        - endDate
        - approvalRoute
        - state
        - exceptionReason
      properties:
        id:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        employee:
          $ref: "#/components/schemas/LeaveApprovalEmployee"
        policyId:
          type: string
          format: uuid
        policyVersionId:
          type: string
          format: uuid
        policyCode:
          type: string
        policyNames:
          $ref: "#/components/schemas/LeavePolicyNames"
        unit:
          $ref: "#/components/schemas/LeaveUnit"
        amount:
          type: number
          description: Two decimals, in the policy's unit.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        approvalRoute:
          $ref: "#/components/schemas/LeaveApprovalRoute"
