        MVP-050B. Cancels a published schedule whose every slot starts strictly after the server's
        current instant (409 WORK_SCHEDULE_CHANGE_WINDOW_CLOSED otherwise), with a reason
        (decision-reason grammar version 1; Restricted HR) and confirm true. Under the tenant's
