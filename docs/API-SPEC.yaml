      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: List my factual attendance exceptions
      description: >-
        MVP-060C. The factual attendance exceptions of the employee of the caller's current active
        employee-access link (403 EMPLOYEE_LINK_REQUIRED otherwise), and only theirs. Exceptions are derived at one server-owned asOfInstant (pinned in the signed cursor) from
        the immutable schedules and slots, terminal evidence, approved substitutions and the attendance
        evidence; nothing is stored. MISSING_CHECK_IN: a shift of a schedule not cancelled or replaced
        by asOfInstant has ended (asOfInstant at or after its scheduled end) and its effective assignee
        (the approved substitute when the substitution was approved before the end, otherwise the
        published assignee) has no record for it. MISSING_CHECK_OUT: a record has no check-out and
        its check-out deadline (end + 24 hours, inclusive) has passed. LATE_CHECK_IN: the check-in was
        more than 5 minutes after the scheduled start. EARLY_CHECK_OUT: the check-out was more than 5
        minutes before the scheduled end. Exactly 5 minutes is not an exception; varianceMinutes is
        the difference rounded up to whole minutes. A recorded exception stays bound to the
        record's employee whatever happened to the schedule or its coverage later. Facts only: no
        guilt, absence, policy, pay or disciplinary conclusion. Optional type; from and to are
        inclusive site-local dates of the shift start, given together, at most 93 days (400
        VALIDATION_FAILED otherwise); without them, the last 31 site-local dates through the as-of
        date in each site's time zone. Ordered by scheduled start descending, then slot ID
        descending, then employee ID descending, then type (MISSING_CHECK_IN, LATE_CHECK_IN,
        EARLY_CHECK_OUT, MISSING_CHECK_OUT).
        Never another employee, a subject, an employment, a reason or a recorder. Restricted
        HR/Operations: a fail-closed disclosure (audit attendance.exception-self-list). The signed
        cursor is bound to the operation, tenant, caller, link, linked employee, filters, page size
        and asOfInstant. Shares the work-schedule-self-read limit. Cache-Control private, no-store.
