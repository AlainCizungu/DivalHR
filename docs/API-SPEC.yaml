          type: integer
          enum: [1]
        digestVersion:
          type: integer
          enum: [1]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        approvedAt:
          type: [string, "null"]
          format: date-time
        retiredAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 0
