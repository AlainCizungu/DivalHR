  /public/messaging/whatsapp/callback:
    get:
      operationId: verifyWhatsAppCallback
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: public
      summary: Provider subscription verification (anonymous, provider only)
      description: >-
        MVP-111 (ADR 0029). Meta's webhook subscription handshake. Echoes hub.challenge as text/plain
        only when hub.mode is subscribe and hub.verify_token equals the operator-provisioned verify
        token (constant-time comparison); everything else, including an unconfigured deployment, is
        an empty 403. Access tokens are neither required nor read. Cache-Control no-store.
      tags: [integrations]
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - name: hub.verify_token
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The challenge
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            text/plain:
              schema:
                type: string
                maxLength: 256
        "403":
          description: Wrong mode or verify token, or the callback is not configured. Empty body.
    post:
      operationId: receiveWhatsAppCallback
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: public
      summary: Provider delivery-status callback (anonymous, provider only)
      description: >-
        MVP-111 (ADR 0029). Meta's signed status callbacks. The X-Hub-Signature-256 HMAC-SHA-256 over
        the exact request bytes (keyed by the Meta app secret) is verified in constant time before
        anything is parsed; the body is bounded to 64 KiB; only allow-listed fields are read (a
        provider message ID, the phone-number ID, a status, a time and a numeric error code). A
        message is matched by provider message ID plus its connector's stored phone-number binding.
        Unknown, duplicate and out-of-order statuses are acknowledged without effect, a lower status
        never moves a delivery backward, and inbound customer messages are ignored without being
        stored. The body is not described here because it is the provider's, not DivalHR's. Answers
        are empty. Only application/json (a charset parameter is allowed) is accepted: 415 for a
        missing or other Content-Type, before anything is read. 403 for a missing or wrong
        signature, 413 over the limit, 429 over the provider-wide ceiling. 503 when unconfigured or
        when processing failed (nothing was stored; the provider retries the identical callback).
        A signed body that cannot be used is acknowledged with 200 and stores nothing.
        Cache-Control no-store.
      tags: [integrations]
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: false
          schema:
            type: string
            maxLength: 71
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Verified and processed, or verified and ignored
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "403":
          description: Missing or wrong signature. Empty body.
        "413":
          description: Body over the limit. Empty body.
        "415":
          description: Missing or unsupported Content-Type (only application/json). Empty body.
        "429":
          description: Provider-wide callback ceiling reached. Empty body.
        "503":
          description: The callback is not configured, or processing failed and may be retried. Empty body.

  /tasks:
    post:
      operationId: createTask
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Assign a task
      description: >-
        MVP-080 (ADR 0030). Creates an OPEN task for one active employee of the caller's organization in one transaction with its CREATED action, the audit record task.create and the event operations.task.assigned.v1. The assignee must exist in the tenant, have an employment covering the organization's business date with no recorded separation, and an active employee membership linked to the employee; otherwise 404 TASK_ASSIGNEE_NOT_FOUND without saying which condition failed. The title (1-120) and optional instructions (0-1000) are restricted plain text: NFC, no leading or trailing whitespace, no control or format characters, no markup, links or encoded content, otherwise 400 VALIDATION_FAILED with the field and a closed constraint (never the value). dueAt, when given, must be after the server time and at most 366 days ahead. At most 10,000 non-terminal tasks per tenant (409 TASK_LIMIT_REACHED). The response is a receipt (id, state, version, occurredAt) so that the idempotency store never holds user text; read the task with getTask. Errors never echo a submitted value. Cache-Control private, no-store.
