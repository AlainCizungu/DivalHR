    ExpenseState:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, RETURNED, WITHDRAWN]
    CompensationCurrency:
      type: string
      description: >-
        CDF (whole francs, 1 to 1,000,000,000) or USD (two decimals, 0.01 to 100,000.00). The currencies are
        never converted, compared as one total or combined.
      enum: [CDF, USD]
    CompensationAction:
      type: string
      description: >-
        ESTABLISHED (first record), CHANGED (new effective-dated amount or currency), CORRECTED (correction
        of a recorded fact) or SCHEDULED_CHANGE_CANCELLED. A command uses only the first three.
      enum: [ESTABLISHED, CHANGED, CORRECTED, SCHEDULED_CHANGE_CANCELLED]
    CompensationReasonCode:
      type: string
      enum: [DATA_ENTRY_ERROR, WRONG_EFFECTIVE_DATE, WRONG_CURRENCY, OTHER_CORRECTION]
    CompensationBlocker:
      type: string
      description: >-
        Stable preview blockers. A blocked preview has no previewDigest and cannot be committed.
      enum:
        - AMOUNT_OUT_OF_RANGE
        - DATE_OUT_OF_RANGE
        - EMPLOYMENT_CONFLICT
        - TRANSITION_NOT_ALLOWED
        - NO_CHANGE
        - NOT_CANCELLABLE
        - LIMIT_REACHED
    CompensationWarning:
      type: string
      enum: [RETROACTIVE, LATER_CHANGE_SCHEDULED]
    CompensationMoney:
      type: object
      additionalProperties: false
      required: [currency, amount]
      properties:
        currency:
          $ref: "#/components/schemas/CompensationCurrency"
        amount:
          type: string
          description: >-
            Canonical decimal text, never a JSON number: CDF "135000"; USD "1250.00". Input accepts no
            sign, exponent, grouping separator or excess scale and is never rounded.
          pattern: "^(0|[1-9][0-9]{0,9})(\\.[0-9]{1,2})?$"
    CompensationInterval:
      type: object
      additionalProperties: false
      description: One active effective interval of monthly base compensation.
      required: [originChangeId, money, effectiveFrom, effectiveTo, cancellable]
      properties:
        originChangeId:
          type: string
          format: uuid
          description: The change that introduced this value and start; the id used to correct or cancel it.
        money:
          $ref: "#/components/schemas/CompensationMoney"
        frequency:
          type: string
          enum: [MONTHLY]
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
          description: Inclusive last day, or null for the open-ended last interval.
        cancellable:
          type: boolean
          description: True only for an unstarted CHANGED interval (administrator reads); always false for employees.
    CompensationChangeView:
      type: object
      additionalProperties: false
      description: One immutable recorded change.
      required: [changeId, sequence, action, money, effectiveFrom, reasonCode, targetChangeId, retroactive, recordedAt]
      properties:
        changeId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        action:
          $ref: "#/components/schemas/CompensationAction"
        money:
          $ref: "#/components/schemas/CompensationMoney"
        effectiveFrom:
          type: string
          format: date
        reasonCode:
          oneOf:
            - $ref: "#/components/schemas/CompensationReasonCode"
            - type: "null"
        explanation:
          type: [string, "null"]
          description: Administrator reads only (never returned to the employee). Restricted text.
        targetChangeId:
          type: [string, "null"]
          format: uuid
        retroactive:
          type: boolean
          description: True when the effective date was before the business date of the recording.
        recordedAt:
          type: string
          format: date-time
    CompensationRecord:
      type: object
      additionalProperties: false
      required: [version, businessDate, current, scheduled, changes, nextCursor]
      properties:
        version:
          type: integer
          minimum: 0
          description: The employee's compensation version (the last change sequence; 0 when none).
        businessDate:
          type: string
          format: date
        current:
          oneOf:
            - $ref: "#/components/schemas/CompensationInterval"
            - type: "null"
        scheduled:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/CompensationInterval"
        changes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CompensationChangeView"
        nextCursor:
          type: [string, "null"]
    MyCompensation:
      type: object
      additionalProperties: false
      required: [businessDate, current, scheduled, changes, nextCursor]
      properties:
        businessDate:
          type: string
          format: date
        current:
          oneOf:
            - $ref: "#/components/schemas/CompensationInterval"
            - type: "null"
        scheduled:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/CompensationInterval"
        changes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CompensationChangeView"
        nextCursor:
          type: [string, "null"]
    CompensationCommand:
      type: object
      additionalProperties: false
      description: >-
        ESTABLISHED and CHANGED need effectiveFrom, currency and amount only. CORRECTED also needs
        targetChangeId (the originChangeId of the active fact to correct), reasonCode and explanation.
      required: [action, effectiveFrom, currency, amount]
      properties:
        action:
          type: string
          enum: [ESTABLISHED, CHANGED, CORRECTED]
        effectiveFrom:
          type: string
          format: date
        currency:
          $ref: "#/components/schemas/CompensationCurrency"
        amount:
          type: string
          description: Decimal string, never a JSON number. CDF whole francs 1-1000000000; USD at most two decimals 0.01-100000.00.
        targetChangeId:
          type: [string, "null"]
          format: uuid
        reasonCode:
          oneOf:
            - $ref: "#/components/schemas/CompensationReasonCode"
            - type: "null"
        explanation:
          type: [string, "null"]
          minLength: 10
          maxLength: 500
          description: Restricted plain text (NFC, no markup, URL, control character or encoded payload).
    CompensationPreview:
      type: object
      additionalProperties: false
      required:
        [action, money, effectiveFrom, before, after, warnings, blockers, requiresReason,
         requiresAcknowledgement, version, employmentDigest, previewDigest, expiresAt]
      properties:
        action:
          type: string
          enum: [ESTABLISHED, CHANGED, CORRECTED]
        money:
          $ref: "#/components/schemas/CompensationMoney"
        effectiveFrom:
          type: string
          format: date
        before:
          type: array
          description: The active intervals that the command touches, as they are now.
          items:
            $ref: "#/components/schemas/CompensationInterval"
        after:
          type: array
          description: The same date span after the command.
          items:
            $ref: "#/components/schemas/CompensationInterval"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CompensationWarning"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/CompensationBlocker"
        requiresReason:
          type: boolean
          description: True for a correction (reasonCode and explanation).
        requiresAcknowledgement:
          type: boolean
          description: True for a correction or a retroactive effective date; the commit must set acknowledgeRetroactive.
        version:
          type: integer
          minimum: 0
          description: The compensation version to repeat as expectedVersion.
        employmentDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Digest of the employee's employment versions and intervals at preview time.
        previewDigest:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        expiresAt:
          type: [string, "null"]
          format: date-time
    CommitCompensation:
      type: object
      additionalProperties: false
      description: The previewed command plus what the preview returned.
      required:
        [action, effectiveFrom, currency, amount, expectedVersion, employmentDigest, previewDigest,
         expiresAt, acknowledgeRetroactive, confirmed]
      properties:
        action:
          type: string
          enum: [ESTABLISHED, CHANGED, CORRECTED]
        effectiveFrom:
          type: string
          format: date
        currency:
          $ref: "#/components/schemas/CompensationCurrency"
        amount:
          type: string
        targetChangeId:
          type: [string, "null"]
          format: uuid
        reasonCode:
          oneOf:
            - $ref: "#/components/schemas/CompensationReasonCode"
            - type: "null"
        explanation:
          type: [string, "null"]
          minLength: 10
          maxLength: 500
        expectedVersion:
          type: integer
          minimum: 0
        employmentDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        expiresAt:
          type: string
          format: date-time
        acknowledgeRetroactive:
          type: boolean
        confirmed:
          type: boolean
          description: Must be true.
    CompensationCancellationPreview:
      type: object
      additionalProperties: false
      required:
        [changeId, before, after, warnings, blockers, version, employmentDigest, cancellationDigest, expiresAt]
      properties:
        changeId:
          type: string
          format: uuid
        before:
          type: array
          items:
            $ref: "#/components/schemas/CompensationInterval"
        after:
          type: array
          items:
            $ref: "#/components/schemas/CompensationInterval"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CompensationWarning"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/CompensationBlocker"
        version:
          type: integer
          minimum: 0
        employmentDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        cancellationDigest:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        expiresAt:
          type: [string, "null"]
          format: date-time
    CancelCompensationChange:
      type: object
      additionalProperties: false
      required: [expectedVersion, employmentDigest, cancellationDigest, expiresAt, confirmed]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        employmentDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        cancellationDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        expiresAt:
          type: string
          format: date-time
        confirmed:
          type: boolean
          description: Must be true.
    CompensationReceipt:
      type: object
      additionalProperties: false
      description: >-
        Amount-free and text-free receipt (identifiers, action, dates and versions only) so that the
        idempotency store never holds a salary or an explanation.
      required: [changeId, sequence, action, effectiveFrom, version]
      properties:
        changeId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        action:
          $ref: "#/components/schemas/CompensationAction"
        effectiveFrom:
          type: string
          format: date
        version:
          type: integer
          minimum: 1
    PayrollPeriod:
      type: string
      description: A calendar month, YYYY-MM. A run needs a fully closed month within the prior 24 months.
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    PayrollProrationMethod:
      type: string
      description: >-
        CALENDAR_DAYS (eligible days / days in the month), FIXED_30_DAYS (eligible days / 30, capped at a
        full month) or NONE (a partial month is a blocker). Rounded once, HALF_UP, in the currency minor unit.
      enum: [CALENDAR_DAYS, FIXED_30_DAYS, NONE]
    PayrollPayDay:
      type: object
      additionalProperties: false
      required: [kind, day]
      properties:
        kind:
          type: string
          enum: [DAY, LAST_DAY]
        day:
          type: [integer, "null"]
          minimum: 1
          maximum: 28
          description: Day of the month (1-28) for DAY; null for LAST_DAY.
    PayrollPolicyEntry:
      type: object
      additionalProperties: false
      description: One effective-dated employer policy (not a legal-compliance claim).
      required: [policyId, sequence, effectiveFrom, effectiveTo, payDay, prorationMethod]
      properties:
        policyId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
          maximum: 60
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
          description: Inclusive last day (derived); null for the last policy.
        payDay:
          $ref: "#/components/schemas/PayrollPayDay"
        prorationMethod:
          $ref: "#/components/schemas/PayrollProrationMethod"
    PayrollPolicyView:
      type: object
      additionalProperties: false
      required: [legalEntityId, version, businessDate, current, policies]
      properties:
        legalEntityId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
          maximum: 60
          description: The last policy sequence (0 when none); repeat it as expectedVersion.
        businessDate:
          type: string
          format: date
        current:
          oneOf:
            - $ref: "#/components/schemas/PayrollPolicyEntry"
            - type: "null"
        policies:
          type: array
          maxItems: 60
          description: Newest first.
          items:
            $ref: "#/components/schemas/PayrollPolicyEntry"
    PayrollPolicyCommand:
      type: object
      additionalProperties: false
      required: [effectiveFrom, payDay, prorationMethod]
      properties:
        effectiveFrom:
          type: string
          format: date
        payDay:
          $ref: "#/components/schemas/PayrollPayDay"
        prorationMethod:
          $ref: "#/components/schemas/PayrollProrationMethod"
    PayrollPolicyBlocker:
      type: string
      enum: [NO_CHANGE, LIMIT_REACHED]
    PayrollPolicyPreview:
      type: object
      additionalProperties: false
      required: [effectiveFrom, payDay, prorationMethod, before, after, blockers, version, previewDigest, expiresAt]
      properties:
        effectiveFrom:
          type: string
          format: date
        payDay:
          $ref: "#/components/schemas/PayrollPayDay"
        prorationMethod:
          $ref: "#/components/schemas/PayrollProrationMethod"
        before:
          type: array
          maxItems: 60
          items:
            $ref: "#/components/schemas/PayrollPolicyEntry"
        after:
          type: array
          maxItems: 60
          items:
            $ref: "#/components/schemas/PayrollPolicyEntry"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PayrollPolicyBlocker"
        version:
          type: integer
          minimum: 0
          maximum: 60
        previewDigest:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        expiresAt:
          type: [string, "null"]
          format: date-time
    CommitPayrollPolicy:
      type: object
      additionalProperties: false
      required: [effectiveFrom, payDay, prorationMethod, expectedVersion, previewDigest, expiresAt, confirmed]
      properties:
        effectiveFrom:
          type: string
          format: date
        payDay:
          $ref: "#/components/schemas/PayrollPayDay"
        prorationMethod:
          $ref: "#/components/schemas/PayrollProrationMethod"
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 60
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        expiresAt:
          type: string
          format: date-time
        confirmed:
          type: boolean
          description: Must be true.
    PayrollPolicyReceipt:
      type: object
      additionalProperties: false
      required: [policyId, sequence, effectiveFrom, version]
      properties:
        policyId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        effectiveFrom:
          type: string
          format: date
        version:
          type: integer
          minimum: 1
    PayrollRunCommand:
      type: object
      additionalProperties: false
      required: [period, currency]
      properties:
        period:
          $ref: "#/components/schemas/PayrollPeriod"
        currency:
          $ref: "#/components/schemas/CompensationCurrency"
    PayrollEmployeeBlocker:
      type: string
      description: >-
        Stable employee blockers; any blocker forbids creating the run. COMPENSATION_MISSING (an employed day in
        this legal entity without compensation), CURRENCY_MISMATCH (compensation in another currency),
        FOREIGN_PLACEMENT (placed in another legal entity for part of the month), OVERLAPPING_EVIDENCE
        (inconsistent overlapping source records), MULTIPLE_MONTHLY_AMOUNTS (the monthly amount changes inside
        the month; correct or align the effective date), PARTIAL_MONTH_NOT_ALLOWED (the policy method NONE and a
        partial month).
      enum:
        - COMPENSATION_MISSING
        - CURRENCY_MISMATCH
        - FOREIGN_PLACEMENT
        - OVERLAPPING_EVIDENCE
        - MULTIPLE_MONTHLY_AMOUNTS
        - PARTIAL_MONTH_NOT_ALLOWED
    PayrollExplanationCode:
      type: string
      enum:
        - FULL_MONTH
        - PRORATED_CALENDAR_DAYS
        - PRORATED_FIXED_30_DAYS
        - CAPPED_AT_FULL_MONTH
        - STARTED_IN_MONTH
        - ENDED_IN_MONTH
        - MULTIPLE_PERIODS
    PayrollDateRange:
      type: object
      additionalProperties: false
      description: A maximal run of eligible days, inclusive.
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    PayrollSourceReference:
      type: object
      additionalProperties: false
      description: A source record that fed the calculation, by identifier and version only.
      required: [kind, sourceId, sourceVersion, validFrom, validTo]
      properties:
        kind:
          type: string
          enum: [EMPLOYMENT, PLACEMENT, COMPENSATION]
        sourceId:
          type: string
          format: uuid
        sourceVersion:
          type: integer
          minimum: 0
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
    PayrollPolicyApplied:
      type: object
      additionalProperties: false
      description: The policy in force on the month's last day, frozen onto the run.
      required: [policyId, sequence, payDay, prorationMethod]
      properties:
        policyId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        payDay:
          $ref: "#/components/schemas/PayrollPayDay"
        prorationMethod:
          $ref: "#/components/schemas/PayrollProrationMethod"
    PayrollPreviewLine:
      type: object
      additionalProperties: false
      description: >-
        One employee of the population. With any blocker, denominator, monthly and gross are null. Contractual
        gross is not taxable gross, net pay or money owed.
      required: [employeeId, employeeNumber, eligibleDays, ranges, denominator, fullMonth, monthly, gross, explanationCodes, blockers]
      properties:
        employeeId:
          type: string
          format: uuid
        employeeNumber:
          type: string
          maxLength: 64
        eligibleDays:
          type: integer
          minimum: 0
          maximum: 31
        ranges:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/PayrollDateRange"
        denominator:
          type: [integer, "null"]
          minimum: 28
          maximum: 31
          description: Null for a full month (no division) and when blocked.
        fullMonth:
          type: boolean
        monthly:
          oneOf:
            - $ref: "#/components/schemas/CompensationMoney"
            - type: "null"
        gross:
          oneOf:
            - $ref: "#/components/schemas/CompensationMoney"
            - type: "null"
        explanationCodes:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/PayrollExplanationCode"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PayrollEmployeeBlocker"
    PayrollRunSummary:
      type: object
      additionalProperties: false
      required:
        [runId, legalEntityId, period, currency, version, status, policySequence, employeeCount, total,
         createdAt, supersededAt, supersededByRunId]
      properties:
        runId:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
        period:
          $ref: "#/components/schemas/PayrollPeriod"
        currency:
          $ref: "#/components/schemas/CompensationCurrency"
        version:
          type: integer
          minimum: 1
          maximum: 25
        status:
          type: string
          description: A draft is not statutory payroll. DRAFT is current; SUPERSEDED was replaced by a later version.
          enum: [DRAFT, SUPERSEDED]
        policySequence:
          type: integer
          minimum: 1
        employeeCount:
          type: integer
          minimum: 1
          maximum: 5000
        total:
          $ref: "#/components/schemas/CompensationMoney"
        createdAt:
          type: string
          format: date-time
        supersededAt:
          type: [string, "null"]
          format: date-time
        supersededByRunId:
          type: [string, "null"]
          format: uuid
    PayrollRunPreview:
      type: object
      additionalProperties: false
      required:
        [legalEntityId, period, currency, policy, expectedVersion, existingRun, identicalToCurrent,
         employeeCount, blockedEmployeeCount, total, lines, inputDigest, previewDigest, expiresAt]
      properties:
        legalEntityId:
          type: string
          format: uuid
        period:
          $ref: "#/components/schemas/PayrollPeriod"
        currency:
          $ref: "#/components/schemas/CompensationCurrency"
        policy:
          $ref: "#/components/schemas/PayrollPolicyApplied"
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 25
          description: The current chain version (0 when no run exists); repeat it on creation.
        existingRun:
          oneOf:
            - $ref: "#/components/schemas/PayrollRunSummary"
            - type: "null"
        identicalToCurrent:
          type: boolean
          description: True when the recalculation equals the current draft; nothing can be created.
        employeeCount:
          type: integer
          minimum: 0
          maximum: 5000
        blockedEmployeeCount:
          type: integer
          minimum: 0
          maximum: 5000
        total:
          description: Sum of the contractual gross of the employees without a blocker, in the run currency only.
          $ref: "#/components/schemas/CompensationMoney"
        lines:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/PayrollPreviewLine"
        inputDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        previewDigest:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        expiresAt:
          type: [string, "null"]
          format: date-time
    CommitPayrollRun:
      type: object
      additionalProperties: false
      required: [period, currency, expectedVersion, inputDigest, previewDigest, expiresAt, confirmed]
      properties:
        period:
          $ref: "#/components/schemas/PayrollPeriod"
        currency:
          $ref: "#/components/schemas/CompensationCurrency"
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 25
        inputDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        expiresAt:
          type: string
          format: date-time
        confirmed:
          type: boolean
          description: Must be true.
    PayrollRunReceipt:
      type: object
      additionalProperties: false
      description: >-
        Amount-free receipt (identifiers, period, currency, version and a count only) so that the idempotency
        store never holds an amount.
      required: [runId, legalEntityId, period, currency, version, status, supersededRunId, employeeCount]
      properties:
        runId:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
        period:
          $ref: "#/components/schemas/PayrollPeriod"
        currency:
          $ref: "#/components/schemas/CompensationCurrency"
        version:
          type: integer
          minimum: 1
          maximum: 25
        status:
          type: string
          enum: [DRAFT]
        supersededRunId:
          type: [string, "null"]
          format: uuid
        employeeCount:
          type: integer
          minimum: 1
          maximum: 5000
    PayrollRunPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PayrollRunSummary"
        nextCursor:
          type: [string, "null"]
    PayrollRunLine:
      type: object
      additionalProperties: false
      description: One frozen employee line with its evidence.
      required: [employeeId, employeeNumber, eligibleDays, ranges, denominator, fullMonth, monthly, gross, explanationCodes, sources]
      properties:
        employeeId:
          type: string
          format: uuid
        employeeNumber:
          type: string
          maxLength: 64
        eligibleDays:
          type: integer
          minimum: 1
          maximum: 31
        ranges:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/PayrollDateRange"
        denominator:
          type: [integer, "null"]
          minimum: 28
          maximum: 31
        fullMonth:
          type: boolean
        monthly:
          $ref: "#/components/schemas/CompensationMoney"
        gross:
          $ref: "#/components/schemas/CompensationMoney"
        explanationCodes:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/PayrollExplanationCode"
        sources:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PayrollSourceReference"
    PayrollRunDetail:
      type: object
      additionalProperties: false
      required: [run, policy, inputDigest, lines, nextCursor]
      properties:
        run:
          $ref: "#/components/schemas/PayrollRunSummary"
        policy:
          $ref: "#/components/schemas/PayrollPolicyApplied"
        inputDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        lines:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PayrollRunLine"
        nextCursor:
          type: [string, "null"]
    ExpenseCurrency:
      type: string
      description: >-
        CDF (whole francs) or USD (two decimals). The currencies are never converted or combined.
      enum: [CDF, USD]
    ExpenseCategory:
      type: string
      enum: [TRANSPORT, MEALS, LODGING, SUPPLIES, COMMUNICATION, TRAINING, MEDICAL_WORK_RELATED, OTHER]
    ExpenseActionType:
      type: string
      enum: [CREATED, DRAFT_UPDATED, RECEIPT_SET, RECEIPT_REMOVED, SUBMITTED, WITHDRAWN, APPROVED, RETURNED]
    ExpenseReceiptFile:
      type: object
      description: >-
        MVP-081. The receipt of one revision (metadata only). The bytes are read with a download operation.
      additionalProperties: false
      required: [id, mediaType, sizeBytes, sha256, fileName]
      properties:
        id:
          type: string
          format: uuid
        mediaType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 2097152
        sha256:
          type: string
          description: Hex SHA-256 computed by the server.
        fileName:
          type: string
          description: Display name only (restricted), shown unchanged and never used as a path.
    ExpenseEmployee:
      type: object
      description: >-
        MVP-081. The employee an expense belongs to (shown to the approver and the administrator).
      additionalProperties: false
      required: [id, employeeNumber, givenNames, familyName]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
    Expense:
      type: object
      description: >-
        MVP-081. One expense as its viewer may see it. For an administrator it is the last submitted revision.
      additionalProperties: false
      required: [id, employee, state, cycle, revision, version, businessDate, currency, amount, amountMinorUnits, category, merchant, description, receipt, createdAt, submittedAt, decidedAt, lastActionAt, editable]
      properties:
        id:
          type: string
          format: uuid
        employee:
          $ref: "#/components/schemas/ExpenseEmployee"
        state:
          $ref: "#/components/schemas/ExpenseState"
        cycle:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
        businessDate:
          type: string
          format: date
        currency:
          $ref: "#/components/schemas/ExpenseCurrency"
        amount:
          type: string
          description: Decimal string in the currency exponent (CDF "125000", USD "12.50").
        amountMinorUnits:
          type: integer
          format: int64
          minimum: 1
          description: CDF francs or USD cents.
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        merchant:
          type: string
          description: Restricted plain text, 1-120 characters.
        description:
          type: string
          description: Restricted plain text, 10-1000 characters.
        receipt:
          oneOf:
            - $ref: "#/components/schemas/ExpenseReceiptFile"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time
        lastActionAt:
          type: string
          format: date-time
        editable:
          type: boolean
          description: True while the owner may still change or submit it.
    ExpenseRevision:
      type: object
      description: >-
        MVP-081. One immutable revision once submitted.
      additionalProperties: false
      required: [revision, businessDate, currency, amount, amountMinorUnits, category, merchant, description, receipt, createdAt, submittedAt]
      properties:
        revision:
          type: integer
          minimum: 1
        businessDate:
          type: string
          format: date
        currency:
          $ref: "#/components/schemas/ExpenseCurrency"
        amount:
          type: string
          description: Decimal string in the currency exponent (CDF "125000", USD "12.50").
        amountMinorUnits:
          type: integer
          format: int64
          minimum: 1
          description: CDF francs or USD cents.
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        merchant:
          type: string
        description:
          type: string
        receipt:
          oneOf:
            - $ref: "#/components/schemas/ExpenseReceiptFile"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
    ExpenseAction:
      type: object
      description: >-
        MVP-081. One immutable history entry (role and time, no subject).
      additionalProperties: false
      required: [sequence, action, occurredAt, actorRole, fromState, toState, revision, receiptPresent, returnReason]
      properties:
        sequence:
          type: integer
          minimum: 1
        action:
          $ref: "#/components/schemas/ExpenseActionType"
        occurredAt:
          type: string
          format: date-time
        actorRole:
          type: string
          enum: [employee, manager]
        fromState:
          oneOf:
            - $ref: "#/components/schemas/ExpenseState"
            - type: "null"
        toState:
          $ref: "#/components/schemas/ExpenseState"
        revision:
          type: integer
          minimum: 1
        receiptPresent:
          type: boolean
        returnReason:
          type: [string, "null"]
          description: The manager's reason, only on a RETURNED action.
    ExpenseDetail:
      type: object
      description: >-
        MVP-081. An expense with its revisions and history.
      additionalProperties: false
      required: [expense, revisions, history]
      properties:
        expense:
          $ref: "#/components/schemas/Expense"
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseRevision"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseAction"
    ExpensePage:
      type: object
      description: >-
        MVP-081. A keyset page.
      additionalProperties: false
      required: [items, nextCursor, asOf]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        nextCursor:
          type: [string, "null"]
        asOf:
          type: string
          format: date-time
    ExpenseReceipt:
      type: object
      description: >-
        MVP-081. The result of a command: ids, state, numbers and the server time. It carries no user-entered text, so the idempotency store never holds any.
      additionalProperties: false
      required: [id, state, cycle, revision, version, currency, amount, amountMinorUnits, category, receiptPresent, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ExpenseState"
        cycle:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
        currency:
          $ref: "#/components/schemas/ExpenseCurrency"
        amount:
          type: string
          description: Decimal string in the currency exponent (CDF "125000", USD "12.50").
        amountMinorUnits:
          type: integer
          format: int64
          minimum: 1
          description: CDF francs or USD cents.
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        receiptPresent:
          type: boolean
        occurredAt:
          type: string
          format: date-time
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required: [businessDate, currency, amount, category, merchant, description]
      properties:
        businessDate:
          type: string
          format: date
          description: The organization's today or up to 90 days earlier; never in the future.
        currency:
          $ref: "#/components/schemas/ExpenseCurrency"
        amount:
          type: string
          description: Decimal string, never a JSON number. CDF whole francs 1-100000000; USD at most two decimals 0.01-100000.00.
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        merchant:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 1000
    UpdateExpenseDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, businessDate, currency, amount, category, merchant, description]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        businessDate:
          type: string
          format: date
          description: The organization's today or up to 90 days earlier; never in the future.
        currency:
          $ref: "#/components/schemas/ExpenseCurrency"
        amount:
          type: string
          description: Decimal string, never a JSON number. CDF whole francs 1-100000000; USD at most two decimals 0.01-100000.00.
