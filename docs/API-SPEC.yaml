  /contract-expirations/search:
    post:
      operationId: searchContractExpirations
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: List contracts that have expired or end within 90 days
      description: >-
        MVP-031A (Issue #73). One row per employment: its coverage head, i.e. the last contract of
        the contiguous chain that includes the latest contract started on or before the business
        date (else the earliest future one); voided contracts are ignored. Open-ended heads, heads
        ending more than 90 days after the business date, and employments whose recorded last day
        is before the business date or on or before the head's end are excluded. Categories use
        the organization's business date (asOf, in its IANA time zone): EXPIRED before it,
        NEXT_30_DAYS from it to day 30, DAYS_31_TO_60, DAYS_61_TO_90. Most urgent first (end date,
        then contract ID). counts apply the same rules, search and unit as the items, before the
        category filter. The HMAC-protected cursor pins asOf and every filter; rows are never repeated,
        but eligibility is re-evaluated on each request, so rows can appear or disappear after the
        cursor. Filters travel in the body so the search text never reaches a URL. Recorded as a
        disclosure (audit contract-expiration.read). Cache-Control private, no-store.
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractExpirationSearch"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractExpirationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
