          $ref: "#/components/schemas/LeaveApprovalRoute"
        state:
          $ref: "#/components/schemas/LeaveRequestState"
        exceptionReason:
          $ref: "#/components/schemas/LeaveRoutingExceptionReason"
    LeaveRoutingExceptionReason:
      type: string
      description: >-
        MVP-041E. NO_QUALIFYING_MANAGER: no active, non-superseded MANAGER line covers the
        request's employment on its first day.
      enum: [NO_QUALIFYING_MANAGER]
    LeaveRoutingExceptionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeaveRoutingException"
        nextCursor:
          type: [string, "null"]
    DecideLeaveRequest:
      type: object
      description: >-
        MVP-041B. A decision with its reason, required for either outcome. The request comes from
        the path; tenant, route, manager and actor are never fields.
      additionalProperties: false
      required: [decision, reasonLocale, reason]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: >-
            Plain text, decision-reason grammar version 1 (identical in the Core and the
            database): NFC-normalized and trimmed by the server; 2 to 500 Unicode code points
            after that; no C0/C1 control, Unicode 15.0 format character (zero-width, joiner,
            bidirectional control, tag...), line or paragraph separator, private-use code point or
            noncharacter.
    LeaveDecisionReceipt:
      type: object
      description: MVP-041B. The minimal receipt of a decision; never the reason.
      required: [requestId, decisionId, state, decidedAt]
      properties:
        requestId:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        state:
          type: string
          enum: [APPROVED, REJECTED]
        decidedAt:
          type: string
          format: date-time
    CancelMyLeaveRequest:
      type: object
      description: >-
        MVP-041C. The employee's cancellation of their own pending request, with its reason. The
        request comes from the path; tenant, employee and actor are never fields.
      additionalProperties: false
      required: [reasonLocale, reason]
      properties:
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: >-
            Plain text, the same decision-reason grammar version 1 as DecideLeaveRequest.reason
            (identical in the Core, the database and the web form).
    AmendMyLeaveRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-041D. The replacement's fields, exactly those of CreateMyLeaveRequest, and the amendment
        reason. The original request comes from the path; tenant, employee and actor are never
        fields. VALIDATION_FAILED fields: policyId, startDate (RANGE when before the business date),
        endDate (RANGE when before startDate or beyond 366 days in all), amount, reasonLocale,
        reason, body (UNKNOWN_PROPERTY) and Idempotency-Key.
      required: [policyId, startDate, endDate, amount, reasonLocale, reason]
      properties:
        policyId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
          multipleOf: 0.01
          description: The requested amount in the policy's unit (days or hours), entered by the employee.
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: >-
            Plain text, the same decision-reason grammar version 1 as DecideLeaveRequest.reason
            (identical in the Core, the database and the web form).
    LeaveAmendmentReceipt:
      type: object
      description: MVP-041D. The minimal receipt of an amendment; never the reason.
      required:
        - amendmentId
        - originalRequestId
        - replacementRequestId
        - originalState
        - replacementState
        - amendedAt
      properties:
        amendmentId:
          type: string
          format: uuid
        originalRequestId:
          type: string
          format: uuid
        replacementRequestId:
          type: string
          format: uuid
        originalState:
          type: string
          enum: [AMENDED]
        replacementState:
          type: string
          enum: [PENDING]
        amendedAt:
          type: string
          format: date-time
    WithdrawMyApprovedLeave:
      type: object
      description: >-
        MVP-041F. The employee's withdrawal of their own approved future leave, with its reason. The
        request comes from the path; tenant, employee, actor, decision and state are never fields.
      additionalProperties: false
      required: [reasonLocale, reason]
      properties:
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: >-
            Plain text, the same decision-reason grammar version 1 as DecideLeaveRequest.reason
            (identical in the Core, the database and the web form).
    LeaveWithdrawalReceipt:
      type: object
      description: >-
        MVP-041F. The minimal receipt of a withdrawal; never the reason, the actor, the policy, the
        dates, the amount or the approval.
      required: [withdrawalId, requestId, state, withdrawnAt]
      properties:
        withdrawalId:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        state:
          type: string
          enum: [WITHDRAWN]
        withdrawnAt:
          type: string
          format: date-time
    LeaveCancellationReceipt:
      type: object
      description: MVP-041C. The minimal receipt of a cancellation; never the reason.
      required: [requestId, cancellationId, state, cancelledAt]
      properties:
        requestId:
          type: string
          format: uuid
        cancellationId:
          type: string
          format: uuid
        state:
          type: string
          enum: [CANCELLED]
        cancelledAt:
          type: string
          format: date-time
    CreateLeaveApprovalSubstitution:
      type: object
      description: >-
        MVP-041G. A tenant administrator's appointment of one substitute for a manager. Tenant and
        actor are never fields.
      additionalProperties: false
      required:
        - managerEmployeeId
        - substituteEmployeeId
        - effectiveFrom
        - effectiveTo
        - reasonLocale
        - reason
      properties:
        managerEmployeeId:
          type: string
          format: uuid
        substituteEmployeeId:
          type: string
          format: uuid
          description: Another employee of the organization.
        effectiveFrom:
          type: string
          format: date
          description: First day (inclusive), 1900-01-01 to 2999-12-31.
        effectiveTo:
          type: string
          format: date
          description: Last day (inclusive), not before the first, at most 2999-12-31.
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: Plain text, the same decision-reason grammar version 1 as DecideLeaveRequest.reason.
    RevokeLeaveApprovalSubstitution:
      type: object
      description: >-
        MVP-041G. The revocation of an appointment, with its reason. The appointment comes from
        the path; tenant and actor are never fields.
      additionalProperties: false
      required: [reasonLocale, reason]
      properties:
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: Plain text, the same decision-reason grammar version 1 as DecideLeaveRequest.reason.
    LeaveApprovalSubstitutionState:
      type: string
      enum: [SCHEDULED, ACTIVE, EXPIRED, REVOKED]
      description: >-
        MVP-041G. Derived on the organization's business date, never stored: REVOKED once revoked,
        otherwise SCHEDULED before the first day, ACTIVE within the period, EXPIRED after it.
    LeaveApprovalSubstitutionEmployee:
      type: object
      description: An employee's directory fields, as plain text.
      required: [id, employeeNumber, givenNames, familyName]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
    LeaveApprovalSubstitutionRevocation:
      type: object
      required: [revokedAt, reasonLocale, reason]
      properties:
        revokedAt:
          type: string
          format: date-time
        reasonLocale:
          type: string
          enum: [en, fr]
        reason:
          type: string
          description: Plain text, never HTML or Markdown.
    LeaveApprovalSubstitution:
      type: object
      description: >-
        MVP-041G. An appointment as tenant administrators list it. Restricted HR; never a subject or
        actor.
      required:
        - id
        - manager
        - substitute
        - effectiveFrom
        - effectiveTo
        - state
        - reasonLocale
        - reason
        - createdAt
        - revocation
      properties:
        id:
          type: string
          format: uuid
        manager:
          $ref: "#/components/schemas/LeaveApprovalSubstitutionEmployee"
        substitute:
          $ref: "#/components/schemas/LeaveApprovalSubstitutionEmployee"
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        state:
          $ref: "#/components/schemas/LeaveApprovalSubstitutionState"
        reasonLocale:
          type: string
          enum: [en, fr]
        reason:
          type: string
          description: Plain text, never HTML or Markdown.
        createdAt:
          type: string
          format: date-time
        revocation:
          oneOf:
            - $ref: "#/components/schemas/LeaveApprovalSubstitutionRevocation"
            - type: "null"
    LeaveApprovalSubstitutionPage:
      type: object
      required: [items, nextCursor, asOf]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeaveApprovalSubstitution"
        nextCursor:
          type: [string, "null"]
        asOf:
          type: string
          format: date
          description: The organization's business date the states were derived on.
    LeaveApprovalSubstitutionReceipt:
      type: object
      description: MVP-041G. The minimal receipt of an appointment; never the reason.
      required: [substitutionId, createdAt]
      properties:
        substitutionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    LeaveApprovalSubstitutionRevocationReceipt:
      type: object
      description: MVP-041G. The minimal receipt of a revocation; never the reason.
      required: [substitutionId, revocationId, state, revokedAt]
      properties:
        substitutionId:
          type: string
          format: uuid
        revocationId:
          type: string
          format: uuid
        state:
          type: string
          enum: [REVOKED]
        revokedAt:
          type: string
          format: date-time
    WorkScheduleLabels:
      type: object
      description: >-
        MVP-050A. A slot's English and French labels: closed plain-text grammar version 1 (2-60
        characters, Latin letters with accents, digits, single spaces and . , ' ’ - ( ) / & # °;
        no markup, link or e-mail address), trimmed with spaces collapsed.
      required: [en, fr]
      properties:
        en:
          type: string
          minLength: 2
          maxLength: 60
        fr:
          type: string
          minLength: 2
          maxLength: 60
    WorkScheduleSlotInput:
      type: object
      description: MVP-050A. One proposed slot, one required worker.
      required: [clientRef, start, end, labels]
      properties:
        clientRef:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,40}$"
          description: The client's correlation reference, unique in the request; never stored.
        start:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$"
          description: Local start on a schedule date, in the selected site's time zone.
        end:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$"
          description: Local end, after the start, at most the next date and 24 hours later.
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
        employeeId:
          type: [string, "null"]
          format: uuid
          description: The assigned employee; absent or null for an uncovered slot.
    WorkScheduleRequest:
      type: object
      description: MVP-050A. A complete proposed schedule.
      required: [siteId, firstDate, lastDate, slots]
      properties:
        siteId:
          type: string
          format: uuid
        firstDate:
          type: string
          format: date
        lastDate:
          type: string
          format: date
        slots:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/WorkScheduleSlotInput"
    CancelWorkScheduleRequest:
      type: object
      description: MVP-050B. The cancellation's reason and the confirmation.
      required: [reason, confirm]
      properties:
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: >-
            Decision-reason grammar version 1 (NFC; no control, format, private-use or
            noncharacter code point; 2 to 500 code points). Restricted HR.
        confirm:
          type: boolean
          enum: [true]
    WorkScheduleReplacementRequest:
      type: object
      description: >-
        MVP-050B. Every slot of the replacement and the reason. The site and the period are the
        original's and cannot be sent.
      required: [slots, reason]
      properties:
        slots:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/WorkScheduleSlotInput"
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: Decision-reason grammar version 1. Restricted HR.
    ReplaceWorkScheduleRequest:
      type: object
      description: MVP-050B. The reviewed replacement, its preview digest and the confirmation.
      required: [slots, reason, previewDigest, confirm]
      properties:
        slots:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/WorkScheduleSlotInput"
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: Decision-reason grammar version 1. Restricted HR.
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirm:
          type: boolean
          enum: [true]
    WorkScheduleStatus:
      type: string
      description: >-
        MVP-050B. A schedule's derived state: PUBLISHED (operational), CANCELLED or REPLACED,
        from append-only evidence.
      enum: [PUBLISHED, CANCELLED, REPLACED]
    WorkScheduleChangeReceipt:
      type: object
      description: MVP-050B. The receipt of a cancellation or replacement; never the reason or actor.
      required: [scheduleId, status, changedAt, replacementScheduleId, totals]
      properties:
        scheduleId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WorkScheduleStatus"
        changedAt:
          type: string
          format: date-time
        replacementScheduleId:
          type: [string, "null"]
          format: uuid
        totals:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleTotals"
            - type: "null"
    PublishWorkScheduleRequest:
      type: object
      description: MVP-050A. The reviewed proposal, its preview digest and the confirmation.
      required: [siteId, firstDate, lastDate, slots, previewDigest, confirm]
      properties:
        siteId:
          type: string
          format: uuid
        firstDate:
          type: string
          format: date
        lastDate:
          type: string
          format: date
        slots:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/WorkScheduleSlotInput"
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirm:
          type: boolean
          enum: [true]
    WorkScheduleSite:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: [string, "null"]
        name:
          type: [string, "null"]
    WorkScheduleEmployee:
      type: object
      description: Current directory data of an assigned employee; never stored with the slot.
      required: [id, employeeNumber, givenNames, familyName]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
    WorkScheduleTotals:
      type: object
      description: Derived from the slots, never stored as editable totals.
      required: [slots, assigned, uncovered]
      properties:
        slots:
          type: integer
        assigned:
          type: integer
        uncovered:
          type: integer
    WorkScheduleSlotIssue:
      type: object
      required: [code, reason]
      properties:
        code:
          type: string
          enum:
            - WORK_SCHEDULE_SLOT_INVALID
            - WORK_SCHEDULE_EMPLOYEE_NOT_ELIGIBLE
            - WORK_SCHEDULE_EMPLOYEE_CONFLICT
        reason:
          type: string
          enum:
            - OUTSIDE_PERIOD
            - END_NOT_AFTER_START
            - TOO_LONG
            - LOCAL_TIME_INVALID
            - NOT_FOUND
            - SEPARATED
            - NOT_EMPLOYED
            - NOT_AT_SITE
            - PUBLISHED
            - IN_SCHEDULE
            - NOT_FUTURE
    WorkSchedulePreviewSlot:
      type: object
      required:
        [clientRef, position, start, end, startAt, endAt, overnight, labels, employee, issue]
      properties:
        clientRef:
          type: string
        position:
          type: integer
        start:
          type: string
        end:
          type: string
        startAt:
          type: [string, "null"]
          format: date-time
        endAt:
          type: [string, "null"]
          format: date-time
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
        employee:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleEmployee"
            - type: "null"
        issue:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleSlotIssue"
            - type: "null"
    WorkSchedulePreview:
      type: object
      required:
        - asOf
        - siteTimezone
        - site
        - firstDate
        - lastDate
        - slots
        - totals
        - warnings
        - publishable
        - previewDigest
      properties:
        asOf:
          type: string
          format: date
          description: The site's business date (today in siteTimezone), resolved by the server.
        siteTimezone:
          type: string
          description: >-
            The selected site's IANA time zone: the clock of every slot, stored with the schedule
            as an immutable snapshot (never the organization's time zone).
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        firstDate:
          type: string
          format: date
        lastDate:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/WorkSchedulePreviewSlot"
        totals:
          $ref: "#/components/schemas/WorkScheduleTotals"
        warnings:
          type: array
          items:
            type: string
            enum: [UNCOVERED_SLOTS]
        publishable:
          type: boolean
        previewDigest:
          type: string
    WorkSchedulePublicationReceipt:
      type: object
      description: MVP-050A. The receipt of a publication; never a label or employee.
      required: [scheduleId, publishedAt, totals]
      properties:
        scheduleId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        totals:
          $ref: "#/components/schemas/WorkScheduleTotals"
    WorkScheduleSummary:
      type: object
      required:
        - id
        - site
        - firstDate
        - lastDate
        - siteTimezone
        - totals
        - publishedAt
        - status
        - changedAt
        - changeReason
        - replacesScheduleId
        - replacedByScheduleId
      properties:
        id:
          type: string
          format: uuid
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        firstDate:
          type: string
          format: date
        lastDate:
          type: string
          format: date
        siteTimezone:
          type: string
          description: The site time zone snapshot stored at publication, the clock of every slot.
        totals:
          $ref: "#/components/schemas/WorkScheduleTotals"
        publishedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/WorkScheduleStatus"
        changedAt:
          type: [string, "null"]
          format: date-time
          description: The cancellation or replacement instant (MVP-050B).
        changeReason:
          type: [string, "null"]
          description: The cancellation or replacement reason (Restricted HR; administrators only).
        replacesScheduleId:
          type: [string, "null"]
          format: uuid
        replacedByScheduleId:
          type: [string, "null"]
          format: uuid
    WorkSchedulePage:
      type: object
      required: [items, nextCursor, asOf]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkScheduleSummary"
        nextCursor:
          type: [string, "null"]
        asOf:
          type: string
          format: date
          description: >-
            The organization's business date (informational; each schedule's clock is its
            siteTimezone).
    WorkScheduleSlot:
      type: object
      description: >-
        employee is the immutable published assignee. MVP-051: effectiveEmployee is the employee
        of the slot's current operational coverage (the published assignee, or the approved
        substitute; null for an uncovered slot and for every slot of a cancelled or replaced
        schedule, whose coverage was released), and substitution the slot's approved
