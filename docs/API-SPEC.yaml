  /me/expenses:
    post:
      operationId: createMyExpense
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Create an expense draft
      description: >-
        MVP-081 (ADR 0031). Creates a DRAFT expense of the caller's own employee (resolved from the caller's current active employee-access link on every request; 403 EMPLOYEE_LINK_REQUIRED otherwise) in one transaction with its CREATED action and the audit record expense.create. currency is CDF (whole francs, 1 to 100,000,000) or USD (at most two decimals, 0.01 to 100,000.00); amount is a decimal string, never a JSON number, and is stored as integer minor units; the two currencies are never converted or combined. businessDate is the organization's today or up to 90 days earlier (never in the future). merchant (1-120) and description (10-1000) are restricted plain text and never appear in logs, metrics, audit, events, cursors, URLs or errors. At most 100 open expenses per employee and 5,000 per tenant (409 EXPENSE_LIMIT_REACHED); at most 60 expense writes per employee and 600 per tenant per hour. The response is a text-free receipt so that the idempotency store never holds user text; read the expense with getMyExpense. Approval of an expense is not reimbursement or payment. Cache-Control private, no-store.
