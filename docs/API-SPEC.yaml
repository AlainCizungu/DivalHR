    ContractExpirationCategory:
      type: string
      enum: [EXPIRED, NEXT_30_DAYS, DAYS_31_TO_60, DAYS_61_TO_90]
      description: >-
        d = end date - business date. EXPIRED d < 0; NEXT_30_DAYS 0 to 30 (a contract ending
        today is not expired); DAYS_31_TO_60; DAYS_61_TO_90.
    ContractExpirationSearch:
      type: object
      additionalProperties: false
      description: Every field is optional.
      properties:
        query:
          type: [string, "null"]
          minLength: 2
          maxLength: 100
          description: >-
            Employee-number prefix or name words, as the employee search (2-100 code points after
            NFC normalization). Never logged, audited or echoed.
        unitId:
          type: [string, "null"]
          format: uuid
          description: >-
            Department or cost center of the employee's current placement (on the business date,
            or on the first day of an employment that has not started). Bound into the cursor;
            the counts honor it.
        categories:
          type: [array, "null"]
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ContractExpirationCategory"
          description: Categories of the items (default all). The counts always cover all four.
        cursor:
          type: [string, "null"]
          maxLength: 512
        limit:
          type: [integer, "null"]
          minimum: 1
          maximum: 50
    ContractExpirationCounts:
      type: object
      required: [expired, next30Days, days31To60, days61To90, total]
      properties:
