            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/attendance/{attendanceRecordId}/check-out:
    post:
      operationId: checkOutMyAttendance
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Check out of one of my open attendance records
      description: >-
        MVP-060A. Records the single check-out of an OPEN attendance record of the employee of the
        caller's current active employee-access link (403 EMPLOYEE_LINK_REQUIRED otherwise), at
        the server's instant. No body. Malformed, unknown, foreign-tenant and other employees'
        records are the same 404 ATTENDANCE_RECORD_NOT_FOUND without params. A record already
        checked out is 409 ATTENDANCE_ALREADY_CHECKED_OUT; after 24 hours past the scheduled end,
        409 ATTENDANCE_CHECK_OUT_WINDOW_CLOSED; an instant not strictly after the check-in is 409
        ATTENDANCE_STATE_CONFLICT. The check-out does not depend on the shift still being
        operational or covered by the caller: evidence recorded before a cancellation,
        replacement or substitution is kept and can be completed. One transaction, under the
        tenant's scheduling lock, writes the CHECKED_OUT event, completes the record, writes the
        audit record (attendance.check-out) and the outbox event
        (people.attendance.checked-out.v1). Replay as for the check-in. Shares the
        attendance-write limits. Cache-Control private, no-store.
      tags: [people]
