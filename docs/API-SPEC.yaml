        EMPLOYEE_LINK_REQUIRED and linked to another employee 404 LEAVE_REQUEST_NOT_FOUND, with no
        stored response. A changed body on the key is 409 IDEMPOTENCY_KEY_REUSED. The receipt never
        carries the reason, the actor, the policy, the dates, the amount or the approval; errors
