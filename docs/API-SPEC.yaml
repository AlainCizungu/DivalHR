      summary: List an employee's recorded employment changes
      description: >-
        MVP-021. The append-only change log, newest first: hire, changes, corrections and
        cancellations, including cancelled changes. The recording actor is not returned (it is in
        the audit trail). Recorded as a disclosure (audit employment-change.list). Cache-Control
        private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EmployeeLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of changes
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createEmploymentChange
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Record an effective-dated change or a correction
      description: >-
        MVP-021. Repeats a previewed command with the expectedVersion and previewDigest the
        preview returned. In one transaction the employment is locked, the version checked (409
        EMPLOYMENT_VERSION_CONFLICT), every rule re-validated, and the change recomputed; any
        difference from the preview gives 409 EMPLOYMENT_PREVIEW_CHANGED and nothing is written.
        A retroactive change needs a reason code and acknowledgeRetroactive=true. Nothing is
        updated in place: replaced rows are superseded and kept. Business changes, audit and outbox
        commit together. Retries with the same Idempotency-Key replay the original 201.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmploymentChange"
      responses:
        "201":
          description: Change recorded, or the original recording replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
