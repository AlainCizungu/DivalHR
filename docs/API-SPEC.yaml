      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Lock a reviewed week
      description: >-
        MVP-071. Under the tenant's scheduling lock (taken first by every timesheet command and
        attendance correction), the generation, its lock projection and every timesheet are locked
        and the readiness is evaluated again. A generation or lock version that differs from the
        reviewed one, an expired preview or a preview digest that no longer matches the approval
        evidence is 409 TIMESHEET_PERIOD_PREVIEW_STALE; a week that is not ready is 409
        TIMESHEET_PERIOD_NOT_READY. A week that is already locked and whose preview named its
        current lock is returned unchanged (outcome UNCHANGED). Otherwise one transaction appends
        the immutable LOCKED period action (the exact scope, generation version, approval evidence
        digest, counts and total, bound by the database to a fully approved current generation),
        moves the lock projection to LOCKED at the next version, writes the audit record
        (timesheet-period.lock) and the outbox event (people.timesheet-period.locked.v1); a failure
        of any of them writes nothing. While locked, attendance corrections of the week's shifts,
        refreshes and every timesheet transition are 409 TIMESHEET_PERIOD_LOCKED; reads and
        existing exports are unaffected. Idempotent (an identical replay returns the original; a
        changed payload with the same key is 409 IDEMPOTENCY_KEY_REUSED). Shares the
        work-schedule-write limits. Cache-Control private, no-store.
