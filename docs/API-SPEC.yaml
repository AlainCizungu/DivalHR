      - state
      - issuedAt
      - acknowledgedAt
      properties:
        id:
          type: string
          format: uuid
        contractType:
          $ref: '#/components/schemas/ContractClassification'
        locale:
          $ref: '#/components/schemas/ContractLocale'
        startDate:
          type: string
          format: date
        endDate:
          type:
          - string
          - 'null'
          format: date
        state:
          $ref: '#/components/schemas/ContractState'
        issuedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type:
          - string
          - 'null'
          format: date-time
    MyContractPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyContractSummary'
        nextCursor:
          type:
          - string
          - 'null'
    AcknowledgementStatement:
      type: object
      required:
      - code
      - version
      - locale
      - text
      - sha256
      properties:
        code:
          type: string
          enum:
          - RECEIVED_AND_REVIEWED
        version:
          type: integer
          enum:
          - 1
        locale:
          $ref: '#/components/schemas/ContractLocale'
        text:
          type: string
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: DIVALHR-CONTRACT-ACKNOWLEDGEMENT-STATEMENT v1 digest (A30-4).
    MyContract:
      allOf:
      - $ref: '#/components/schemas/MyContractSummary'
      - type: object
        required:
        - snapshot
        - integrity
        - statements
        - acknowledgement
        properties:
          snapshot:
            $ref: '#/components/schemas/ContractSnapshot'
          integrity:
            $ref: '#/components/schemas/ContractIntegrity'
          statements:
            type: array
            items:
              $ref: '#/components/schemas/AcknowledgementStatement'
            description: The current statement in French and English; the client shows one.
          acknowledgement:
            oneOf:
            - $ref: '#/components/schemas/ContractAcknowledgementEvidence'
            - type: 'null'
    AcknowledgeContract:
      type: object
      additionalProperties: false
      required:
      - snapshotSha256
      - snapshotDigestVersion
      - grammarVersion
      - rendererVersion
      - statementCode
      - statementVersion
      - statementLocale
      - statementSha256
      properties:
        snapshotSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        snapshotDigestVersion:
          type: integer
        grammarVersion:
          type: integer
        rendererVersion:
          type: integer
        statementCode:
          type: string
        statementVersion:
          type: integer
        statementLocale:
          $ref: '#/components/schemas/ContractLocale'
        statementSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    ContractAcknowledgementResult:
      type: object
      required:
      - contract
      - alreadyAcknowledged
      properties:
        contract:
          $ref: '#/components/schemas/MyContract'
        alreadyAcknowledged:
          type: boolean
