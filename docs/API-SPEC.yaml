      parameters:
        - name: timesheetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnTimesheetRequest"
      responses:
        "200":
          description: Returned, or the original replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetActionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /integrations/webhooks:
    post:
      operationId: createWebhook
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Create a signed outbound webhook
      description: >-
        MVP-110 (ADR 0028). Creates one HTTPS endpoint subscribed to a closed set of public events. The endpoint is normalized and resolved: a name that resolves to, or also to, a loopback, private, link-local, multicast, CGNAT, documentation, reserved or cloud-metadata address is 422 WEBHOOK_DESTINATION_BLOCKED; a malformed or unresolvable endpoint is 400 WEBHOOK_URL_INVALID; an unknown, duplicate or missing event type is 400 WEBHOOK_EVENT_TYPE_INVALID; the 21st webhook of a tenant is 409 WEBHOOK_LIMIT_REACHED. The random signing secret is returned once, in this response only; it is stored encrypted (AES-256-GCM) and a replay of the same Idempotency-Key returns the webhook with a null secret. One transaction writes the webhook, its secret, the audit record (webhook.create) and the outbox event. Idempotent. Cache-Control private, no-store.
      tags: [integrations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Created, or the original replayed (without the secret)
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      operationId: listWebhooks
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: List the tenant's webhooks
      description: >-
        MVP-110. The tenant's webhooks, newest first, as a keyset page (signed cursor bound to the operation and tenant). A fail-closed disclosure (audit webhook.read). Never returns a secret. Cache-Control private, no-store.
      tags: [integrations]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AttendanceLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
