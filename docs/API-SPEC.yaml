        (params.position and params.reason); any other difference from the reviewed preview (the
        site's time zone or business date included) is 409 WORK_SCHEDULE_PREVIEW_STALE, never recomputed and published; the whole-schedule errors are
        the preview's. One transaction with the immutable schedule and all its slots, the audit
        record (work-schedule.publish: IDs, site, dates and counts only) and the outbox event
        (people.work-schedule.published.v1). Only the body's shape is checked before the
        idempotency decision: an exact retry returns the stored 201 with Idempotent-Replayed true,
        a changed body on the same key is 409 IDEMPOTENCY_KEY_REUSED. No label, employee name or
        number in errors, logs, audit metadata or events. Shares the work-schedule-write limits.
