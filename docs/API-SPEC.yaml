            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCorrectionHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: correctAttendanceRecord
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Commit a previewed correction of an attendance record
      description: >-
        MVP-062 (REPLACE_TIMES). Commits exactly the reviewed preview: the identical proposal, its
        targetVersion, its previewDigest and confirm true. Under the tenant's scheduling lock, with
        the record's employment FOR SHARE, the schedule and the record FOR UPDATE, every fact is
        evaluated again: a changed record version or any other difference from the reviewed
        preview is 409 ATTENDANCE_CORRECTION_PREVIEW_STALE, never recomputed and committed;
        leaving the record open over another open record of the employee is 409
        ATTENDANCE_CORRECTION_NOT_ALLOWED. One transaction with the append-only correction
        (version + 1), the effective record's guarded update, the audit record
        (attendance.correction-create: schemaVersion, operation, reasonCode, hadCheckOutBefore,
        hasCheckOutAfter only) and the outbox event (people.attendance.corrected.v1). The original
        events are never changed. Only the body's shape is checked before the idempotency
        decision: an exact retry returns the stored 201 with Idempotent-Replayed true, a changed
        body on the same key is 409 IDEMPOTENCY_KEY_REUSED. The receipt never carries the
        explanation. Shares the work-schedule-write limits. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/AttendanceRecordId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
