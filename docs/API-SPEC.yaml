  /operations/status:
    get:
      operationId: getOperationalStatus
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Read the organization's operational status of today
      description: >-
        MVP-100 (ADR 0026). Today's operational status of the organization, optionally of one site
        and/or one legal entity; a malformed, unknown, foreign or wrong-kind siteId or legalEntityId
        is 404 OPERATIONAL_STATUS_SCOPE_NOT_FOUND without params. Derived read-only at one
        server-owned asOfInstant from the immutable schedules, terminal evidence, approved
        substitutions, attendance records, pending leave requests and submitted timesheets; nothing
        is stored. "Today" is evaluated in each site's stored time zone (shifts starting on that
        local date, and shifts still in progress that began the previous local date). The workforce
        values count effective assigned shift occurrences, not people, and expected + notCheckedIn
        + present + completed = scheduled is an exclusive partition; late is a subset. A shift with
        no check-in is expected until strictly more than 30 minutes after its scheduled start
        (exactly 30 minutes is still expected) and notCheckedIn after; a check-in strictly more
        than 5 minutes after the start is late (exactly 5 minutes is not). coverage.uncovered
        counts operational slots without an effective assignee (the approved substitute when
        approved before the slot's end, otherwise the published assignee); slots of schedules
        cancelled or replaced by asOfInstant are excluded. The legal-entity filter uses the
        effective-dated placement of the effective assignee on the shift's date (an uncovered slot
        follows the legal entity of its site), and of the employment of a leave request or
        timesheet on its reference date. Pending leave requests of the organization (any route)
        and submitted timesheets are overdue only when strictly older than 48 and 72 hours. The
        administrator is not shown as the routed approver and receives no person details for
        approvals. Detail lists hold at most 20 rows, ordered deterministically, with an explicit
        truncated flag; the counts are independent of them. Facts only: no absence, leave, pay or
        disciplinary conclusion. Restricted HR/Operations: a fail-closed disclosure (audit
        operations.status-admin-view). Shares the work-schedule-read limit. Cache-Control private,
        no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/OperationalStatusSite"
        - $ref: "#/components/parameters/OperationalStatusLegalEntity"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PrivilegedForbidden"
        "404":
