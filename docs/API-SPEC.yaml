        nextCursor:
          type: string
    CreateCostCenter:
      type: object
      additionalProperties: false
      description: >-
        The tenant comes only from the verified access token. id, tenantId, organizationId,
        legalEntityId, createdBy and any other property are rejected.
      required: [siteId, code, name, effectiveFrom]
      properties:
        siteId:
          type: string
          format: uuid
        code:
          type: string
          description: Trimmed and upper-cased; 2-20 of A-Z, 0-9, hyphen and underscore.
