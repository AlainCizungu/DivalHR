      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Read an attendance record's correction history
      description: >-
        MVP-062. One attendance record of the organization: its current effective values (status,
        check-in, check-out, correctionVersion, correctedAt), its employee (ID, number, current
        name), its shift, its original events unchanged (type, instant, recording method; none for
        a record created by a correction) and its append-only corrections, newest first (version,
        operation, before and after values, reasonCode, explanation, correctedAt, whether the
        viewing administrator committed it, and a stable pseudonymous administratorReference; never
        the subject). An unknown, foreign or malformed record is 404
        ATTENDANCE_CORRECTION_TARGET_NOT_FOUND. Restricted HR/Operations: a fail-closed disclosure
        (audit attendance.correction-history). Shares the work-schedule-read limit. Cache-Control
        private, no-store.
