        MANAGER) and whose employment no active, non-superseded MANAGER line covers on the
        request's first day. Derived on every read, never stored: once a qualifying manager is
        assigned, corrected or restored, the request leaves this list and returns to that manager's
        inbox. Each item carries the same fields as a LeaveApproval and the fixed exceptionReason
