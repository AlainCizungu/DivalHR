  /me/timesheets/{timesheetId}:
    get:
      operationId: getMyTimesheet
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: One of my timesheets
      description: >-
        MVP-070A. One of the caller's own drafts with its current rows: labels, scheduled instants,
        the effective check-in and check-out, whether the organization corrected them, the state and
        the worked minutes. No schedule, employment, cost center or record identifier, never who
        generated it or a correction's explanation. MVP-070B/C: the state, the generation version
        and latest cycle to submit with, whether it can be submitted now and what blocks it, and
        every submission, return (with its reason) and approval, newest first; never who
        approves. Another employee's, a foreign, malformed or
        unknown draft is the same 404 TIMESHEET_TARGET_NOT_FOUND. A fail-closed disclosure (audit
        timesheet.self-read). Cache-Control private, no-store.
