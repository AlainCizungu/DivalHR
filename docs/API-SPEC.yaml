        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/work-schedule-substitution-approvals/{requestId}/decision:
    post:
      operationId: decideWorkScheduleSubstitution
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Approve or reject a shift-substitution request as its manager
      description: >-
        MVP-051. Decides, once, a PENDING request routed to the caller as listed by
        listMyWorkScheduleSubstitutionApprovals. REJECTED records the rejection and removes the
        pending projection; the original employee keeps the shift. APPROVED names one substitute
        (substituteEmployeeId, required for approval and refused with VALIDATION_FAILED FORMAT for
        rejection) and, in one transaction, removes the original employee's operational coverage,
        inserts the substitute's coverage on the same immutable slot, removes the pending
        projection, records the decision and runs the deferred exactness and exclusion checks
        immediately; the published schedule and slot never change. The authority is
        re-evaluated under the manager-graph lock, then the scheduling lock, with the
        employments FOR SHARE in ID order, the caller's link FOR SHARE and the schedule and request
        FOR UPDATE. Unknown, foreign, other managers' and otherwise undisclosable requests are the
        same 404 WORK_SCHEDULE_SUBSTITUTION_NOT_FOUND without params; a decided request is 409
        WORK_SCHEDULE_SUBSTITUTION_ALREADY_DECIDED; a started shift is 409
        WORK_SCHEDULE_SUBSTITUTION_WINDOW_CLOSED; a cancelled or replaced schedule is 409
        WORK_SCHEDULE_SUBSTITUTION_NOT_AVAILABLE (NOT_OPERATIONAL). A substitute who is unknown,
        foreign, the original employee, the caller, not the caller's report on the shift's
        site-local start date, without exactly one qualifying employment, separated before the
        shift ends, not employed on every occupied date or not placed at the site is the same 422
        WORK_SCHEDULE_SUBSTITUTE_NOT_ELIGIBLE without params; an overlapping operational
        assignment at any site is 409 WORK_SCHEDULE_SUBSTITUTE_CONFLICT without params. Audit
        work-schedule-substitution.approve or .reject; event
        people.work-schedule-substitution.approved.v1 or .rejected.v1 (IDs and outcome only). The
        200 receipt never carries a reason. An exact retry replays only while the caller's
        currently linked employee is still the request's effective manager; a denied replay
        returns no stored response or identifier. Shares the work-schedule-substitution-write
        limits. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/WorkScheduleSubstitutionRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideWorkScheduleSubstitution"
      responses:
        "200":
          description: Decided, or the original decision replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkScheduleSubstitutionDecisionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/attendance:
