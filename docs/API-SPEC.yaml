        - WEB_ADDRESS
        - ENCODED_CONTENT
        - MARKDOWN_LINK
        - HTML_MARKUP
        - UNKNOWN_PLACEHOLDER
        - MALFORMED_PLACEHOLDER
        - TOO_MANY_PLACEHOLDERS
        - BRACES
