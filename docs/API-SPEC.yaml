        state (so the administrators' refresh applies again and the employee resubmits as the next
        cycle), the audit record (timesheet.return) and the outbox event
        (people.timesheet.returned.v1). The reason never enters audit metadata, events, logs or
        errors. Idempotent; a replay is answered only while the caller still holds the route.
