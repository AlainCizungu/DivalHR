      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Generate the organization's grounded operational briefing
      description: >-
        MVP-101 (ADR 0027, decisions D101-1 to D101-16). Generates, on demand, a short grounded
        briefing of the same aggregate figures that the operational status shows, in the requested
        language (en or fr; any other value is 400 OPERATIONAL_SUMMARY_LANGUAGE_INVALID, and the
        body holds no other property). Nothing is stored: no briefing, prompt or response is
        persisted. Only aggregate counts, the fixed thresholds, closed fact types with opaque
        per-request fact identifiers and the as-of instant cross to the internal AI service (never
        a name, identifier, free text or date other than the as-of instant); the browser never calls
        that service. The service only chooses a headline code and fact identifiers; the visible text
        comes from reviewed bilingual templates, and Core re-validates everything returned. When
        the model provider fails, is slow (4 second deadline, one attempt) or answers outside its
        contract, the service itself answers from its deterministic policy and the briefing says
        generationMode FALLBACK. When the service cannot be reached or authenticated, or its answer
        fails Core's validation, the answer is 503 OPERATIONAL_SUMMARY_UNAVAILABLE without detail;
        facts Core itself cannot reconcile are 500 OPERATIONAL_SUMMARY_SOURCE_INVALID. Facts only: no
        conclusion about a person. Restricted HR/Operations: a fail-closed disclosure (audit
        ai.operational-summary-admin). Has its own subject and tenant limits (429). Cache-Control private, no-store.
        Optionally scoped to one site and/or one legal entity as the operational status is; a malformed,
        unknown, foreign or wrong-kind siteId or legalEntityId is 404 OPERATIONAL_STATUS_SCOPE_NOT_FOUND
