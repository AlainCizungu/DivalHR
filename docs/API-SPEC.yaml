      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Generate the immutable payroll inputs of a reviewed preview
      description: >-
        MVP-090A. Under the tenant's scheduling lock (taken first by every timesheet command, so no
        lock, unlock, correction, refresh or approval interleaves), the period is evaluated again;
        a preview digest or source versions digest that no longer matches the evidence, or an
        expired preview, is 409 PAYROLL_INPUT_PREVIEW_STALE; a period that is not ready (a week
        that matters is not generated or not locked, a locked week whose evidence changed, a row
        that cannot be attributed to the legal entity, no approved time) is 409
        PAYROLL_INPUT_NOT_READY. A run of this legal entity and period that already exists with
        identical evidence is returned as it is (outcome EXISTING); with different evidence it is
        409 PAYROLL_INPUT_RUN_EXISTS (generated evidence is never replaced; a superseding version
        is a later story). Otherwise one transaction writes the immutable run, its source weeks
        (generation, version, LOCKED action, lock version, lock evidence digest), one employee row
