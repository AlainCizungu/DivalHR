      description: >-
        MVP-050A. The organization's published schedules, latest period first (firstDate, then
        id), optionally of one site, of one derived state (status, MVP-050B) and overlapping the
        dates (ending on or after from, starting on or before to): the site's code and name, the
        dates, the stored time zone, the derived totals (slots, assigned, uncovered), the
        publication time and the derived state (PUBLISHED, CANCELLED or REPLACED) with the change
        instant, the change reason (Restricted HR, tenant administrators only) and the
        predecessor and successor IDs. Never the publisher or the actor of a change.
        Restricted HR/Operations: a fail-closed disclosure (audit work-schedule.read). The signed
        cursor is bound to the operation, tenant, caller, filters and page size. Shares the
        work-schedule-read limit. Cache-Control private, no-store.
      tags: [people]
