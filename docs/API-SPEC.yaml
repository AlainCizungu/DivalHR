    LeaveUnit:
      type: string
      enum: [DAYS, HOURS]
    LeaveBalanceMode:
      type: string
      enum: [TRACKED, UNTRACKED]
    LeaveApprovalRoute:
      type: string
      description: >-
        Who approves requests under the policy version: the requesting employee's manager on the
        request's first day, or a tenant administrator (enforced from MVP-041B).
      enum: [MANAGER, TENANT_ADMIN]
    LeavePayrollEffect:
      type: string
      description: Descriptive only; no payroll calculation.
      enum: [PAID, UNPAID]
    LeavePolicyStatus:
      type: string
      description: >-
        Computed by the server on the organization's business date asOf: PLANNED (starts after
        asOf), ACTIVE (asOf inside the period, both ends inclusive) or ENDED (ended before asOf).
      enum: [PLANNED, ACTIVE, ENDED]
    LeavePolicyNamesInput:
      type: object
      additionalProperties: false
      required: [en, fr]
      properties:
        en:
          type: string
          minLength: 2
          maxLength: 100
          description: >-
            English name. Trimmed and NFC-normalized; 2 to 100 characters; no control, format or
            line-separator characters.
        fr:
          type: string
          minLength: 2
          maxLength: 100
          description: French name, same rules.
    CreateLeavePolicy:
      type: object
      additionalProperties: false
      description: >-
        VALIDATION_FAILED fields: code, names, names.en, names.fr, unit, balanceMode,
        annualEntitlement, minimumServiceDays, approvalRoute, payrollEffect, effectiveFrom,
        effectiveTo, body (UNKNOWN_PROPERTY) and Idempotency-Key. annualEntitlement is REQUIRED for
        TRACKED and RANGE when sent for UNTRACKED; effectiveTo before effectiveFrom is RANGE.
      required:
        - code
        - names
        - unit
        - balanceMode
        - minimumServiceDays
        - approvalRoute
        - payrollEffect
        - effectiveFrom
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{1,19}$"
          description: 2 to 20 characters; trimmed and normalized to upper case; unique in the tenant.
        names:
          $ref: "#/components/schemas/LeavePolicyNamesInput"
        unit:
          $ref: "#/components/schemas/LeaveUnit"
        balanceMode:
          $ref: "#/components/schemas/LeaveBalanceMode"
        annualEntitlement:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 10000
          multipleOf: 0.01
          description: Required for TRACKED (at most two decimals); absent or null for UNTRACKED.
        minimumServiceDays:
          type: integer
          minimum: 0
          maximum: 3650
        approvalRoute:
          $ref: "#/components/schemas/LeaveApprovalRoute"
        payrollEffect:
          $ref: "#/components/schemas/LeavePayrollEffect"
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
          description: Optional last day, on or after effectiveFrom.
    LeavePolicyNames:
      type: object
      required: [en, fr]
      properties:
        en:
          type: string
        fr:
          type: string
    LeavePolicy:
      type: object
      required:
        - id
        - code
        - versionNumber
        - names
        - unit
        - balanceMode
        - annualEntitlement
        - minimumServiceDays
        - approvalRoute
        - payrollEffect
        - effectiveFrom
        - effectiveTo
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        versionNumber:
          type: integer
          minimum: 1
        names:
          $ref: "#/components/schemas/LeavePolicyNames"
        unit:
          $ref: "#/components/schemas/LeaveUnit"
        balanceMode:
          $ref: "#/components/schemas/LeaveBalanceMode"
        annualEntitlement:
          type: [number, "null"]
          description: Two decimals for TRACKED; null for UNTRACKED.
        minimumServiceDays:
          type: integer
        approvalRoute:
          $ref: "#/components/schemas/LeaveApprovalRoute"
        payrollEffect:
          $ref: "#/components/schemas/LeavePayrollEffect"
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
        status:
          $ref: "#/components/schemas/LeavePolicyStatus"
        createdAt:
          type: string
          format: date-time
    LeavePolicyResult:
      type: object
      required: [policy, asOf, timezone]
      properties:
        policy:
          $ref: "#/components/schemas/LeavePolicy"
        asOf:
          type: string
          format: date
          description: The organization's business date the status was computed for.
        timezone:
          type: string
          description: The organization's IANA time zone.
    LeavePolicyPage:
      type: object
      required: [items, nextCursor, asOf, timezone]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeavePolicy"
        nextCursor:
          type: [string, "null"]
        asOf:
          type: string
          format: date
          description: The organization's business date of every status, pinned across pages.
        timezone:
          type: string
          description: The organization's IANA time zone.
    LeaveRequestState:
      type: string
      description: >-
        MVP-041A creates PENDING requests; MVP-041B moves one once to APPROVED or REJECTED with its
        decision; MVP-041C lets its employee move it once to CANCELLED with a cancellation; MVP-041D
        lets its employee move it once to AMENDED with an amendment that names its PENDING
        replacement. MVP-041F lets its employee move an APPROVED request once more, before its first
        day, to WITHDRAWN with a withdrawal, keeping its approval decision. APPROVED requests keep
        blocking overlapping requests; REJECTED, CANCELLED, AMENDED and WITHDRAWN ones release their
        dates.
      enum: [PENDING, APPROVED, REJECTED, CANCELLED, AMENDED, WITHDRAWN]
    MyLeavePolicy:
      type: object
      required:
        - id
        - versionId
        - code
        - versionNumber
        - names
        - unit
        - balanceMode
        - annualEntitlement
        - minimumServiceDays
        - approvalRoute
        - payrollEffect
        - effectiveFrom
        - effectiveTo
        - status
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        code:
          type: string
        versionNumber:
          type: integer
          minimum: 1
        names:
          $ref: "#/components/schemas/LeavePolicyNames"
        unit:
          $ref: "#/components/schemas/LeaveUnit"
        balanceMode:
          $ref: "#/components/schemas/LeaveBalanceMode"
        annualEntitlement:
          type: [number, "null"]
          description: Two decimals for TRACKED; null for UNTRACKED. No balance is calculated yet.
        minimumServiceDays:
          type: integer
          description: Calendar days of employment before a request may start.
        approvalRoute:
          $ref: "#/components/schemas/LeaveApprovalRoute"
        payrollEffect:
          $ref: "#/components/schemas/LeavePayrollEffect"
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
        status:
          $ref: "#/components/schemas/LeavePolicyStatus"
    MyLeavePolicyPage:
      type: object
      required: [items, nextCursor, asOf, timezone]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyLeavePolicy"
        nextCursor:
          type: [string, "null"]
        asOf:
          type: string
          format: date
          description: The organization's business date of every status, pinned across pages.
        timezone:
          type: string
          description: The organization's IANA time zone.
    CreateMyLeaveRequest:
      type: object
      additionalProperties: false
      description: >-
        VALIDATION_FAILED fields: policyId, startDate (RANGE when before the business date),
        endDate (RANGE when before startDate or beyond 366 days in all), amount, body
        (UNKNOWN_PROPERTY) and Idempotency-Key.
      required: [policyId, startDate, endDate, amount]
      properties:
        policyId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
          multipleOf: 0.01
          description: The requested amount in the policy's unit (days or hours), entered by the employee.
    MyLeaveRequest:
      type: object
      required:
        - id
        - policyId
        - policyVersionId
        - policyCode
        - policyNames
        - unit
        - amount
        - startDate
        - endDate
        - state
        - submittedAt
        - decision
        - cancellation
        - amendment
        - amendedFromRequestId
        - withdrawal
      properties:
        id:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        policyVersionId:
          type: string
          format: uuid
        policyCode:
          type: string
        policyNames:
          $ref: "#/components/schemas/LeavePolicyNames"
        unit:
          $ref: "#/components/schemas/LeaveUnit"
        amount:
          type: number
          description: Two decimals, in the policy's unit.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        state:
          $ref: "#/components/schemas/LeaveRequestState"
        submittedAt:
          type: string
          format: date-time
        decision:
          description: The decision once taken (MVP-041B), otherwise null.
          oneOf:
            - $ref: "#/components/schemas/MyLeaveDecision"
            - type: "null"
        cancellation:
          description: The cancellation once cancelled (MVP-041C), otherwise null.
          oneOf:
            - $ref: "#/components/schemas/MyLeaveCancellation"
            - type: "null"
        amendment:
          description: The amendment that replaced this request once amended (MVP-041D), otherwise null.
          oneOf:
            - $ref: "#/components/schemas/MyLeaveAmendment"
            - type: "null"
        amendedFromRequestId:
          description: The request this one replaced (MVP-041D), otherwise null.
          type: [string, "null"]
          format: uuid
        withdrawal:
          description: >-
            The withdrawal of this approved request once withdrawn (MVP-041F), otherwise null. The
            approval decision stays in decision, unchanged.
          oneOf:
            - $ref: "#/components/schemas/MyLeaveWithdrawal"
            - type: "null"
    MyLeaveRequestPage:
      type: object
      required: [items, nextCursor, asOf]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyLeaveRequest"
        nextCursor:
          type: [string, "null"]
        asOf:
          type: string
          format: date
          description: >-
            MVP-041F. The organization's business date when the page was read (server-owned, from
            its time zone): approved leave whose startDate is after it may be withdrawn.
    MyLeaveWithdrawal:
      type: object
      description: >-
        MVP-041F. The withdrawal of one of the caller's own approved requests: the reason in the
        language it was written in (never translated). The withdrawing subject is never included.
      required: [id, reasonLocale, reason, withdrawnAt]
      properties:
        id:
          type: string
          format: uuid
        reasonLocale:
          type: string
          enum: [en, fr]
        reason:
          type: string
          description: Plain text, never HTML or Markdown.
        withdrawnAt:
          type: string
          format: date-time
    MyLeaveDecision:
      type: object
      description: >-
        MVP-041B. The decision on one of the caller's own requests: the outcome and the reason in
        the language it was written in (never translated). The deciding person is never included.
      required: [id, outcome, reasonLocale, reason, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [APPROVED, REJECTED]
        reasonLocale:
          type: string
          enum: [en, fr]
        reason:
          type: string
          description: Plain text, never HTML or Markdown.
        decidedAt:
          type: string
          format: date-time
    MyLeaveCancellation:
      type: object
      description: >-
        MVP-041C. The cancellation of one of the caller's own requests: the reason in the language
        it was written in (never translated). The cancelling subject is never included.
      required: [id, reasonLocale, reason, cancelledAt]
      properties:
        id:
          type: string
          format: uuid
        reasonLocale:
          type: string
          enum: [en, fr]
        reason:
          type: string
          description: Plain text, never HTML or Markdown.
        cancelledAt:
          type: string
          format: date-time
    MyLeaveAmendment:
      type: object
      description: >-
        MVP-041D. The amendment of one of the caller's own requests: the pending replacement's ID and
        the reason in the language it was written in (never translated). The amending subject is
        never included.
      required: [id, replacementRequestId, reasonLocale, reason, amendedAt]
      properties:
        id:
          type: string
          format: uuid
