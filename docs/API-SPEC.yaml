      operationId: listMyWorkScheduleSubstitutions
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: List my shift-substitution requests
      description: >-
        MVP-051. The substitution requests of the employee of the caller's current active
        employee-access link (403 EMPLOYEE_LINK_REQUIRED otherwise), newest first (requestedAt,
        then id). Each carries the shift (schedule, slot, site and siteTimezone, local and instant
        boundaries, overnight, both labels), the request reason in the language it was written in,
        the derived state and, once decided, the decision instant and reason; for an approval, the
        substitute's current minimal directory identity (ID, number, name). Never the deciding
        manager, a candidate or another request. The state is derived at one server-owned instant
        (asOfInstant), returned and pinned in the signed cursor: PENDING (pending and not started),
        APPROVED, REJECTED, EXPIRED (pending but started) or VOIDED (the schedule was cancelled or
        replaced before a decision). Restricted HR/Operations: a fail-closed disclosure (audit
        work-schedule-substitution.self-list). The signed cursor is bound to the operation,
        tenant, caller, linked employee, page size and asOfInstant. Shares the
        work-schedule-self-read limit. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LeavePolicyLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyWorkScheduleSubstitutionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: requestWorkScheduleSubstitution
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Request a substitute for one of my shifts
      description: >-
        MVP-051. Records a PENDING substitution request for a shift originally published to, and
        still operationally covered by, the employee of the caller's current active
        employee-access link (403 EMPLOYEE_LINK_REQUIRED otherwise). Tenant, employee,
        employment, manager and actor are never fields. Malformed, unknown, foreign-tenant,
        uncovered and other employees' slots are the same 404 WORK_SCHEDULE_SHIFT_NOT_FOUND
        without params. The shift must start strictly after the server's current instant (409
        WORK_SCHEDULE_SUBSTITUTION_WINDOW_CLOSED) and must not already have a pending request (409
        WORK_SCHEDULE_SUBSTITUTION_ALREADY_PENDING); a new request after a rejection is allowed.
        409 WORK_SCHEDULE_SUBSTITUTION_NOT_AVAILABLE carries params.reason: NOT_OPERATIONAL (the
        schedule was cancelled or replaced), SUBSTITUTED (an approved substitution already covers
        the shift), EMPLOYMENT (zero or several employments cover the shift and own the site
        placement) or NO_MANAGER (no active manager on the shift's site-local start date). The
        server stores the single qualifying employment; the manager is never stored and is
        re-evaluated on every read, decision and replay. One transaction, under the tenant's
        manager-graph lock and then its scheduling lock, writes the request, its pending
        projection, the audit record (work-schedule-substitution.request) and the outbox event
        (people.work-schedule-substitution.requested.v1). An exact retry returns the stored 201
        with Idempotent-Replayed true while the caller is still linked to the requesting
        employee; otherwise no stored response is returned (403 EMPLOYEE_LINK_REQUIRED, or 409
        IDEMPOTENCY_KEY_REUSED without params when linked to another employee). Errors never echo
        an ID, name, number, label or the reason. Shares the work-schedule-substitution-write
        limits. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkScheduleSubstitutionRequest"
      responses:
        "201":
          description: Created, or the original creation replayed
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyWorkScheduleSubstitution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/work-schedule-substitution-approvals:
