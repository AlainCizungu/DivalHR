        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/me/attendance/offline-events:sync":
    post:
      operationId: syncMyOfflineAttendanceEvent
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Synchronize one attendance event captured offline
      description: >-
        MVP-061A. Applies, exactly once, one check-in or check-out that the employee of the
        caller's current active employee-access link (403 EMPLOYEE_LINK_REQUIRED otherwise, on
        every first submission and replay) captured while offline. One event per request; no
        batch. Tenant, employee, employment, schedule, record, receipt instant, recording method
        and actor are never fields. The claimed device time (deviceOccurredAt, RFC 3339 with an
        explicit offset equal to deviceOffsetMinutes, else 422 OFFLINE_ATTENDANCE_OFFSET_MISMATCH)
        is untrusted evidence; the receipt instant is the server's. Idempotency: the durable
        identity is the verified tenant, the linked employee and clientEventId, stored with the
        evidence; no Idempotency-Key is read. The identical submission returns 200 with the
        original result (outcome ALREADY_APPLIED, the original IDs and both instants, the record's
        current status) and writes nothing; the same clientEventId with another slot, type,
        instant or offset is 409 IDEMPOTENCY_KEY_REUSED without params. A first submission is
        decided at receipt exactly as MVP-060A, on the claimed time. CHECK_IN: the slot of an
        operational schedule currently covered by the employee (the published assignee or the
        approved substitute); malformed, unknown, foreign-tenant, cancelled, replaced, uncovered
        and other employees' slots are the same 404 ATTENDANCE_SHIFT_NOT_FOUND without params;
        the claimed time from 2 hours before the scheduled start (409
        ATTENDANCE_CHECK_IN_TOO_EARLY before) to the scheduled end, exclusive (409
        ATTENDANCE_CHECK_IN_WINDOW_CLOSED). CHECK_OUT: the caller's own record on the slot (else
        the same 404 ATTENDANCE_RECORD_NOT_FOUND, also for a malformed, unknown or foreign slot),
        whatever the schedule's later state; the claimed time until 24 hours after the scheduled
        end, inclusive (409 ATTENDANCE_CHECK_OUT_WINDOW_CLOSED). Fixed safeguards: a claimed time
        more than 5 minutes after the receipt is 409 OFFLINE_ATTENDANCE_FUTURE_TIME; a receipt
        more than 72 hours after the claimed time, or more than 72 hours after the applicable
        window closed (the scheduled end for a check-in, the check-out deadline for a check-out),
        is 409 OFFLINE_ATTENDANCE_TOO_OLD; each bound is inclusive. An event another accepted
        event makes impossible to apply exactly is 409 OFFLINE_ATTENDANCE_CONFLICT: a check-in on
        a slot already checked in (by any method) or overlapping another open record of the
        employee; a check-out of a completed record or not strictly after the accepted check-in.
        Zero or several qualifying employments are 409 ATTENDANCE_STATE_CONFLICT. Existing events
        are never changed or reordered. One transaction, under the tenant's scheduling lock,
        writes the EMPLOYEE_OFFLINE_SYNC event with its provenance (client event, offset, receipt
        instant), the record (its instant is the claimed time), the audit record
        (attendance.offline-event-sync) and the outbox event (people.attendance.checked-in.v1 or
        checked-out.v1, unchanged; never the offset). Errors never echo an ID, timestamp, name,
        number or label. Shares the attendance-write limits. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncOfflineAttendanceRequest"
      responses:
        "201":
          description: Applied now
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineAttendanceSyncResult"
        "200":
          description: The identical submission was applied before; the original result
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineAttendanceSyncResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/team-attendance/actions:
    get:
      operationId: listTeamAttendanceActions
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: List the attendance actions my direct reports need now
      description: >-
        MVP-060B. The scheduled shifts of the caller's current direct reports that need a
        supervisor-assisted action at the page's server-owned instant (asOfInstant, pinned in the
        signed cursor): CHECK_IN for a not-recorded shift inside its check-in window (and no other
        actionable open record of the employee), CHECK_OUT for an OPEN record inside its check-out
        window. A direct report is the shift's current effective assignee (operational coverage)
        whose one qualifying employment has an active, non-superseded MANAGER line naming the
        employee of the caller's current active employee-access link (403 EMPLOYEE_LINK_REQUIRED
        otherwise) on the shift's site-local start date; never the caller themselves. A caller who
        manages nobody from three days before to one day after the organization's business date is
        403 TEAM_ATTENDANCE_MANAGER_REQUIRED. Ordered by the action deadline (the scheduled end
        for a check-in, 24 hours after it for a check-out), then the shift start, the slot and the
        action. Only what acting requires: IDs, the employee's number and current name, the site,
        the shift, the required action and deadline, the attendance state and recorded instants;
        never a reason, subject or employment. Restricted HR/Operations: a fail-closed disclosure
        (audit attendance.team-actions-list). The signed cursor is bound to the operation, tenant,
        subject digest, link, manager employee, page size and asOfInstant. Shares the
        work-schedule-self-read limit. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AttendanceLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamAttendanceActionPage"
