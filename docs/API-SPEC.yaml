          minLength: 10
          maxLength: 1000
    ExpenseVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    ReturnExpenseRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 10
          maxLength: 500
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [assigneeEmployeeId, title, priority]
      properties:
        assigneeEmployeeId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        instructions:
          type: [string, "null"]
          maxLength: 1000
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueAt:
          type: [string, "null"]
          format: date-time
    CancelTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          $ref: "#/components/schemas/TaskCancelReason"
        explanation:
          type: [string, "null"]
          maxLength: 500
          description: Required (10-500 characters) with reason OTHER, refused with any other reason.
    StartTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    CompleteTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        note:
          type: [string, "null"]
          maxLength: 500
