      description: >-
        MVP-070B/C. Whether the draft can be submitted now, and what blocks it: rows to resolve with
        the organization, no READY row, or no available approval route. Never names a manager.
      required: [eligible, blockers]
      properties:
        eligible:
          type: boolean
        blockers:
          type: array
          items:
            type: string
            enum: [MISSING_ATTENDANCE, OPEN_ATTENDANCE, SOURCE_CHANGED, NO_READY_ROWS, APPROVAL_ROUTE_UNAVAILABLE, REFRESH_REQUIRED]
    TimeApprovalEmployee:
      type: object
      description: MVP-070B/C. The submitting employee's number and current name.
      required: [employeeNumber, givenNames, familyName]
      properties:
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
    TimeApprovalItem:
      type: object
      description: MVP-070B/C. One currently submitted timesheet in the routed manager's queue.
      required: [timesheetId, employee, period, revision, cycle, rowCount, workedMinutes, submittedAt]
      properties:
        timesheetId:
          type: string
          format: uuid
        employee:
          $ref: "#/components/schemas/TimeApprovalEmployee"
        period:
          $ref: "#/components/schemas/TimesheetPeriod"
        revision:
          type: integer
          minimum: 1
        cycle:
          type: integer
          minimum: 1
        rowCount:
          type: integer
          minimum: 1
        workedMinutes:
          type: integer
          minimum: 0
        submittedAt:
          type: string
          format: date-time
    TimeApprovalPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TimeApprovalItem"
        nextCursor:
          type: [string, "null"]
    TimeApprovalDetail:
      type: object
      description: >-
        MVP-070B/C. A submitted timesheet for its routed manager: the submission evidence to bind
        a decision to, the submitted revision's rows and the history, newest first.
      required: [timesheetId, employee, period, status, revision, generationVersion, cycle, submissionActionId, submittedAt, totals, rows, actions, periodLocked]
      properties:
        timesheetId:
          type: string
          format: uuid
        employee:
          $ref: "#/components/schemas/TimeApprovalEmployee"
        period:
          $ref: "#/components/schemas/TimesheetPeriod"
        status:
          type: string
          enum: [SUBMITTED]
        revision:
          type: integer
          minimum: 1
        generationVersion:
          type: integer
          minimum: 1
        cycle:
          type: integer
          minimum: 1
        submissionActionId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        totals:
          $ref: "#/components/schemas/TimesheetTotals"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MyTimesheetRow"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/TimesheetAction"
        periodLocked:
          type: boolean
          description: MVP-071. Whether the week is locked for payroll preparation (the state only).
    AttendanceCorrectionReceipt:
      type: object
      description: >-
        MVP-062. A committed correction's receipt; never the explanation or the administrator.
        MVP-070D: reopenedTimesheets counts the approved timesheets the correction materially
        changed and reopened in the same transaction.
      required:
        [correctionId, operation, correctionVersion, correctedAt, reasonCode, before, after, record, reopenedTimesheets]
      properties:
        correctionId:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/AttendanceCorrectionOperation"
        correctionVersion:
          type: integer
          minimum: 1
        correctedAt:
          type: string
          format: date-time
        reasonCode:
          $ref: "#/components/schemas/AttendanceCorrectionReason"
        before:
          oneOf:
            - $ref: "#/components/schemas/AttendanceCorrectionTimes"
            - type: "null"
        after:
          $ref: "#/components/schemas/AttendanceCorrectionTimes"
        record:
          $ref: "#/components/schemas/CorrectedAttendanceRecord"
        reopenedTimesheets:
          type: integer
          minimum: 0
    AttendanceCorrectionHistoryEntry:
      type: object
      description: MVP-062. One committed correction; never the administrator's subject.
      required:
        [
          id,
          version,
          operation,
          before,
          after,
          reasonCode,
          explanation,
          correctedAt,
          correctedByYou,
          administratorReference,
        ]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        operation:
          $ref: "#/components/schemas/AttendanceCorrectionOperation"
        before:
          oneOf:
            - $ref: "#/components/schemas/AttendanceCorrectionTimes"
            - type: "null"
        after:
          $ref: "#/components/schemas/AttendanceCorrectionTimes"
        reasonCode:
          $ref: "#/components/schemas/AttendanceCorrectionReason"
        explanation:
          type: string
        correctedAt:
          type: string
          format: date-time
        correctedByYou:
          type: boolean
        administratorReference:
          type: string
          pattern: "^[0-9A-F]{8}$"
          description: A stable pseudonymous reference to the administrator within the organization.
    OriginalAttendanceEvent:
      type: object
      description: MVP-062. One original attendance event, unchanged.
      required: [type, recordedAt, recordingMethod]
      properties:
        type:
          type: string
          enum: [CHECKED_IN, CHECKED_OUT]
        recordedAt:
          type: string
          format: date-time
        recordingMethod:
          $ref: "#/components/schemas/AttendanceRecordingMethod"
    AttendanceCorrectionHistory:
      type: object
      description: MVP-062. A record's effective values, original events and corrections, newest first.
      required: [record, employee, shift, originalEvents, corrections]
      properties:
        record:
          $ref: "#/components/schemas/CorrectedAttendanceRecord"
        employee:
          $ref: "#/components/schemas/WorkScheduleSubstitutionPerson"
        shift:
          $ref: "#/components/schemas/AttendanceShift"
        originalEvents:
          type: array
          items:
            $ref: "#/components/schemas/OriginalAttendanceEvent"
        corrections:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceCorrectionHistoryEntry"
    MyAttendancePage:
      type: object
      required: [items, nextCursor, asOfInstant]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MyAttendanceRecord"
        nextCursor:
          type: [string, "null"]
        asOfInstant:
          type: string
          format: date-time
          description: The server-owned instant of the view, the same on every page.
    AttendanceRecordingMethod:
      type: string
      description: >-
        MVP-060B. SELF: recorded by the employee. SUPERVISOR: recorded by the employee's effective
        manager on their behalf, with a reason. MVP-061A: EMPLOYEE_OFFLINE_SYNC: captured by the
        employee while offline and synchronized later; its instant is the claimed device time.
      enum: [SELF, SUPERVISOR, EMPLOYEE_OFFLINE_SYNC]
    SyncOfflineAttendanceRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-061A. One event captured offline. Tenant, employee, employment, schedule, record,
        receipt instant, recording method and actor are never fields. VALIDATION_FAILED fields:
        clientEventId (REQUIRED, FORMAT), slotId (REQUIRED), type (REQUIRED, FORMAT),
        deviceOccurredAt (REQUIRED, FORMAT), deviceOffsetMinutes (REQUIRED, FORMAT, RANGE) and body
        (REQUIRED, UNKNOWN_PROPERTY); a slotId that is not a UUID is the same 404 as an unknown
        one (ATTENDANCE_SHIFT_NOT_FOUND for CHECK_IN, ATTENDANCE_RECORD_NOT_FOUND for CHECK_OUT).
      required: [clientEventId, slotId, type, deviceOccurredAt, deviceOffsetMinutes]
      properties:
        clientEventId:
          type: string
          format: uuid
          description: The immutable identity the client gave the event when it captured it.
        slotId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/OfflineAttendanceEventType"
        deviceOccurredAt:
          type: string
          format: date-time
          description: >-
            The claimed device time: RFC 3339 with upper-case T, seconds, at most six fractional
            digits and an explicit offset (Z or +hh:mm/-hh:mm, at most 14 hours, never -00:00); a
            real calendar date and time. Anything else is FORMAT.
        deviceOffsetMinutes:
          type: integer
          minimum: -840
          maximum: 840
          description: The device's UTC offset in minutes at capture; equal to the offset above.
    OfflineAttendanceEventType:
      type: string
      description: MVP-061A. The event captured offline.
      enum: [CHECK_IN, CHECK_OUT]
    OfflineAttendanceSyncResult:
      type: object
      description: >-
        MVP-061A. The result of a submission: APPLIED now (201) or ALREADY_APPLIED earlier (200,
        the original IDs and instants). Never the tenant, employee, employment, subject or offset.
      required:
        [
          outcome,
          clientEventId,
          attendanceRecordId,
          attendanceEventId,
          type,
          deviceOccurredAt,
          serverReceivedAt,
          recordingMethod,
          recordStatus,
        ]
      properties:
        outcome:
          type: string
          enum: [APPLIED, ALREADY_APPLIED]
        clientEventId:
          type: string
          format: uuid
        attendanceRecordId:
          type: string
          format: uuid
        attendanceEventId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/OfflineAttendanceEventType"
        deviceOccurredAt:
          type: string
          format: date-time
          description: The claimed device time as accepted (UTC).
        serverReceivedAt:
          type: string
          format: date-time
          description: The server's receipt instant of the first application.
        recordingMethod:
          type: string
          enum: [EMPLOYEE_OFFLINE_SYNC]
        recordStatus:
          $ref: "#/components/schemas/AttendanceStatus"
    TeamAttendanceRequiredAction:
      type: string
      description: MVP-060B. The action a direct report's shift needs now.
      enum: [CHECK_IN, CHECK_OUT]
    SupervisorCheckInRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-060B. The slot and the reason. Tenant, employee, manager, employment, actor and instant
        are never fields. VALIDATION_FAILED fields: slotId (REQUIRED), reasonLocale, reason, body
        (UNKNOWN_PROPERTY) and Idempotency-Key; a slotId that is not a UUID is the same 404
        TEAM_ATTENDANCE_ACTION_NOT_FOUND as an unknown one.
      required: [slotId, reasonLocale, reason]
      properties:
        slotId:
          type: string
          format: uuid
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          $ref: "#/components/schemas/WorkScheduleSubstitutionReason"
    SupervisorCheckOutRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-060B. The reason; the record comes from the path. VALIDATION_FAILED fields:
        reasonLocale, reason, body (REQUIRED, UNKNOWN_PROPERTY) and Idempotency-Key.
      required: [reasonLocale, reason]
      properties:
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          $ref: "#/components/schemas/WorkScheduleSubstitutionReason"
    SupervisorAttendanceReceipt:
      type: object
      description: >-
        MVP-060B. The minimal receipt of a supervisor-assisted check-in (OPEN) or check-out
        (COMPLETED) of the target employee; instants are the server's. Never the reason or the
        manager's identity.
      required:
        [
          attendanceRecordId,
          slotId,
          employeeId,
          status,
          recordingMethod,
          checkedInAt,
          checkedOutAt,
        ]
      properties:
        attendanceRecordId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
          description: The target employee.
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        recordingMethod:
          type: string
          enum: [SUPERVISOR]
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
    TeamAttendanceAction:
      type: object
      description: >-
        MVP-060B. One action a direct report's shift needs now. attendanceRecordId and checkedInAt
        are present for CHECK_OUT only.
      required:
        [
          requiredAction,
          actionDeadline,
          slotId,
          scheduleId,
          attendanceRecordId,
          employee,
          attendanceStatus,
          checkedInAt,
          site,
          siteTimezone,
          start,
          end,
          startAt,
          endAt,
          overnight,
          labels,
        ]
      properties:
        requiredAction:
          $ref: "#/components/schemas/TeamAttendanceRequiredAction"
        actionDeadline:
          type: string
          format: date-time
          description: >-
            The last instant the action is possible: the scheduled end (exclusive) for a check-in,
            24 hours after it (inclusive) for a check-out.
        slotId:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
        attendanceRecordId:
          type: [string, "null"]
          format: uuid
        employee:
          $ref: "#/components/schemas/WorkScheduleSubstitutionPerson"
        attendanceStatus:
          $ref: "#/components/schemas/WorkShiftAttendanceStatus"
        checkedInAt:
          type: [string, "null"]
          format: date-time
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        siteTimezone:
          type: string
          description: The schedule's site time zone snapshot; start and end are local times there.
        start:
          type: string
        end:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
    AttendanceExceptionType:
      type: string
      description: >-
        MVP-060C. A factual comparison of a scheduled shift with its attendance evidence, never a
        decision. MISSING_CHECK_IN: no check-in recorded by the scheduled end. MISSING_CHECK_OUT: no
        check-out recorded by the check-out deadline. LATE_CHECK_IN: checked in more than 5 minutes
        after the scheduled start. EARLY_CHECK_OUT: checked out more than 5 minutes before the
        scheduled end.
      enum: [MISSING_CHECK_IN, LATE_CHECK_IN, EARLY_CHECK_OUT, MISSING_CHECK_OUT]
    AttendanceException:
      type: object
      description: >-
        MVP-060C. One factual exception of the caller's own shift. attendanceRecordId and
        checkedInAt are null for MISSING_CHECK_IN; checkedOutAt is the recorded check-out, if any,
        at asOfInstant; varianceMinutes is present for LATE_CHECK_IN and EARLY_CHECK_OUT only.
      required:
        [
          type,
          scheduleId,
          slotId,
          attendanceRecordId,
          site,
          siteTimezone,
          start,
          end,
          startAt,
          endAt,
          overnight,
          labels,
          checkedInAt,
          checkedOutAt,
          varianceMinutes,
        ]
      properties:
        type:
          $ref: "#/components/schemas/AttendanceExceptionType"
        scheduleId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        attendanceRecordId:
          type: [string, "null"]
          format: uuid
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        siteTimezone:
          type: string
          description: The schedule's site time zone snapshot; start and end are local times there.
        start:
          type: string
        end:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
        checkedInAt:
          type: [string, "null"]
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
        varianceMinutes:
          type: [integer, "null"]
          minimum: 6
          description: >-
            Whole minutes after the start (LATE_CHECK_IN) or before the end (EARLY_CHECK_OUT),
            rounded up; null for the other types.
    AttendanceExceptionPage:
      type: object
      required: [items, nextCursor, asOfInstant]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AttendanceException"
        nextCursor:
          type: [string, "null"]
        asOfInstant:
          type: string
          format: date-time
          description: The server-owned instant of the view, the same on every page.
    TeamAttendanceException:
      type: object
      description: >-
        MVP-060C. One factual exception of a direct report's (or, for a tenant administrator, any
        employee's) shift, with the employee's minimal identity. The fields are those of
        AttendanceException.
      required:
        [
          type,
          employee,
          scheduleId,
          slotId,
          attendanceRecordId,
          site,
          siteTimezone,
          start,
          end,
          startAt,
          endAt,
          overnight,
          labels,
          checkedInAt,
          checkedOutAt,
          varianceMinutes,
        ]
      properties:
        type:
          $ref: "#/components/schemas/AttendanceExceptionType"
        employee:
          $ref: "#/components/schemas/WorkScheduleSubstitutionPerson"
        scheduleId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        attendanceRecordId:
          type: [string, "null"]
          format: uuid
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        siteTimezone:
          type: string
        start:
          type: string
        end:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
        checkedInAt:
          type: [string, "null"]
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
        varianceMinutes:
          type: [integer, "null"]
          minimum: 6
    TeamAttendanceExceptionPage:
      type: object
      required: [items, nextCursor, asOfInstant]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TeamAttendanceException"
        nextCursor:
          type: [string, "null"]
        asOfInstant:
          type: string
          format: date-time
          description: The server-owned instant of the view, the same on every page.
    GenerateOperationalSummaryRequest:
      type: object
      description: >-
        MVP-101. The only input of a briefing; any other property is rejected. The language of the
        text; it never selects different facts.
      additionalProperties: false
      required: [language]
      properties:
        language:
          type: string
          enum: [en, fr]
    OperationalSummary:
      type: object
      description: >-
        MVP-101 (ADR 0027). A grounded briefing of the operational status at one server-owned
        instant. Texts come from reviewed templates; there is no name, identifier, prompt, provider
        or model name.
      required:
        - asOfInstant
        - generatedAt
        - language
        - generationMode
        - templateVersion
        - headline
        - highlights
        - sourceSnapshot
        - limitations
      properties:
        asOfInstant:
          type: string
          format: date-time
          description: The server instant the counts describe.
        generatedAt:
          type: string
          format: date-time
        language:
          type: string
          enum: [en, fr]
        generationMode:
          type: string
          enum: [MODEL, FALLBACK]
          description: MODEL when a model planned the selection, FALLBACK when the service's deterministic policy did.
        templateVersion:
          type: string
        headline:
          $ref: "#/components/schemas/OperationalSummaryHeadline"
        highlights:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/OperationalSummaryHighlight"
        sourceSnapshot:
          $ref: "#/components/schemas/OperationalSummarySourceSnapshot"
        limitations:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/OperationalSummaryLimitation"
    OperationalSummaryHeadline:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          enum:
            - OPERATIONS_WITHIN_RANGE
            - ATTENDANCE_NEEDS_ATTENTION
            - COVERAGE_NEEDS_ATTENTION
            - APPROVALS_NEED_ATTENTION
            - SEVERAL_AREAS_NEED_ATTENTION
        text:
          type: string
    OperationalSummaryHighlight:
      type: object
      required: [factType, severity, routeId, text]
      properties:
        factType:
          type: string
          enum:
            - NOT_CHECKED_IN
            - UNCOVERED_SHIFTS
            - OVERDUE_LEAVE
            - OVERDUE_TIMESHEETS
            - LATE_CHECK_INS
            - PENDING_LEAVE
            - PENDING_TIMESHEETS
            - EXPECTED_SHIFTS
            - PRESENT_SHIFTS
            - COMPLETED_SHIFTS
            - SCHEDULED_SHIFTS
        severity:
          type: string
          enum: [NONE, LOW, MEDIUM, HIGH]
        routeId:
          type: string
          enum: [ATTENDANCE, SCHEDULES, LEAVE_APPROVALS, TIMESHEETS]
          description: Allow-listed identifier of the already-authorized source view; the web application maps it to a route.
        text:
          type: string
    OperationalSummaryLimitation:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          enum: [RECORDED_FACTS_ONLY, NO_CONCLUSION, REVIEW_SOURCES]
        text:
          type: string
    OperationalSummarySourceSnapshot:
      type: object
      description: The aggregate counts and fixed thresholds the briefing was generated from.
      required: [thresholds, shifts, coverage, approvals]
      properties:
        thresholds:
          $ref: "#/components/schemas/OperationalStatusThresholds"
        shifts:
          $ref: "#/components/schemas/OperationalStatusShifts"
        coverage:
          description: Uncovered slots; null for a manager.
          oneOf:
            - $ref: "#/components/schemas/OperationalStatusCoverage"
            - type: "null"
        approvals:
          $ref: "#/components/schemas/OperationalStatusApprovals"
    OperationalStatus:
      type: object
      description: >-
        MVP-100 (ADR 0026). Today's operational status at one server-owned instant. Shift values
        count effective assigned shift occurrences, not people.
      required: [asOfInstant, thresholds, shifts, coverage, approvals, details]
      properties:
        asOfInstant:
          type: string
          format: date-time
          description: The server-owned instant every figure describes.
        thresholds:
          $ref: "#/components/schemas/OperationalStatusThresholds"
        shifts:
          $ref: "#/components/schemas/OperationalStatusShifts"
        coverage:
          description: Uncovered slots; null for a manager (an uncovered slot has no reporting line).
          oneOf:
            - $ref: "#/components/schemas/OperationalStatusCoverage"
            - type: "null"
        approvals:
          $ref: "#/components/schemas/OperationalStatusApprovals"
        details:
          $ref: "#/components/schemas/OperationalStatusDetails"
    OperationalStatusThresholds:
      type: object
      description: The fixed rules the figures follow; shown on screen.
      required:
        [lateMinutes, notCheckedInGraceMinutes, leaveOverdueHours, timesheetOverdueHours, detailLimit]
      properties:
        lateMinutes:
          type: integer
          description: A check-in strictly more than this after the start is late.
        notCheckedInGraceMinutes:
          type: integer
          description: >-
            With no check-in, up to and including this after the start is expected; strictly more
            is not checked in.
        leaveOverdueHours:
          type: integer
          description: Pending leave strictly older than this is overdue.
        timesheetOverdueHours:
          type: integer
          description: A submitted timesheet strictly older than this is overdue.
        detailLimit:
          type: integer
          description: The most rows of any detail list.
    OperationalStatusShifts:
      type: object
      description: >-
        Effective assigned shift occurrences of today. expected + notCheckedIn + present +
        completed = scheduled (an exclusive partition); late is a subset that may overlap present
        and completed.
      required: [scheduled, expected, notCheckedIn, present, completed, late]
      properties:
        scheduled:
          type: integer
          minimum: 0
        expected:
          type: integer
          minimum: 0
        notCheckedIn:
          type: integer
          minimum: 0
        present:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        late:
          type: integer
          minimum: 0
    OperationalStatusCoverage:
      type: object
      required: [uncovered]
      properties:
        uncovered:
          type: integer
          minimum: 0
          description: Operational slots of today without an effective assignee.
    OperationalStatusWaiting:
      type: object
      description: Approvals waiting; overdue only when strictly older than the fixed threshold.
      required: [pending, overdue]
      properties:
        pending:
          type: integer
          minimum: 0
        overdue:
          type: integer
          minimum: 0
    OperationalStatusApprovals:
      type: object
      required: [leave, timesheets]
      properties:
        leave:
          $ref: "#/components/schemas/OperationalStatusWaiting"
        timesheets:
          $ref: "#/components/schemas/OperationalStatusWaiting"
    OperationalStatusShift:
      type: object
      description: A shift of today (facts of the slot only).
      required: [scheduleId, slotId, site, siteTimezone, start, end, startAt, endAt, overnight, labels]
      properties:
        scheduleId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        siteTimezone:
          type: string
        start:
          type: string
        end:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
    OperationalStatusNotCheckedIn:
      type: object
      description: A shift whose effective assignee has no check-in after the grace.
      required: [employee, shift, minutesSinceStart]
      properties:
        employee:
          $ref: "#/components/schemas/WorkScheduleSubstitutionPerson"
        shift:
          $ref: "#/components/schemas/OperationalStatusShift"
        minutesSinceStart:
          type: integer
          format: int64
          description: Whole minutes since the scheduled start.
    OperationalStatusOverdueLeave:
      type: object
      description: A manager's overdue leave request (route MANAGER).
      required: [requestId, employee, submittedAt, ageHours]
      properties:
        requestId:
          type: string
          format: uuid
        employee:
          $ref: "#/components/schemas/WorkScheduleSubstitutionPerson"
        submittedAt:
          type: string
          format: date-time
        ageHours:
          type: integer
          format: int64
    OperationalStatusOverdueTimesheet:
      type: object
      description: A manager's overdue timesheet.
      required: [timesheetId, employee, site, weekStart, submittedAt, ageHours]
      properties:
        timesheetId:
          type: string
          format: uuid
        employee:
          $ref: "#/components/schemas/WorkScheduleSubstitutionPerson"
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        weekStart:
          type: string
          format: date
        submittedAt:
          type: string
          format: date-time
        ageHours:
          type: integer
          format: int64
    OperationalStatusNotCheckedInDetails:
      type: object
      description: Shifts not checked in, oldest start first, then slot, then employee.
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OperationalStatusNotCheckedIn"
        truncated:
          type: boolean
          description: Whether more rows exist than the 20 listed.
    OperationalStatusUncoveredDetails:
      type: object
      description: Uncovered shifts, oldest start first, then slot; shift facts only.
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OperationalStatusShift"
        truncated:
          type: boolean
          description: Whether more rows exist than the 20 listed.
    OperationalStatusOverdueLeaveDetails:
      type: object
      description: Oldest submission first, then request.
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OperationalStatusOverdueLeave"
        truncated:
          type: boolean
          description: Whether more rows exist than the 20 listed.
    OperationalStatusOverdueTimesheetDetails:
      type: object
      description: Oldest submission first, then timesheet.
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OperationalStatusOverdueTimesheet"
        truncated:
          type: boolean
          description: Whether more rows exist than the 20 listed.
    OperationalStatusDetails:
      type: object
      description: >-
        Capped detail lists. A list is null where the caller has no equivalent disclosure
        authority or the notion does not exist for the scope.
      required: [notCheckedIn, uncovered, overdueLeave, overdueTimesheets]
      properties:
        notCheckedIn:
          $ref: "#/components/schemas/OperationalStatusNotCheckedInDetails"
        uncovered:
          description: Administrator only.
          oneOf:
            - $ref: "#/components/schemas/OperationalStatusUncoveredDetails"
            - type: "null"
        overdueLeave:
          description: Manager only.
          oneOf:
            - $ref: "#/components/schemas/OperationalStatusOverdueLeaveDetails"
            - type: "null"
        overdueTimesheets:
          description: Manager only.
          oneOf:
            - $ref: "#/components/schemas/OperationalStatusOverdueTimesheetDetails"
            - type: "null"
    TeamAttendanceActionPage:
      type: object
      required: [items, nextCursor, asOfInstant]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TeamAttendanceAction"
        nextCursor:
          type: [string, "null"]
        asOfInstant:
          type: string
          format: date-time
          description: The server-owned instant of the view, the same on every page.
    WorkScheduleAssignmentSource:
      type: string
      description: >-
        MVP-051. PUBLISHED: the shift is covered by the employee it was published to.
        SUBSTITUTION: an approved substitution assigned it to the caller.
      enum: [PUBLISHED, SUBSTITUTION]
    WorkScheduleSubstitutionState:
      type: string
      description: >-
        MVP-051. Derived at one server instant: PENDING (pending, not started), APPROVED,
        REJECTED, EXPIRED (still pending when the shift started) or VOIDED (the schedule was
        cancelled or replaced before a decision).
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, VOIDED]
    WorkScheduleSubstitutionReason:
      type: string
      minLength: 2
      maxLength: 500
      description: >-
        Plain text, decision-reason grammar version 1 (identical in the Core, the database and the
        web form; see DecideLeaveRequest.reason). Restricted HR; never logged, audited, sent in an
        event or echoed in an error.
    CreateWorkScheduleSubstitutionRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-051. The shift and the reason. Tenant, employee, employment, manager, substitute and
        actor are never fields. VALIDATION_FAILED fields: slotId (REQUIRED), reasonLocale, reason,
        body (UNKNOWN_PROPERTY) and Idempotency-Key; a slotId that is not a UUID is the same 404
        WORK_SCHEDULE_SHIFT_NOT_FOUND as an unknown one.
      required: [slotId, reasonLocale, reason]
      properties:
        slotId:
          type: string
          format: uuid
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          $ref: "#/components/schemas/WorkScheduleSubstitutionReason"
    DecideWorkScheduleSubstitution:
      type: object
      additionalProperties: false
      description: >-
        MVP-051. The manager's decision. substituteEmployeeId is required for APPROVED and refused
        (FORMAT) for REJECTED. The request comes from the path; tenant, manager and actor are never
        fields.
      required: [decision, reasonLocale, reason]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        substituteEmployeeId:
          type: [string, "null"]
          format: uuid
        reasonLocale:
          type: string
          enum: [en, fr]
          description: The language the reason is written in.
        reason:
          $ref: "#/components/schemas/WorkScheduleSubstitutionReason"
    WorkScheduleSubstitutionDecisionReceipt:
      type: object
      description: MVP-051. The minimal receipt of a decision; never a reason or a name.
      required: [requestId, decisionId, state, decidedAt]
      properties:
        requestId:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        state:
          type: string
          enum: [APPROVED, REJECTED]
        decidedAt:
          type: string
          format: date-time
    WorkScheduleSubstitutionShift:
      type: object
      description: MVP-051. The immutable published shift a substitution request is about.
      required:
        [scheduleId, slotId, site, siteTimezone, start, end, startAt, endAt, overnight, labels]
      properties:
        scheduleId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        siteTimezone:
          type: string
          description: The schedule's site time zone snapshot; start and end are local times there.
        start:
          type: string
        end:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
    WorkScheduleSubstitutionPerson:
      type: object
      description: MVP-051. An employee's current minimal directory identity.
      required: [id, employeeNumber, givenNames, familyName]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
    MyWorkScheduleSubstitutionDecision:
      type: object
      description: >-
        MVP-051. The decision of one of the caller's requests: never the deciding manager. The
        substitute is present for an approval only.
      required: [outcome, decidedAt, reasonLocale, reason, substitute]
      properties:
        outcome:
          type: string
          enum: [APPROVED, REJECTED]
        decidedAt:
          type: string
          format: date-time
        reasonLocale:
          type: string
          enum: [en, fr]
        reason:
          type: string
        substitute:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleSubstitutionPerson"
            - type: "null"
    MyWorkScheduleSubstitution:
      type: object
      description: MVP-051. One of the caller's substitution requests.
      required: [id, requestedAt, state, shift, reasonLocale, reason, decision]
      properties:
        id:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/WorkScheduleSubstitutionState"
        shift:
          $ref: "#/components/schemas/WorkScheduleSubstitutionShift"
        reasonLocale:
          type: string
          enum: [en, fr]
        reason:
          type: string
        decision:
          oneOf:
            - $ref: "#/components/schemas/MyWorkScheduleSubstitutionDecision"
            - type: "null"
    MyWorkScheduleSubstitutionPage:
      type: object
      required: [items, nextCursor, asOfInstant]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyWorkScheduleSubstitution"
        nextCursor:
          type: [string, "null"]
        asOfInstant:
          type: string
          format: date-time
          description: The server instant every state of the view is derived at (pinned in the cursor).
    WorkScheduleSubstitutionApprovalEmployee:
      type: object
      description: MVP-051. The requesting employee's number and current name; never their ID.
      required: [employeeNumber, givenNames, familyName]
      properties:
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
    WorkScheduleSubstitutionApproval:
      type: object
      description: MVP-051. A pending request routed to the caller; only what deciding requires.
      required: [id, requestedAt, employee, reasonLocale, reason, shift]
      properties:
        id:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        employee:
          $ref: "#/components/schemas/WorkScheduleSubstitutionApprovalEmployee"
        reasonLocale:
          type: string
          enum: [en, fr]
        reason:
          type: string
        shift:
          $ref: "#/components/schemas/WorkScheduleSubstitutionShift"
    WorkScheduleSubstitutionApprovalPage:
      type: object
      required: [items, nextCursor, asOfInstant]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkScheduleSubstitutionApproval"
        nextCursor:
          type: [string, "null"]
        asOfInstant:
          type: string
          format: date-time
          description: The server instant shifts must start after (pinned in the cursor).
    WorkScheduleSubstitutionCandidatePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/WorkScheduleSubstitutionPerson"
        nextCursor:
          type: [string, "null"]
    WorkScheduleSlotSubstitution:
      type: object
      description: >-
        MVP-051. The approved substitution of a slot (administrators only): identifiers and
        instant, never a reason, the requester's reason or the deciding manager.
      required: [requestId, decisionId, approvedAt]
      properties:
        requestId:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        approvedAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 problem details with DivalHR extensions.
      required: [type, title, status, code, params, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        params:
          type: object
          description: Safe interpolation parameters. Never contains personal data.
          additionalProperties: true
        correlationId:
          type: string
