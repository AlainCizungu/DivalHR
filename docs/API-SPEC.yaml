      x-divalhr-scope: tenant
      x-divalhr-required-role: tenant-admin
      x-divalhr-required-assurance: mfa
      summary: Preview the lock of one site's generated week
      description: >-
        MVP-071. Evaluates whether the legal entity's site and generated week can be locked as
