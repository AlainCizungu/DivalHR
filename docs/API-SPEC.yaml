  /me/leave-requests:
    get:
      operationId: listMyLeaveRequests
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: List my leave requests
      description: >-
        MVP-041A to MVP-041E. The caller's own leave requests, newest first (submittedAt, then id),
        each with its current state and, once decided, its decision (outcome, reason in the
        language it was written in, time; never who decided or under which authority, an
        administrator's routing-exception override included), or, once cancelled, its cancellation
        (reason in the language it was written in, time; never the cancelling subject), or, once
        amended, its amendment (the replacement's ID, the reason in the language it was written in,
        time; never the amending subject). A replacement carries the ID of the request it replaced
        (amendedFromRequestId), so a chain can be followed both ways. Only the
        employee of the caller's current active employee-access link (403 EMPLOYEE_LINK_REQUIRED
        otherwise). Recorded as a fail-closed disclosure (audit leave-request.self-list): if the
        audit record cannot be written, nothing is returned. The signed cursor is bound to the
        operation, tenant, caller and page size. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LeavePolicyLimit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLeaveRequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createMyLeaveRequest
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Submit a leave request
      description: >-
        MVP-041A. Submits a PENDING leave request for the caller's own employee (never a request
        field). The server checks, on the organization's business date: startDate not before it,
        endDate not before startDate, at most 366 calendar days; one version of the policy covering
        the whole interval (409 LEAVE_POLICY_NOT_REQUESTABLE otherwise, with no params, for unknown,
        foreign, ended or non-covering policies alike); one employment covering the whole interval
        and the policy's minimum service in calendar days (409 LEAVE_REQUEST_NOT_ELIGIBLE with
        params.reason EMPLOYMENT_PERIOD or MINIMUM_SERVICE); no overlapping pending request (409
        LEAVE_REQUEST_OVERLAP). The amount is the employee's own, in the policy's unit; no balance,
        working day, holiday or payroll amount is calculated. Errors never echo a submitted value.
        The business-date and eligibility checks apply to a new request only: an exact retry (same
        Idempotency-Key and body) returns the stored 201 with Idempotent-Replayed true, even after
        its first day has passed, while the caller is still linked to the same employee; with no
        active link it is 403 EMPLOYEE_LINK_REQUIRED, and linked to another employee it is 409
