        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        firstDate:
          type: string
          format: date
        lastDate:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/WorkSchedulePreviewSlot"
        totals:
          $ref: "#/components/schemas/WorkScheduleTotals"
        warnings:
          type: array
          items:
            type: string
            enum: [UNCOVERED_SLOTS]
        publishable:
          type: boolean
        previewDigest:
          type: string
    WorkSchedulePublicationReceipt:
      type: object
      description: MVP-050A. The receipt of a publication; never a label or employee.
      required: [scheduleId, publishedAt, totals]
      properties:
        scheduleId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        totals:
          $ref: "#/components/schemas/WorkScheduleTotals"
    WorkScheduleSummary:
      type: object
      required:
        - id
        - site
        - firstDate
        - lastDate
        - siteTimezone
        - totals
        - publishedAt
        - status
        - changedAt
        - changeReason
        - replacesScheduleId
        - replacedByScheduleId
      properties:
        id:
          type: string
          format: uuid
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        firstDate:
          type: string
          format: date
        lastDate:
          type: string
          format: date
        siteTimezone:
          type: string
          description: The site time zone snapshot stored at publication, the clock of every slot.
        totals:
          $ref: "#/components/schemas/WorkScheduleTotals"
        publishedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/WorkScheduleStatus"
        changedAt:
          type: [string, "null"]
          format: date-time
          description: The cancellation or replacement instant (MVP-050B).
        changeReason:
          type: [string, "null"]
          description: The cancellation or replacement reason (Restricted HR; administrators only).
        replacesScheduleId:
          type: [string, "null"]
          format: uuid
        replacedByScheduleId:
          type: [string, "null"]
          format: uuid
    WorkSchedulePage:
      type: object
      required: [items, nextCursor, asOf]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkScheduleSummary"
        nextCursor:
          type: [string, "null"]
        asOf:
          type: string
          format: date
          description: >-
            The organization's business date (informational; each schedule's clock is its
            siteTimezone).
    WorkScheduleSlot:
      type: object
      description: >-
        employee is the immutable published assignee. MVP-051: effectiveEmployee is the employee
        of the slot's current operational coverage (the published assignee, or the approved
        substitute; null for an uncovered slot and for every slot of a cancelled or replaced
        schedule, whose coverage was released), and substitution the slot's approved
        substitution, if any.
      required:
        [id, position, start, end, startAt, endAt, overnight, labels, employee, effectiveEmployee, substitution]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        start:
          type: string
        end:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
        employee:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleEmployee"
            - type: "null"
        effectiveEmployee:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleEmployee"
            - type: "null"
        substitution:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleSlotSubstitution"
            - type: "null"
    WorkScheduleDetail:
      type: object
      required:
        - id
        - site
        - firstDate
        - lastDate
        - siteTimezone
        - totals
        - publishedAt
        - status
        - changedAt
        - changeReason
        - replacesScheduleId
        - replacedByScheduleId
        - slots
      properties:
        id:
          type: string
          format: uuid
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        firstDate:
          type: string
          format: date
        lastDate:
          type: string
          format: date
        siteTimezone:
          type: string
          description: The site time zone snapshot stored at publication, the clock of every slot.
        totals:
          $ref: "#/components/schemas/WorkScheduleTotals"
        publishedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/WorkScheduleStatus"
        changedAt:
          type: [string, "null"]
          format: date-time
          description: The cancellation or replacement instant (MVP-050B).
        changeReason:
          type: [string, "null"]
          description: The cancellation or replacement reason (Restricted HR; administrators only).
        replacesScheduleId:
          type: [string, "null"]
          format: uuid
        replacedByScheduleId:
          type: [string, "null"]
          format: uuid
        slots:
          type: array
          items:
            $ref: "#/components/schemas/WorkScheduleSlot"
    MyWorkShift:
      type: object
      description: >-
        MVP-050A. One of the caller's own shifts, read from the operational coverage (MVP-051):
        assignmentSource tells a published shift from one assigned by an approved substitution;
        the original employee is never named. MVP-060A: attendance is the caller's own attendance
        on the shift at the page's server instant.
      required:
        [id, scheduleId, site, start, end, siteTimezone, overnight, labels, assignmentSource, attendance]
      properties:
        id:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        start:
          type: string
        end:
          type: string
        siteTimezone:
          type: string
          description: >-
            The site time zone snapshot of this shift's schedule; start and end are local times
            there, never converted to another zone.
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
        assignmentSource:
          $ref: "#/components/schemas/WorkScheduleAssignmentSource"
        attendance:
          $ref: "#/components/schemas/MyWorkShiftAttendance"
    MyWorkSchedulePage:
      type: object
      required: [items, nextCursor, asOfInstant, from, to]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyWorkShift"
        nextCursor:
          type: [string, "null"]
        asOfInstant:
          type: [string, "null"]
          format: date-time
          description: >-
            The default view's server-owned instant (shifts ending after it), the same on every
            page of the view; null for a view with explicit dates.
        from:
          type: [string, "null"]
          format: date
          description: First local start date of an explicit view; null for the default view.
        to:
          type: [string, "null"]
          format: date
    MyWorkShiftAttendance:
      type: object
      description: >-
        MVP-060A. The caller's attendance on one of their shifts, evaluated at the page's server
        instant (asOfInstant, or the server's current instant for a view with explicit dates).
        checkInAvailable is true only while NOT_RECORDED and inside the check-in window;
        checkOutAvailable only while OPEN and inside the check-out window. Never a subject, an
        employment or an evidence field.
      required:
        [
          status,
          attendanceRecordId,
          checkedInAt,
          checkedOutAt,
          checkInAvailable,
          checkOutAvailable,
          checkInRecordingMethod,
          checkInSupervisorReasonLocale,
          checkInSupervisorReason,
          checkOutRecordingMethod,
          checkOutSupervisorReasonLocale,
          checkOutSupervisorReason,
          correctedAt,
        ]
      properties:
        status:
          $ref: "#/components/schemas/WorkShiftAttendanceStatus"
        attendanceRecordId:
          type: [string, "null"]
          format: uuid
        checkedInAt:
          type: [string, "null"]
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
        checkInAvailable:
          type: boolean
        checkOutAvailable:
          type: boolean
        checkInRecordingMethod:
          description: MVP-060B. How the check-in was recorded; null when not recorded.
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecordingMethod"
            - type: "null"
        checkInSupervisorReasonLocale:
          type: [string, "null"]
          enum: [en, fr, null]
          description: MVP-060B. The language of a supervisor's check-in reason; null otherwise.
        checkInSupervisorReason:
          type: [string, "null"]
          description: >-
            MVP-060B. A supervisor's check-in reason exactly as submitted; null for a SELF
            check-in. Never the supervisor's identity.
        checkOutRecordingMethod:
          description: MVP-060B. How the check-out was recorded; null when not checked out.
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecordingMethod"
            - type: "null"
        checkOutSupervisorReasonLocale:
          type: [string, "null"]
          enum: [en, fr, null]
          description: MVP-060B. The language of a supervisor's check-out reason; null otherwise.
        checkOutSupervisorReason:
          type: [string, "null"]
          description: >-
            MVP-060B. A supervisor's check-out reason exactly as submitted; null otherwise. Never
            the supervisor's identity.
        correctedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            MVP-062. When the organization last corrected the record; null when uncorrected. The
            times shown are then the corrected effective times. Never who corrected it, why, or
            the explanation.
    WorkShiftAttendanceStatus:
      type: string
      description: >-
        MVP-060A. NOT_RECORDED: no check-in yet. OPEN: checked in, not checked out. COMPLETED:
        checked in and out.
      enum: [NOT_RECORDED, OPEN, COMPLETED]
    AttendanceStatus:
      type: string
      description: MVP-060A. OPEN (checked in only) or COMPLETED (checked in and out).
      enum: [OPEN, COMPLETED]
    CheckInAttendanceRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-060A. The slot only. Tenant, employee, employment, schedule, instant and actor are
        never fields. VALIDATION_FAILED fields: slotId (REQUIRED), body (UNKNOWN_PROPERTY) and
        Idempotency-Key; a slotId that is not a UUID is the same 404 ATTENDANCE_SHIFT_NOT_FOUND
        as an unknown one.
      required: [slotId]
      properties:
        slotId:
          type: string
          format: uuid
    AttendanceReceipt:
      type: object
      description: >-
        MVP-060A. The minimal receipt of a check-in (OPEN, checkedOutAt null) or a check-out
        (COMPLETED); instants are the server's.
      required: [attendanceRecordId, slotId, status, checkedInAt, checkedOutAt]
      properties:
        attendanceRecordId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
    AttendanceShift:
      type: object
      description: MVP-060A. The immutable published shift an attendance record is about.
      required:
        [scheduleId, slotId, site, siteTimezone, start, end, startAt, endAt, overnight, labels]
      properties:
        scheduleId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        site:
          $ref: "#/components/schemas/WorkScheduleSite"
        siteTimezone:
          type: string
          description: The schedule's site time zone snapshot; start and end are local times there.
        start:
          type: string
        end:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
    MyAttendanceRecord:
      type: object
      description: >-
        MVP-060A. One of the caller's own attendance records. MVP-060B: how each event was
        recorded and, for a supervisor-assisted event, the supervisor's reason exactly as
        submitted; never the supervisor's identity.
      required:
        [
          id,
          status,
          checkedInAt,
          checkedOutAt,
          checkOutAvailable,
          shift,
          checkInRecordingMethod,
          checkInSupervisorReasonLocale,
          checkInSupervisorReason,
          checkOutRecordingMethod,
          checkOutSupervisorReasonLocale,
          checkOutSupervisorReason,
          correctedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
        checkOutAvailable:
          type: boolean
          description: True only while OPEN and inside the check-out window at asOfInstant.
        shift:
          $ref: "#/components/schemas/AttendanceShift"
        checkInRecordingMethod:
          description: >-
            How the original check-in was recorded; null for a record created by the
            organization's correction (MVP-062).
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecordingMethod"
            - type: "null"
        checkInSupervisorReasonLocale:
          type: [string, "null"]
          enum: [en, fr, null]
          description: MVP-060B. The language of a supervisor's check-in reason; null otherwise.
        checkInSupervisorReason:
          type: [string, "null"]
          description: >-
            MVP-060B. A supervisor's check-in reason exactly as submitted; null for a SELF
            check-in. Never the supervisor's identity.
        checkOutRecordingMethod:
          description: MVP-060B. How the check-out was recorded; null when not checked out.
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecordingMethod"
            - type: "null"
        checkOutSupervisorReasonLocale:
          type: [string, "null"]
          enum: [en, fr, null]
          description: MVP-060B. The language of a supervisor's check-out reason; null otherwise.
        checkOutSupervisorReason:
          type: [string, "null"]
          description: >-
            MVP-060B. A supervisor's check-out reason exactly as submitted; null otherwise. Never
            the supervisor's identity.
        correctedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            MVP-062. When the organization last corrected the record; null when uncorrected. The
            times shown are then the corrected effective times. Never who corrected it, why, or
            the explanation.
    AttendanceCorrectionOperation:
      type: string
      description: >-
        MVP-062. CREATE_MISSING_RECORD: the missing record of a slot's effective assignee is
        created by the correction. REPLACE_TIMES: an existing record's effective check-in and
        optional check-out are replaced.
      enum: [CREATE_MISSING_RECORD, REPLACE_TIMES]
    AttendanceCorrectionReason:
      type: string
      description: MVP-062. The closed reason code of a correction.
      enum:
        [
          DEVICE_OR_CONNECTIVITY,
          SUPERVISOR_OR_EMPLOYEE_REPORT,
          DATA_ENTRY_ERROR,
          SYSTEM_ERROR,
          OTHER,
        ]
    AttendanceCorrectionWarning:
      type: string
      description: >-
        MVP-062. Neutral factual warnings of a preview. CHECK_OUT_REMOVED: the current check-out is
        removed. NO_CHECK_OUT: the corrected record has no check-out. SCHEDULE_NOT_OPERATIONAL: the
        record's schedule was cancelled or replaced. ORIGINAL_EVENTS_KEPT: the original events stay
        unchanged and the record shows the corrected values. APPROVED_TIME_MAY_REOPEN (MVP-070D):
        approved time covers the shift; a correction that changes it reopens the timesheet for
        the organization's refresh and a new approval (this fact is part of the preview digest).
      enum: [CHECK_OUT_REMOVED, NO_CHECK_OUT, SCHEDULE_NOT_OPERATIONAL, ORIGINAL_EVENTS_KEPT, APPROVED_TIME_MAY_REOPEN]
    AttendanceCorrectionRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-062. The complete new effective values of a record (REPLACE_TIMES), the reason and the
        explanation. Tenant, actor, employee, employment, schedule and slot are never fields.
        VALIDATION_FAILED fields: checkedInAt (REQUIRED, FORMAT, RANGE), checkedOutAt (FORMAT,
        RANGE), reasonCode (REQUIRED, FORMAT), explanation (REQUIRED, LENGTH, FORMAT), body
        (UNKNOWN_PROPERTY).
      required: [checkedInAt, reasonCode, explanation]
      properties:
        checkedInAt:
          type: string
          format: date-time
          description: RFC 3339 with an explicit offset; at most six fractional digits.
        checkedOutAt:
          type: [string, "null"]
          format: date-time
          description: The corrected check-out, or null or absent for none.
        reasonCode:
          $ref: "#/components/schemas/AttendanceCorrectionReason"
        explanation:
          type: string
          minLength: 10
          maxLength: 500
          description: >-
            Restricted HR/Operations. Trimmed; 10 to 500 characters; no control or format
            character, markup or link. Shown to tenant administrators only.
    MissingAttendanceCorrectionRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-062. A missing record's creation (CREATE_MISSING_RECORD): the slot, its effective
        assignee as reviewed, the corrected check-in and optional check-out, the reason and the
        explanation. VALIDATION_FAILED fields as a record correction, plus slotId and employeeId
        (REQUIRED); a malformed slotId or employeeId is the same 404
        ATTENDANCE_CORRECTION_TARGET_NOT_FOUND as an unknown one.
      required: [slotId, employeeId, checkedInAt, reasonCode, explanation]
      properties:
        slotId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
        reasonCode:
          $ref: "#/components/schemas/AttendanceCorrectionReason"
        explanation:
          type: string
          minLength: 10
          maxLength: 500
    CommitAttendanceCorrectionRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-062. The commit of a previewed record correction: the identical proposal, the
        previewed targetVersion, its previewDigest and confirm true.
      required: [checkedInAt, reasonCode, explanation, targetVersion, previewDigest, confirm]
      properties:
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
        reasonCode:
          $ref: "#/components/schemas/AttendanceCorrectionReason"
        explanation:
          type: string
          minLength: 10
          maxLength: 500
        targetVersion:
          type: integer
          minimum: 0
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirm:
          type: boolean
          enum: [true]
    CommitMissingAttendanceCorrectionRequest:
      type: object
      additionalProperties: false
      description: >-
        MVP-062. The commit of a previewed missing record's creation: the identical proposal,
        targetVersion 0, the previewDigest and confirm true.
      required:
        [slotId, employeeId, checkedInAt, reasonCode, explanation, targetVersion, previewDigest, confirm]
      properties:
        slotId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
        reasonCode:
          $ref: "#/components/schemas/AttendanceCorrectionReason"
        explanation:
          type: string
          minLength: 10
          maxLength: 500
        targetVersion:
          type: integer
          minimum: 0
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirm:
          type: boolean
          enum: [true]
    AttendanceCorrectionTimes:
      type: object
      description: MVP-062. A check-in and an optional check-out.
      required: [checkedInAt, checkedOutAt]
      properties:
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
    AttendanceCorrectionBoundaries:
      type: object
      description: >-
        MVP-062. The immutable boundaries: a check-in from checkInOpensAt (inclusive) to
        checkInClosesAt (the scheduled end, exclusive); a check-out no later than checkOutUntil.
      required: [checkInOpensAt, checkInClosesAt, checkOutUntil]
      properties:
        checkInOpensAt:
          type: string
          format: date-time
        checkInClosesAt:
          type: string
          format: date-time
        checkOutUntil:
          type: string
          format: date-time
    CorrectedAttendanceRecord:
      type: object
      description: MVP-062. A record's current effective values.
      required:
        [attendanceRecordId, slotId, status, checkedInAt, checkedOutAt, correctionVersion, correctedAt]
      properties:
        attendanceRecordId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: [string, "null"]
          format: date-time
        correctionVersion:
          type: integer
          minimum: 0
        correctedAt:
          type: [string, "null"]
          format: date-time
    AttendanceCorrectionPreview:
      type: object
      description: >-
        MVP-062. A correction's preview. Restricted HR/Operations, tenant administrators only:
        the explanation is echoed as it will be stored.
      required:
        [
          operation,
          attendanceRecordId,
          targetVersion,
          employee,
          shift,
          boundaries,
          before,
          after,
          reasonCode,
          explanation,
          exceptionsBefore,
          exceptionsAfter,
          warnings,
          previewedAt,
          previewDigest,
        ]
      properties:
        operation:
          $ref: "#/components/schemas/AttendanceCorrectionOperation"
        attendanceRecordId:
          type: [string, "null"]
          format: uuid
        targetVersion:
          type: integer
          minimum: 0
        employee:
          $ref: "#/components/schemas/WorkScheduleSubstitutionPerson"
        shift:
          $ref: "#/components/schemas/AttendanceShift"
        boundaries:
          $ref: "#/components/schemas/AttendanceCorrectionBoundaries"
        before:
          oneOf:
            - $ref: "#/components/schemas/AttendanceCorrectionTimes"
            - type: "null"
        after:
          $ref: "#/components/schemas/AttendanceCorrectionTimes"
        reasonCode:
          $ref: "#/components/schemas/AttendanceCorrectionReason"
        explanation:
          type: string
        exceptionsBefore:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceExceptionType"
        exceptionsAfter:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceExceptionType"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceCorrectionWarning"
        previewedAt:
          type: string
          format: date-time
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
    TimesheetPeriodRequest:
      type: object
      description: MVP-070A. One site and its site-local week.
      additionalProperties: false
      required: [siteId, weekStart]
      properties:
        siteId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
          description: The site-local Monday of the current week or an earlier one.
    GenerateTimesheetsRequest:
      type: object
      description: MVP-070A. Generate the week's drafts of one site.
      additionalProperties: false
      required: [siteId, weekStart, confirm]
      properties:
        siteId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        confirm:
          type: boolean
          enum: [true]
    RefreshTimesheetsRequest:
      type: object
      description: MVP-070A. Commit a previewed refresh with the identical site and week.
      additionalProperties: false
      required: [siteId, weekStart, version, previewDigest, confirm]
      properties:
        siteId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        version:
          type: integer
          minimum: 1
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirm:
          type: boolean
          enum: [true]
    TimesheetExportPreviewRequest:
      type: object
      description: MVP-070E. One legal entity, one of its sites and one generated site-local week.
      additionalProperties: false
      required: [legalEntityId, siteId, weekStart]
      properties:
        legalEntityId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
          description: The site-local Monday of a generated week.
    CreateTimesheetExportRequest:
      type: object
      description: MVP-070E. Create the export of a reviewed preview.
      additionalProperties: false
      required: [legalEntityId, siteId, weekStart, previewDigest, confirm]
      properties:
        legalEntityId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The reviewed preview's digest, exactly as returned.
        confirm:
          type: boolean
          const: true
    TimesheetExportScope:
      type: object
      description: >-
        MVP-070E. The exported scope: the legal entity, its site and the generated week with its
        time zone and exact UTC boundaries as generated.
      required: [legalEntityId, legalEntityCode, legalEntityName, siteId, siteCode, siteName, timezone, weekStart, weekEnd, lastDay, periodStartAt, periodEndAt]
      properties:
        legalEntityId:
          type: string
          format: uuid
        legalEntityCode:
          type: [string, "null"]
        legalEntityName:
          type: [string, "null"]
        siteId:
          type: string
          format: uuid
        siteCode:
          type: [string, "null"]
        siteName:
          type: [string, "null"]
        timezone:
          type: string
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
          description: The next local Monday (exclusive).
        lastDay:
          type: string
          format: date
        periodStartAt:
          type: string
          format: date-time
        periodEndAt:
          type: string
          format: date-time
    TimesheetExportCounts:
      type: object
      description: MVP-070E. Approved timesheets, employees, rows and the total worked minutes.
      required: [timesheets, employees, rows, workedMinutes]
      properties:
        timesheets:
          type: integer
          minimum: 0
        employees:
          type: integer
          minimum: 0
        rows:
          type: integer
          minimum: 0
        workedMinutes:
          type: integer
          minimum: 0
    TimesheetExportExclusions:
      type: object
      description: MVP-070E. The week's timesheets that are not exported, by state.
      required: [draft, submitted, reopened]
      properties:
        draft:
          type: integer
          minimum: 0
        submitted:
          type: integer
          minimum: 0
        reopened:
          type: integer
          minimum: 0
    TimesheetExportPreview:
      type: object
      description: MVP-070E. What an export of the scope would hold now; no name or employee number.
      required: [scope, generationId, generationVersion, eligible, excluded, previewDigest, expiresAt, existingExportId]
      properties:
        scope:
          $ref: "#/components/schemas/TimesheetExportScope"
        generationId:
          type: string
          format: uuid
        generationVersion:
          type: integer
          minimum: 1
        eligible:
          $ref: "#/components/schemas/TimesheetExportCounts"
        excluded:
          $ref: "#/components/schemas/TimesheetExportExclusions"
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        expiresAt:
          type: string
          format: date-time
        existingExportId:
          type: [string, "null"]
          format: uuid
          description: The export of identical evidence, if one exists (creating returns it).
    TimesheetExport:
      type: object
      description: >-
        MVP-070E. An immutable export: the manifest's facts. Never the creator, a name or an
        employee number.
      required: [exportId, status, schemaVersion, scope, generationId, generationVersion, counts, csvSha256, createdAt]
      properties:
        exportId:
          type: string
          format: uuid
        status:
          type: string
          enum: [READY]
        schemaVersion:
          type: integer
          enum: [1]
        scope:
          $ref: "#/components/schemas/TimesheetExportScope"
        generationId:
          type: string
          format: uuid
        generationVersion:
          type: integer
          minimum: 1
        counts:
          $ref: "#/components/schemas/TimesheetExportCounts"
        csvSha256:
