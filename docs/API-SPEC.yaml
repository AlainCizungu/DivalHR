        current APPROVED revision, action and cycle), the audit record (timesheet-export.create) and
        the outbox event (people.timesheet-export.created.v1); a failure of any of them writes
        nothing. Exports are never edited, replaced, voided or deleted; later corrections and
        reopenings affect only future exports. Idempotent (an identical replay returns the
        original; a changed payload with the same key is 409 IDEMPOTENCY_KEY_REUSED). Shares the
        work-schedule-write limits. Cache-Control private, no-store.
