    WhatsAppNotificationType:
      type: string
      description: MVP-111. The closed notification catalogue. CONNECTOR_TEST is the administrator's test message and is never selectable by a recipient.
      enum: [LEAVE_DECISION, TIMESHEET_APPROVED, ATTENDANCE_CORRECTED, PAYROLL_INPUT_LOCKED, PAYROLL_EXPORT_READY, CONNECTOR_TEST]
    WhatsAppSelectableNotificationType:
      type: string
      description: MVP-111. The notification types a recipient can choose.
      enum: [LEAVE_DECISION, TIMESHEET_APPROVED, ATTENDANCE_CORRECTED, PAYROLL_INPUT_LOCKED, PAYROLL_EXPORT_READY]
    WhatsAppLanguage:
      type: string
      enum: [en, fr]
    WhatsAppConsentSource:
      type: string
      description: MVP-111. Where the recipient's opt-in was given, recorded as attested by the administrator.
      enum: [WRITTEN, WEB_FORM, VERBAL_RECORDED_OUTSIDE_DIVALHR, OTHER_DOCUMENTED]
    WhatsAppTemplateRequest:
      type: object
      description: MVP-111. One pre-approved Meta template for a notification type and language.
      additionalProperties: false
      required: [notificationType, language, templateName]
      properties:
        notificationType:
          $ref: "#/components/schemas/WhatsAppNotificationType"
        language:
          $ref: "#/components/schemas/WhatsAppLanguage"
        templateName:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,511}$"
    CreateWhatsAppConnectorRequest:
      type: object
      description: MVP-111. Connect the tenant's WhatsApp Business connector. The token is write-only.
      additionalProperties: false
      required: [wabaId, phoneNumberId, displayNumber, accessToken, templates, confirm]
      properties:
        wabaId:
          type: string
          pattern: "^[0-9]{5,20}$"
        phoneNumberId:
          type: string
          pattern: "^[0-9]{5,20}$"
        displayNumber:
          type: string
          pattern: "^\\+[1-9][0-9]{6,14}$"
        accessToken:
          type: string
          minLength: 20
          maxLength: 1024
          writeOnly: true
        templates:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/WhatsAppTemplateRequest"
        confirm:
          type: boolean
          const: true
    UpdateWhatsAppConnectorRequest:
      type: object
      description: MVP-111. Change the connector's identifiers or templates (returns it to DRAFT).
      additionalProperties: false
      required: [configVersion, wabaId, phoneNumberId, displayNumber, templates, confirm]
      properties:
        configVersion:
          type: integer
          format: int32
          minimum: 1
        wabaId:
          type: string
          pattern: "^[0-9]{5,20}$"
        phoneNumberId:
          type: string
          pattern: "^[0-9]{5,20}$"
        displayNumber:
          type: string
          pattern: "^\\+[1-9][0-9]{6,14}$"
        templates:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/WhatsAppTemplateRequest"
        confirm:
          type: boolean
          const: true
    WhatsAppConnectorCommandRequest:
      type: object
      description: MVP-111. Verify, disable or enable the connector.
      additionalProperties: false
      required: [configVersion, confirm]
      properties:
        configVersion:
          type: integer
          format: int32
          minimum: 1
        confirm:
          type: boolean
          const: true
    RotateWhatsAppTokenRequest:
      type: object
      description: MVP-111. Replace the access token. The token is write-only.
      additionalProperties: false
      required: [configVersion, accessToken, confirm]
      properties:
        configVersion:
          type: integer
          format: int32
          minimum: 1
        accessToken:
          type: string
          minLength: 20
          maxLength: 1024
          writeOnly: true
        confirm:
          type: boolean
          const: true
    WhatsAppConsentRequest:
      type: object
      description: MVP-111. The administrator's attestation that the recipient opted in.
      additionalProperties: false
      required: [source, confirmedAt, attested]
      properties:
        source:
          $ref: "#/components/schemas/WhatsAppConsentSource"
        confirmedAt:
          type: string
          format: date-time
        attested:
          type: boolean
          const: true
    CreateWhatsAppRecipientRequest:
      type: object
      description: MVP-111. Register an opted-in recipient. The number is write-only.
      additionalProperties: false
      required: [label, phoneNumber, language, notificationTypes, consent, confirm]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed plain text, no markup or URL.
        phoneNumber:
          type: string
          pattern: "^\\+[1-9][0-9]{6,14}$"
          writeOnly: true
        language:
          $ref: "#/components/schemas/WhatsAppLanguage"
        notificationTypes:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WhatsAppSelectableNotificationType"
        consent:
          $ref: "#/components/schemas/WhatsAppConsentRequest"
        confirm:
          type: boolean
          const: true
