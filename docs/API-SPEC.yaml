      summary: Approve or reject a leave request as its manager
      description: >-
        MVP-041B. Moves a PENDING MANAGER-routed request of one of the caller's reports (as listed
        by listMyLeaveApprovals) to APPROVED or REJECTED, once, with its reason, in one transaction
        with the decision record, the audit record and the outbox event. The relationship is
        checked again on the first execution and on every replay: no active link is 403
        EMPLOYEE_LINK_REQUIRED; unknown, foreign-tenant, TENANT_ADMIN-routed and non-report requests
