  /public/invitations/inspect:
    post:
      operationId: inspectInvitation
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: public
      summary: Inspect an invitation by its token (anonymous)
      description: >-
        The token travels only in this body, never in a URL. A usable invitation returns its role,
        locale and expiry, and nothing about the organization, tenant or any account. An unknown,
        malformed, expired, revoked or accepted token returns the same 404 INVITATION_INVALID.
        Access tokens are neither required nor read. Responses are Cache-Control no-store.
        Requests are rate limited per client (429 RATE_LIMITED with Retry-After); production
        deployments must also limit these paths at the ingress or WAF.
      tags: [identity]
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: The invitation can be accepted
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/InvitationInvalid"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /public/invitations/accept:
    post:
      operationId: acceptInvitation
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: public
      summary: Accept an invitation by its token (anonymous)
      description: >-
        Creates the invitee's identity in the identity provider with the invitation's tenant and
        role, records the tenant membership, consumes the token and asks the identity provider to
        email a link to choose a password. The email address is marked verified only because
        possessing this single-use token proves control of the mailbox. No person or employee
        record is created. 404 INVITATION_INVALID covers every unusable token. 409
        INVITATION_CANNOT_BE_ACCEPTED (no params, no reason) is returned when the address already
        has a DivalHR identity; the invitation stays pending. 409
        INVITATION_ACCEPTANCE_IN_PROGRESS and 503 IDENTITY_PROVIDER_UNAVAILABLE are retryable with
        the same token. Responses are Cache-Control no-store and rate limited like inspection.
      tags: [identity]
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: The invitation was accepted
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAcceptance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/InvitationInvalid"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /employees:
