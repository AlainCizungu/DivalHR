        exports stay as they are; APPROVALS_UNCHANGED: unlocking alone changes no timesheet), a
        preview digest bound to the current lock, the reason and the explanation's digest, and its
        expiry. Writes nothing but its fail-closed disclosure audit (timesheet-period.unlock-preview).
        Shares the work-schedule-write limit. Cache-Control private, no-store.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
