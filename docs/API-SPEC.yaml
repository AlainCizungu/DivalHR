          pattern: "^[A-Z0-9_-]{2,20}$"
        name:
          type: string
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
        createdAt:
          type: string
          format: date-time
    CostCenterPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CostCenter"
        nextCursor:
          type: string
    CreateTeam:
      type: object
      additionalProperties: false
      description: >-
        Exactly one parent: departmentId or costCenterId. An absent property and an explicit null
        both mean "not supplied". Neither supplied returns 400 TEAM_PARENT_REQUIRED and both
        supplied returns 400 TEAM_PARENT_AMBIGUOUS; a malformed supplied id returns 400
        VALIDATION_FAILED first. The site, tenant and every server-owned field (siteId, tenantId,
        organizationId, legalEntityId, regionId, id, createdBy) are rejected.
      required: [code, name, effectiveFrom]
      properties:
        departmentId:
          type: [string, "null"]
          format: uuid
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        costCenterId:
          type: [string, "null"]
          format: uuid
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        code:
          type: string
          description: Trimmed and upper-cased; 2-20 of A-Z, 0-9, hyphen and underscore.
          pattern: "^\\s*[A-Za-z0-9_-]{2,20}\\s*$"
        name:
          type: string
          minLength: 2
          maxLength: 160
        effectiveFrom:
          type: string
          format: date
          description: Inclusive, between 1900-01-01 and 2999-12-31.
        effectiveTo:
          type: [string, "null"]
          format: date
          description: Inclusive and not earlier than effectiveFrom; omit or null for open-ended.
      oneOf:
        - title: DepartmentParent
          description: A team beneath a department; costCenterId is absent or null.
          required: [departmentId]
          properties:
            departmentId:
              type: string
              format: uuid
              pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
            costCenterId:
              type: "null"
        - title: CostCenterParent
          description: A team beneath a cost center; departmentId is absent or null.
          required: [costCenterId]
          properties:
            costCenterId:
              type: string
              format: uuid
              pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
            departmentId:
              type: "null"
    Team:
      type: object
      description: >-
        A team. departmentId and costCenterId are both always present; exactly one is non-null.
        siteId is derived from the parent.
      required:
        [id, siteId, departmentId, costCenterId, code, name, effectiveFrom, effectiveTo, createdAt]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        departmentId:
          type: [string, "null"]
          format: uuid
        costCenterId:
          type: [string, "null"]
          format: uuid
        code:
          type: string
          pattern: "^[A-Z0-9_-]{2,20}$"
        name:
          type: string
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
        createdAt:
          type: string
          format: date-time
    TeamPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        nextCursor:
          type: string
    InvitationRole:
      type: string
      description: >-
        A tenant-scoped role that an invitation may assign. platform-admin is never assignable
        through a tenant endpoint.
      enum: [tenant-admin, employee]
    InvitationStatus:
      type: string
      description: >-
        Public lifecycle status. An invitation whose acceptance is in progress is reported as
        PENDING; a PENDING invitation past expiresAt is reported as EXPIRED.
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
    DeliveryState:
      type: string
      description: >-
        Delivery of the newest invitation link. QUEUED - created, delivery pending; SENT - the mail
        server accepted the message; FAILED - delivery failed or its outcome is unknown (the
        administrator can resend, which issues a new link). Never retried automatically.
      enum: [QUEUED, SENT, FAILED]
    CreateInvitation:
      type: object
      additionalProperties: false
      description: >-
        The tenant comes only from the verified access token. tenantId, status, expiresAt, token
        and any other property are rejected.
      required: [email, role, locale]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: >-
            Invitee address. Confidential personal data: never echoed in errors, logs, events,
            audit metadata or metrics. The local part must be ASCII (SMTPUTF8 addresses are not
            supported yet); internationalized domains are accepted and stored in ASCII (IDNA).
        role:
          $ref: "#/components/schemas/InvitationRole"
        locale:
          type: string
          enum: [fr, en]
          description: Language of the invitation email and acceptance page.
    InvitationOrigin:
      type: string
      description: >-
        Who created the invitation: TENANT_ADMIN (a tenant administrator, MVP-010) or
        PLATFORM_BOOTSTRAP (a platform administrator inviting the organization's first tenant
        administrator, MVP-014). Immutable.
      enum: [TENANT_ADMIN, PLATFORM_BOOTSTRAP]
    CreateTenantAdminBootstrap:
      type: object
      additionalProperties: false
      description: >-
        The first tenant administrator's address and invitation language. The role is fixed by the
        operation; role, tenantId and any other property are rejected (UNKNOWN_PROPERTY).
      required: [email, locale]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: >-
            Invitee address, validated and normalized exactly like CreateInvitation. Confidential:
            never echoed in errors and never returned.
        locale:
          type: string
          enum: [fr, en]
          description: Language of the invitation email and acceptance page.
    TenantAdminBootstrap:
      type: object
      description: >-
        Bootstrap state of one organization. Never contains addresses, memberships,
        tenant-created invitations, actors or identity-provider state.
      required: [available, invitation]
      properties:
        available:
          type: boolean
          description: >-
            True only when no tenant-admin membership and no open tenant-admin invitation of any
            origin exists, so a bootstrap invitation could be created now.
        invitation:
          description: The open PLATFORM_BOOTSTRAP invitation, if any.
          oneOf:
            - $ref: "#/components/schemas/InvitationReceipt"
            - type: "null"
    InvitationReceipt:
      type: object
      description: >-
        The result of creating or reissuing an invitation. It deliberately omits the email address
        so that the idempotency record stores no personal data; it is replayed exactly.
      required: [id, role, locale, status, deliveryState, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/InvitationRole"
        locale:
          type: string
          enum: [fr, en]
        status:
          $ref: "#/components/schemas/InvitationStatus"
        deliveryState:
          $ref: "#/components/schemas/DeliveryState"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    Invitation:
      type: object
      description: >-
        An invitation as seen by a tenant administrator of the owning tenant. Contains the email
        address; never a token, token hash, identity subject or actor.
      required:
        [id, email, role, locale, status, deliveryState, expiresAt, createdAt, acceptedAt,
         revokedAt, resendsRemaining, origin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/InvitationRole"
        locale:
          type: string
          enum: [fr, en]
        status:
          $ref: "#/components/schemas/InvitationStatus"
        deliveryState:
          $ref: "#/components/schemas/DeliveryState"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        resendsRemaining:
          type: integer
          minimum: 0
          maximum: 3
        origin:
          $ref: "#/components/schemas/InvitationOrigin"
    InvitationPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        nextCursor:
          type: string
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128
          description: >-
            The single-use invitation token from the link fragment. A value of the wrong shape is
            reported as 404 INVITATION_INVALID, like an unknown token.
    InvitationPreview:
      type: object
      required: [role, locale, expiresAt]
      properties:
        role:
          $ref: "#/components/schemas/InvitationRole"
        locale:
          type: string
          enum: [fr, en]
        expiresAt:
          type: string
          format: date-time
    InvitationAcceptance:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED]
          description: The invitee must now follow the identity provider's email to choose a password.
    SystemStatus:
      type: object
      required: [service, status, version, checkedAt]
      properties:
        service:
          type: string
          example: core-api
        status:
          type: string
          enum: [UP, DOWN]
        version:
          type: string
        checkedAt:
          type: string
          format: date-time
    CurrentSession:
      type: object
      required: [tenantId, roles]
      properties:
        tenantId:
          description: >-
            Verified tenant claim; null only for a platform-administrator token without a tenant
            claim. Never synthesized.
          type: [string, "null"]
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [platform-admin, tenant-admin, employee]
    EmployeeImport:
      type: object
      description: >-
        MVP-020. An employee import: status, counts and the preview digest. Never personal data.
      required:
        [id, status, createdAt, expiresAt, totalRows, validRows, invalidRows, delimiter,
         headerLanguage, previewDigest, requiresAcknowledgement, errorCounts]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/EmployeeImportStatus"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When an open import's staged values are erased.
        totalRows:
          type: integer
          minimum: 1
        validRows:
          type: integer
          minimum: 0
        invalidRows:
          type: integer
          minimum: 0
        createdCount:
          type: [integer, "null"]
          minimum: 0
          description: Employees created; set once the import is committed.
        notImportedCount:
          type: [integer, "null"]
          minimum: 0
          description: Rows not imported; set once the import is committed.
        delimiter:
          type: string
          enum: [COMMA, SEMICOLON]
        headerLanguage:
          type: string
          enum: [fr, en, mixed]
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the canonical preview; repeated in the commit command.
        requiresAcknowledgement:
          type: boolean
          description: True when some rows are invalid and will not be imported.
        errorCounts:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeImportErrorCount"
    EmployeeImportStatus:
      type: string
      enum: [VALIDATED, COMMITTED, DISCARDED, EXPIRED]
    EmployeeImportErrorCount:
      type: object
      required: [code, count]
      properties:
        code:
          $ref: "#/components/schemas/EmployeeImportRowErrorCode"
        count:
          type: integer
          minimum: 1
    EmployeeImportRowPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeImportRow"
        nextCursor:
          type: [string, "null"]
    EmployeeImportRow:
      type: object
      required: [rowNumber, status, errors]
      properties:
        rowNumber:
          type: integer
          minimum: 1
          description: 1-based position among the data rows (the header and empty lines excluded).
        status:
          type: string
          enum: [VALID, INVALID, CREATED, NOT_IMPORTED]
        errors:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/EmployeeImportRowError"
        values:
          description: Only for VALID rows of an open import.
          oneOf:
            - $ref: "#/components/schemas/EmployeeImportRowValues"
            - type: "null"
    EmployeeImportRowError:
      type: object
      required: [column, code]
      properties:
        column:
          $ref: "#/components/schemas/EmployeeImportColumn"
        code:
          $ref: "#/components/schemas/EmployeeImportRowErrorCode"
    EmployeeImportColumn:
      type: string
      enum:
        [employee_number, given_names, family_name, start_date, legal_entity_code, site_code,
         department_code, cost_center_code, team_code]
    EmployeeImportRowErrorCode:
      type: string
      enum:
        - ROW_SHAPE
        - ROW_REQUIRED
        - ROW_TOO_LONG
        - ROW_CONTROL_CHARACTER
        - ROW_FORMAT
        - ROW_DATE_FORMAT
        - ROW_DATE_RANGE
        - ROW_EMPLOYEE_NUMBER_REPEATED
        - ROW_EMPLOYEE_NUMBER_EXISTS
        - ROW_UNIT_NOT_FOUND
        - ROW_UNIT_MISMATCH
        - ROW_UNIT_NOT_EFFECTIVE
        - ROW_PARENT_AMBIGUOUS
    EmployeeImportRowValues:
      type: object
      description: Normalized values that the commit will create. Confidential personal data.
      required: [employeeNumber, givenNames, familyName, startDate, legalEntityCode, siteCode]
      properties:
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
        startDate:
          type: string
          format: date
        legalEntityCode:
          type: string
        siteCode:
          type: string
        departmentCode:
          type: [string, "null"]
        costCenterCode:
          type: [string, "null"]
        teamCode:
          type: [string, "null"]
    CommitEmployeeImport:
      type: object
      additionalProperties: false
      required: [previewDigest, validRows, acknowledgeInvalidRows]
      properties:
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        validRows:
          type: integer
          minimum: 0
          maximum: 5000
        acknowledgeInvalidRows:
          type: boolean
    EmploymentStatus:
      type: string
      description: Employment status on the business date (today in the organization's time zone).
      enum: [CURRENT, NOT_STARTED, ENDED]
    EmployeeSummary:
      type: object
      description: Employee number and names are Confidential.
      required: [id, employeeNumber, givenNames, familyName, employmentStatus]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
        employmentStatus:
          $ref: "#/components/schemas/EmploymentStatus"
    EmployeePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/EmployeeSummary"
        nextCursor:
          type: [string, "null"]
    EmployeeSearch:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 100
          description: >-
            Employee-number prefix or name words (2-100 code points after NFC normalization).
            Never logged, audited or echoed.
        cursor:
          type: [string, "null"]
          maxLength: 512
        limit:
          type: [integer, "null"]
          minimum: 1
          maximum: 50
    Employment:
      type: object
      description: Employment dates are Restricted HR.
      required: [id, startDate, endDate, status, version]
      properties:
        id:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: [string, "null"]
          format: date
        status:
          $ref: "#/components/schemas/EmploymentStatus"
        version:
          type: integer
          minimum: 0
          description: Timeline version; every recorded change increments it.
    EmployeeProfile:
      type: object
      required: [id, employeeNumber, givenNames, familyName, businessDate, employment, current]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
        businessDate:
          type: string
          format: date
          description: Today in the organization's time zone; statuses are computed against it.
        employment:
          $ref: "#/components/schemas/Employment"
        current:
          $ref: "#/components/schemas/CurrentAssignments"
    CurrentAssignments:
      type: object
      description: Per kind, the active row covering the business date, or null.
      required: [placement, manager, contract, compensation]
      properties:
        placement:
          oneOf:
            - $ref: "#/components/schemas/Assignment"
            - type: "null"
        manager:
          oneOf:
            - $ref: "#/components/schemas/Assignment"
            - type: "null"
        contract:
          oneOf:
            - $ref: "#/components/schemas/Assignment"
            - type: "null"
        compensation:
          oneOf:
            - $ref: "#/components/schemas/Assignment"
            - type: "null"
    AssignmentKind:
      type: string
      enum: [PLACEMENT, MANAGER, CONTRACT, COMPENSATION]
    AssignmentStatus:
      type: string
      description: CURRENT covers the business date, SCHEDULED starts after it, ENDED ends before it.
      enum: [CURRENT, SCHEDULED, ENDED]
    ContractClassification:
      type: string
      description: >-
        Descriptive contract classification. It has no legal effect and is not a legal
        classification in any jurisdiction.
      enum: [PERMANENT, FIXED_TERM, APPRENTICESHIP, INTERNSHIP, DAILY]
    CompensationBasis:
      type: string
      description: How pay is expressed. Never an amount, rate, currency, bonus or allowance.
      enum: [MONTHLY, HOURLY, DAILY, PIECE_RATE]
    UnitRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    PlacementValue:
      type: object
      required: [legalEntity, site, department, costCenter, team]
      properties:
        legalEntity:
          $ref: "#/components/schemas/UnitRef"
        site:
          $ref: "#/components/schemas/UnitRef"
        department:
          oneOf:
            - $ref: "#/components/schemas/UnitRef"
            - type: "null"
        costCenter:
          oneOf:
            - $ref: "#/components/schemas/UnitRef"
            - type: "null"
        team:
          oneOf:
            - $ref: "#/components/schemas/UnitRef"
            - type: "null"
    ManagerValue:
      type: object
      required: [employeeId, employeeNumber, givenNames, familyName]
      properties:
        employeeId:
          type: string
          format: uuid
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
    Assignment:
      type: object
      description: >-
        One effective-dated fact (Restricted HR). Business values and effective dates never change;
        supersededAt is set once when a later change, correction or cancellation replaces the row.
      required:
        [id, kind, effectiveFrom, effectiveTo, status, changeId, supersededAt, placement, manager,
         contractClassification, compensationBasis]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AssignmentKind"
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
          description: Last day (inclusive); null means open-ended.
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        changeId:
          type: string
          format: uuid
          description: The change that recorded this row.
        supersededAt:
          type: [string, "null"]
          format: date-time
        placement:
          oneOf:
            - $ref: "#/components/schemas/PlacementValue"
            - type: "null"
        manager:
          oneOf:
            - $ref: "#/components/schemas/ManagerValue"
            - type: "null"
        contractClassification:
          oneOf:
            - $ref: "#/components/schemas/ContractClassification"
            - type: "null"
        compensationBasis:
          oneOf:
            - $ref: "#/components/schemas/CompensationBasis"
            - type: "null"
    AssignmentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Assignment"
        nextCursor:
          type: [string, "null"]
    EmploymentChangeType:
      type: string
      enum: [HIRE, CHANGE, CORRECTION, CANCELLATION, SEPARATION]
    EmploymentChangeTiming:
      type: string
      description: Relative to the business date when recorded.
      enum: [SCHEDULED, CURRENT, RETROACTIVE]
    EmploymentChangeReason:
      type: string
      description: >-
        LATE_NOTIFICATION, REORGANIZATION, CONTRACT_CHANGE and OTHER_BUSINESS_CHANGE apply to
        changes; DATA_ENTRY_ERROR, IMPORT_ERROR and DOCUMENT_RECEIVED to corrections.
        MANAGER_SEPARATED (MVP-022) is recorded only on the direct-report changes a separation
        generates and is never accepted in a request; a SEPARATION change carries its
        SeparationReason in the separation, not here (reasonCode null).
      enum:
        [LATE_NOTIFICATION, REORGANIZATION, CONTRACT_CHANGE, OTHER_BUSINESS_CHANGE,
         DATA_ENTRY_ERROR, IMPORT_ERROR, DOCUMENT_RECEIVED, MANAGER_SEPARATED]
    EmploymentChange:
      type: object
      description: A recorded change (Restricted HR). The recording actor is not exposed.
      required:
        [id, type, effectiveFrom, kinds, reasonCode, timing, state, cancelsChangeId, recordedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EmploymentChangeType"
        effectiveFrom:
          type: string
          format: date
        kinds:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/AssignmentKind"
        reasonCode:
          oneOf:
            - $ref: "#/components/schemas/EmploymentChangeReason"
            - type: "null"
        timing:
          oneOf:
            - $ref: "#/components/schemas/EmploymentChangeTiming"
            - type: "null"
          description: Null for the hire.
        state:
          type: string
          enum: [ACTIVE, CANCELLED]
        cancelsChangeId:
          type: [string, "null"]
          format: uuid
        recordedAt:
          type: string
          format: date-time
    EmploymentChangePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/EmploymentChange"
        nextCursor:
          type: [string, "null"]
    PlacementInput:
      type: object
      additionalProperties: false
      required: [legalEntityId, siteId]
      properties:
        legalEntityId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        departmentId:
          type: [string, "null"]
          format: uuid
        costCenterId:
          type: [string, "null"]
          format: uuid
        teamId:
          type: [string, "null"]
          format: uuid
    ManagerInput:
      type: object
      additionalProperties: false
      required: [employeeId]
      properties:
        employeeId:
          type: [string, "null"]
          format: uuid
          description: The manager's employee ID, or null to end the reporting line from the date.
    EmploymentChangeCommand:
      type: object
      additionalProperties: false
      description: >-
        A CHANGE sets one or more kinds from effectiveFrom; an absent or null kind is unchanged. A
        CORRECTION replaces the value of one active row (correctsAssignmentId) for its own dates;
        effectiveFrom must equal that row's start and exactly one kind is given.
      required: [type, effectiveFrom]
      properties:
        type:
          type: string
          enum: [CHANGE, CORRECTION]
        effectiveFrom:
          type: string
          format: date
        placement:
          oneOf:
            - $ref: "#/components/schemas/PlacementInput"
            - type: "null"
        manager:
          oneOf:
            - $ref: "#/components/schemas/ManagerInput"
            - type: "null"
        contractClassification:
          oneOf:
            - $ref: "#/components/schemas/ContractClassification"
            - type: "null"
        compensationBasis:
          oneOf:
            - $ref: "#/components/schemas/CompensationBasis"
            - type: "null"
        reasonCode:
          oneOf:
            - $ref: "#/components/schemas/EmploymentChangeReason"
            - type: "null"
        correctsAssignmentId:
          type: [string, "null"]
          format: uuid
    CreateEmploymentChange:
      type: object
      additionalProperties: false
      description: The previewed command plus what the preview returned.
      required: [type, effectiveFrom, expectedVersion, previewDigest, acknowledgeRetroactive]
      properties:
        type:
          type: string
          enum: [CHANGE, CORRECTION]
        effectiveFrom:
          type: string
          format: date
        placement:
          oneOf:
            - $ref: "#/components/schemas/PlacementInput"
            - type: "null"
        manager:
          oneOf:
            - $ref: "#/components/schemas/ManagerInput"
            - type: "null"
        contractClassification:
          oneOf:
            - $ref: "#/components/schemas/ContractClassification"
            - type: "null"
        compensationBasis:
          oneOf:
            - $ref: "#/components/schemas/CompensationBasis"
            - type: "null"
        reasonCode:
          oneOf:
            - $ref: "#/components/schemas/EmploymentChangeReason"
            - type: "null"
        correctsAssignmentId:
          type: [string, "null"]
          format: uuid
        expectedVersion:
          type: integer
          minimum: 0
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        acknowledgeRetroactive:
          type: boolean
    AssignmentPeriod:
      type: object
      description: A row before or after the change; assignmentId is null for rows to be created.
      required:
        [assignmentId, effectiveFrom, effectiveTo, placement, manager, contractClassification,
         compensationBasis]
      properties:
        assignmentId:
          type: [string, "null"]
          format: uuid
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
        placement:
          oneOf:
            - $ref: "#/components/schemas/PlacementValue"
            - type: "null"
        manager:
          oneOf:
            - $ref: "#/components/schemas/ManagerValue"
            - type: "null"
        contractClassification:
          oneOf:
            - $ref: "#/components/schemas/ContractClassification"
            - type: "null"
        compensationBasis:
          oneOf:
            - $ref: "#/components/schemas/CompensationBasis"
            - type: "null"
    PreviewKind:
      type: object
      required: [kind, before, after]
      properties:
        kind:
          $ref: "#/components/schemas/AssignmentKind"
        before:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentPeriod"
        after:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentPeriod"
    EmploymentChangePreview:
      type: object
      required:
        [expectedVersion, timing, requiresReason, requiresAcknowledgement, kinds, warnings,
         previewDigest]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        timing:
          $ref: "#/components/schemas/EmploymentChangeTiming"
        requiresReason:
          type: boolean
        requiresAcknowledgement:
          type: boolean
          description: True for a retroactive change; the commit must set acknowledgeRetroactive.
        kinds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PreviewKind"
        warnings:
          type: array
          items:
            type: string
            enum: [LATER_CHANGE_LIMITS_PERIOD]
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
    EmploymentChangeCancellationPreview:
      type: object
      required: [expectedVersion, kinds, cancellationDigest]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        kinds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PreviewKind"
        cancellationDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
    CancelEmploymentChange:
      type: object
      additionalProperties: false
      required: [expectedVersion, cancellationDigest]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        cancellationDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
    EmploymentChangeResult:
      type: object
      required: [change, employmentVersion]
      properties:
        change:
          $ref: "#/components/schemas/EmploymentChange"
        employmentVersion:
          type: integer
          minimum: 0
    EmployeeAccessLinkState:
      type: string
      description: >-
        NOT_LINKED (no active link), ACTIVE (linked; access not affected by a separation),
        REVOCATION_SCHEDULED (a separation will end the access) or REVOKED (DivalHR access ended).
      enum: [NOT_LINKED, ACTIVE, REVOCATION_SCHEDULED, REVOKED]
    EmployeeAccessLink:
      type: object
      description: >-
        An employee-to-membership link. The membership ID is a personal-data reference; the
        identity subject and the address are never returned here.
      required: [id, membershipId, role, linkedAt, version]
      properties:
        id:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/InvitationRole"
        linkedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
    EmployeeAccess:
      type: object
      required: [state, link]
      properties:
        state:
          $ref: "#/components/schemas/EmployeeAccessLinkState"
        link:
          oneOf:
            - $ref: "#/components/schemas/EmployeeAccessLink"
            - type: "null"
    AccessLinkCandidate:
      type: object
      description: >-
        The membership holding the looked-up address. notLinkableReason is ALREADY_LINKED (linked
        to another employee), ACCESS_REVOKED (its access was revoked) or EMPLOYEE_LINKED (this
        employee already has a link).
      required: [membershipId, role, linkable, notLinkableReason]
      properties:
        membershipId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/InvitationRole"
        linkable:
          type: boolean
        notLinkableReason:
          type: [string, "null"]
          enum: [ALREADY_LINKED, ACCESS_REVOKED, EMPLOYEE_LINKED, null]
    CreateEmployeeAccessLink:
      type: object
      additionalProperties: false
      required: [membershipId]
      properties:
        membershipId:
          type: string
          format: uuid
    RemoveEmployeeAccessLink:
      type: object
      additionalProperties: false
      required: [linkId, expectedVersion]
      properties:
        linkId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 0
    SeparationReason:
      type: string
      description: Closed separation reason (Restricted HR). No free-form notes.
      enum: [RESIGNATION, END_OF_FIXED_TERM, DISMISSAL, MUTUAL_AGREEMENT, RETIREMENT, OTHER_SEPARATION]
    SeparationAccessTiming:
      type: string
      description: >-
        END_OF_LAST_DAY ends DivalHR access at the start of the day after the last day in the
        organization's time zone. IMMEDIATELY ends it at the commit and is allowed only when the
        last day is today or earlier (422 SEPARATION_ACCESS_TIMING_INVALID otherwise); it requires
        the IMMEDIATE_ACCESS_REMOVAL acknowledgement and is forced for a retroactive separation.
      enum: [END_OF_LAST_DAY, IMMEDIATELY]
    SeparationAcknowledgement:
      type: string
      enum: [RETROACTIVE, NO_LINKED_ACCESS, IMMEDIATE_ACCESS_REMOVAL]
    SeparationReportPlan:
      type: object
      additionalProperties: false
      description: >-
        Applies to every affected direct-report interval: REASSIGN to managerEmployeeId, or CLEAR
        (no manager for those intervals).
      required: [action]
      properties:
        action:
          type: string
          enum: [REASSIGN, CLEAR]
        managerEmployeeId:
          type: [string, "null"]
          format: uuid
    SeparationCommand:
      type: object
      additionalProperties: false
      required: [lastDay, reasonCode, accessTiming]
      properties:
        lastDay:
          type: string
          format: date
          description: Inclusive last day of employment, a date in the organization's time zone.
        reasonCode:
          $ref: "#/components/schemas/SeparationReason"
        accessTiming:
          $ref: "#/components/schemas/SeparationAccessTiming"
        reportPlan:
          oneOf:
            - $ref: "#/components/schemas/SeparationReportPlan"
            - type: "null"
    CreateSeparation:
      type: object
      additionalProperties: false
      description: The previewed separation plus what the preview returned.
      required:
        [lastDay, reasonCode, accessTiming, expectedVersion, previewDigest, acknowledgements]
      properties:
        lastDay:
          type: string
          format: date
        reasonCode:
          $ref: "#/components/schemas/SeparationReason"
        accessTiming:
          $ref: "#/components/schemas/SeparationAccessTiming"
        reportPlan:
          oneOf:
            - $ref: "#/components/schemas/SeparationReportPlan"
            - type: "null"
        expectedVersion:
          type: integer
          minimum: 0
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        acknowledgements:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SeparationAcknowledgement"
    EmployeeRef:
      type: object
      description: Employee number and names are Confidential.
      required: [id, employeeNumber, givenNames, familyName]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
    SeparationBlocker:
      type: object
      description: >-
        A future effect on the employee's own timeline after the last day that must be cancelled
        first. changeId is the change to cancel next (resolution CANCEL_CHANGE), or null when it
        cannot be cancelled (resolution NOT_CANCELLABLE).
      required: [kind, effectiveFrom, resolution, changeId]
      properties:
        kind:
          $ref: "#/components/schemas/AssignmentKind"
        effectiveFrom:
          type: string
          format: date
        resolution:
          type: string
          enum: [CANCEL_CHANGE, NOT_CANCELLABLE]
        changeId:
          type: [string, "null"]
          format: uuid
    SeparationReportInterval:
      type: object
      required: [effectiveFrom, effectiveTo]
      properties:
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, "null"]
          format: date
    SeparationReport:
      type: object
      required: [employee, intervals]
      properties:
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        intervals:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SeparationReportInterval"
    SeparationAccessPreview:
      type: object
      description: >-
        LINKED (an employee-role membership is linked and will be revoked), NOT_LINKED (no DivalHR
        access is linked; nothing is revoked), PROTECTED_ADMIN (the linked membership is a tenant
        administrator: refused) or SELF (the caller's own access: refused).
      required: [status, accessEndsAt]
      properties:
        status:
          type: string
          enum: [LINKED, NOT_LINKED, PROTECTED_ADMIN, SELF]
        accessEndsAt:
          type: [string, "null"]
          format: date-time
    SeparationTaskCode:
      type: string
      enum: [RETURN_ASSIGNED_ASSETS, COLLECT_OR_ARCHIVE_DOCUMENTS]
    SeparationTaskStatus:
      type: string
      enum: [OPEN, DONE, NOT_APPLICABLE, CANCELLED]
    SeparationPreview:
      type: object
      required:
        [employmentId, expectedVersion, businessDate, lastDay, timing, accessTiming, kinds,
         blockers, reports, reportPlanRequired, access, checklist, requiredAcknowledgements,
         previewDigest]
      properties:
        employmentId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 0
        businessDate:
          type: string
          format: date
        lastDay:
          type: string
          format: date
        timing:
          $ref: "#/components/schemas/EmploymentChangeTiming"
        accessTiming:
          $ref: "#/components/schemas/SeparationAccessTiming"
        kinds:
          type: array
          description: The employee's own rows before and after, per affected kind.
          items:
            $ref: "#/components/schemas/PreviewKind"
        blockers:
          type: array
          description: Must be empty to commit (409 SEPARATION_FUTURE_CHANGES).
          items:
            $ref: "#/components/schemas/SeparationBlocker"
        reports:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/SeparationReport"
        reportPlanRequired:
          type: boolean
        access:
          $ref: "#/components/schemas/SeparationAccessPreview"
        checklist:
          type: array
          items:
            type: object
            required: [code, dueDate]
            properties:
              code:
                $ref: "#/components/schemas/SeparationTaskCode"
              dueDate:
                type: string
                format: date
        requiredAcknowledgements:
          type: array
          items:
            $ref: "#/components/schemas/SeparationAcknowledgement"
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
    SeparationTask:
      type: object
      description: A follow-up reminder (Restricted HR); never an asset or document record.
      required: [id, code, status, dueDate, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/SeparationTaskCode"
        status:
          $ref: "#/components/schemas/SeparationTaskStatus"
        dueDate:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
    SeparationAccessState:
      type: string
      description: >-
        NOT_LINKED (no access was linked), SCHEDULED (access ends at accessEndsAt), SIGN_OUT_PENDING
        (DivalHR access is denied; sign-in removal is in progress), COMPLETED (access denied and
        sign-in removed), MANUAL_INTERVENTION (DivalHR access is denied; sign-in removal needs an
        administrator) or CANCELLED (the separation was cancelled before access ended).
      enum: [NOT_LINKED, SCHEDULED, SIGN_OUT_PENDING, COMPLETED, MANUAL_INTERVENTION, CANCELLED]
