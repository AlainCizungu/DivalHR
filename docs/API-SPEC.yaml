    LeaveApprovalSubstitutionPage:
      type: object
      required: [items, nextCursor, asOf]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeaveApprovalSubstitution"
        nextCursor:
          type: [string, "null"]
        asOf:
          type: string
          format: date
          description: The organization's business date the states were derived on.
    LeaveApprovalSubstitutionReceipt:
      type: object
      description: MVP-041G. The minimal receipt of an appointment; never the reason.
      required: [substitutionId, createdAt]
      properties:
        substitutionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    LeaveApprovalSubstitutionRevocationReceipt:
      type: object
      description: MVP-041G. The minimal receipt of a revocation; never the reason.
      required: [substitutionId, revocationId, state, revokedAt]
      properties:
        substitutionId:
          type: string
          format: uuid
        revocationId:
          type: string
          format: uuid
        state:
          type: string
          enum: [REVOKED]
        revokedAt:
          type: string
          format: date-time
    WorkScheduleLabels:
      type: object
      description: >-
        MVP-050A. A slot's English and French labels: closed plain-text grammar version 1 (2-60
        characters, Latin letters with accents, digits, single spaces and . , ' ’ - ( ) / & # °;
        no markup, link or e-mail address), trimmed with spaces collapsed.
      required: [en, fr]
      properties:
        en:
          type: string
          minLength: 2
          maxLength: 60
        fr:
          type: string
          minLength: 2
          maxLength: 60
    WorkScheduleSlotInput:
      type: object
      description: MVP-050A. One proposed slot, one required worker.
      required: [clientRef, start, end, labels]
      properties:
        clientRef:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,40}$"
          description: The client's correlation reference, unique in the request; never stored.
        start:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$"
          description: Local start on a schedule date, in the selected site's time zone.
        end:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$"
          description: Local end, after the start, at most the next date and 24 hours later.
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
        employeeId:
          type: [string, "null"]
          format: uuid
          description: The assigned employee; absent or null for an uncovered slot.
    WorkScheduleRequest:
      type: object
      description: MVP-050A. A complete proposed schedule.
      required: [siteId, firstDate, lastDate, slots]
      properties:
        siteId:
          type: string
          format: uuid
        firstDate:
          type: string
          format: date
        lastDate:
          type: string
          format: date
        slots:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/WorkScheduleSlotInput"
    CancelWorkScheduleRequest:
      type: object
      description: MVP-050B. The cancellation's reason and the confirmation.
      required: [reason, confirm]
      properties:
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: >-
            Decision-reason grammar version 1 (NFC; no control, format, private-use or
            noncharacter code point; 2 to 500 code points). Restricted HR.
        confirm:
          type: boolean
          enum: [true]
    WorkScheduleReplacementRequest:
      type: object
      description: >-
        MVP-050B. Every slot of the replacement and the reason. The site and the period are the
        original's and cannot be sent.
      required: [slots, reason]
      properties:
        slots:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/WorkScheduleSlotInput"
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: Decision-reason grammar version 1. Restricted HR.
    ReplaceWorkScheduleRequest:
      type: object
      description: MVP-050B. The reviewed replacement, its preview digest and the confirmation.
      required: [slots, reason, previewDigest, confirm]
      properties:
        slots:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/WorkScheduleSlotInput"
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: Decision-reason grammar version 1. Restricted HR.
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirm:
          type: boolean
          enum: [true]
    WorkScheduleStatus:
      type: string
      description: >-
        MVP-050B. A schedule's derived state: PUBLISHED (operational), CANCELLED or REPLACED,
        from append-only evidence.
      enum: [PUBLISHED, CANCELLED, REPLACED]
    WorkScheduleChangeReceipt:
      type: object
      description: MVP-050B. The receipt of a cancellation or replacement; never the reason or actor.
      required: [scheduleId, status, changedAt, replacementScheduleId, totals]
      properties:
        scheduleId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WorkScheduleStatus"
        changedAt:
          type: string
          format: date-time
        replacementScheduleId:
          type: [string, "null"]
          format: uuid
        totals:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleTotals"
            - type: "null"
    PublishWorkScheduleRequest:
      type: object
      description: MVP-050A. The reviewed proposal, its preview digest and the confirmation.
      required: [siteId, firstDate, lastDate, slots, previewDigest, confirm]
      properties:
        siteId:
          type: string
          format: uuid
        firstDate:
          type: string
          format: date
        lastDate:
          type: string
          format: date
        slots:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/WorkScheduleSlotInput"
        previewDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirm:
          type: boolean
          enum: [true]
    WorkScheduleSite:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: [string, "null"]
        name:
          type: [string, "null"]
    WorkScheduleEmployee:
      type: object
      description: Current directory data of an assigned employee; never stored with the slot.
      required: [id, employeeNumber, givenNames, familyName]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        givenNames:
          type: string
        familyName:
          type: string
    WorkScheduleTotals:
      type: object
      description: Derived from the slots, never stored as editable totals.
      required: [slots, assigned, uncovered]
      properties:
        slots:
          type: integer
        assigned:
          type: integer
        uncovered:
          type: integer
    WorkScheduleSlotIssue:
      type: object
      required: [code, reason]
      properties:
        code:
          type: string
          enum:
            - WORK_SCHEDULE_SLOT_INVALID
            - WORK_SCHEDULE_EMPLOYEE_NOT_ELIGIBLE
            - WORK_SCHEDULE_EMPLOYEE_CONFLICT
        reason:
          type: string
          enum:
            - OUTSIDE_PERIOD
            - END_NOT_AFTER_START
            - TOO_LONG
            - LOCAL_TIME_INVALID
            - NOT_FOUND
            - SEPARATED
            - NOT_EMPLOYED
            - NOT_AT_SITE
            - PUBLISHED
            - IN_SCHEDULE
            - NOT_FUTURE
    WorkSchedulePreviewSlot:
      type: object
      required:
        [clientRef, position, start, end, startAt, endAt, overnight, labels, employee, issue]
      properties:
        clientRef:
          type: string
        position:
          type: integer
        start:
          type: string
        end:
          type: string
        startAt:
          type: [string, "null"]
          format: date-time
        endAt:
          type: [string, "null"]
          format: date-time
        overnight:
          type: boolean
        labels:
          $ref: "#/components/schemas/WorkScheduleLabels"
        employee:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleEmployee"
            - type: "null"
        issue:
          oneOf:
            - $ref: "#/components/schemas/WorkScheduleSlotIssue"
            - type: "null"
    WorkSchedulePreview:
      type: object
      required:
        - asOf
        - siteTimezone
        - site
        - firstDate
        - lastDate
        - slots
        - totals
        - warnings
        - publishable
        - previewDigest
      properties:
        asOf:
          type: string
          format: date
          description: The site's business date (today in siteTimezone), resolved by the server.
        siteTimezone:
          type: string
          description: >-
            The selected site's IANA time zone: the clock of every slot, stored with the schedule
