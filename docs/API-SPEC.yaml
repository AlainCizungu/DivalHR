      operationId: searchWorkScheduleSubstitutionCandidates
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Search eligible substitutes for a substitution request
      description: >-
        MVP-051. Employees who, for a PENDING, not yet started request routed to the caller (as
        listed by listMyWorkScheduleSubstitutionApprovals), report to the caller's linked employee
        on the shift's site-local start date and meet every MVP-050 scheduling eligibility rule for
        the shift (one qualifying employment covering every occupied local date, no separation
        before the shift ends, placed at the schedule's site on its start date, no overlapping
        operational assignment at any site, half-open instants), never the requesting employee or
        the caller, whose employee number starts with, or whose name words match, the normalized
        query (2-100 code points after NFC normalization and trimming), ordered by employee
        number. At most 20 per page (default 20). Each item is only the employee's ID, number and
        current name; why another employee is absent is never returned. The query is never
        logged, audited or echoed, and the edge proxies drop query strings from access logs.
        Unknown, foreign, decided, expired, voided and other managers' requests are the same 404
        WORK_SCHEDULE_SUBSTITUTION_NOT_FOUND. Restricted HR/Operations: a fail-closed disclosure
        (audit work-schedule-substitution.candidate-list, with a digest of the query, never the
        query). The signed cursor is bound to the operation, tenant, caller, the caller's link and
        linked employee, the request, a digest of the normalized query and the page size. Shares
