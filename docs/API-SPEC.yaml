        on the shift's site-local start date, an active MANAGER assignment naming the employee of
        the caller's current active employee-access link (403 EMPLOYEE_LINK_REQUIRED otherwise),
        oldest first (requestedAt, then id). The relationship is re-evaluated on every call, so an
        employment-history change reroutes a pending request at once. Never the caller's own
        requests; tenant administration and MVP-041G leave-approval substitute appointments give
        no access. Each item holds only what deciding requires: the request ID and instant, the
        employee's number and current name, the request reason, the schedule, slot, site and
        siteTimezone, local and instant boundaries, overnight and both labels. Restricted
        HR/Operations: a fail-closed disclosure (audit work-schedule-substitution.manager-list).
        The signed cursor is bound to the operation, tenant, caller, the caller's link and linked
        employee, page size and asOfInstant: a relink invalidates it. Shares the
