  /me/attendance/check-in:
    post:
      operationId: checkInMyAttendance
      x-divalhr-lifecycle: implemented
      x-divalhr-scope: tenant
      x-divalhr-required-role: employee
      summary: Check in for one of my scheduled shifts
      description: >-
        MVP-060A. Records the check-in of the employee of the caller's current active
        employee-access link (403 EMPLOYEE_LINK_REQUIRED otherwise) for a slot of an operational
        schedule whose current operational coverage is that employee (the published assignee, or
        an approved MVP-051 substitute; never the published employee of a substituted slot).
        Tenant, employee, employment, schedule, instant and actor are never fields: the instant is
        the server's. Malformed, unknown, foreign-tenant, cancelled, replaced, uncovered and other
        employees' slots are the same 404 ATTENDANCE_SHIFT_NOT_FOUND without params. The
        check-in window opens 2 hours before the scheduled start (409
        ATTENDANCE_CHECK_IN_TOO_EARLY before) and closes at the scheduled end (409
        ATTENDANCE_CHECK_IN_WINDOW_CLOSED from then). A slot already checked in by the caller is
        409 ATTENDANCE_ALREADY_CHECKED_IN; another of the caller's records still open within its
        check-out window is 409 ATTENDANCE_OPEN_RECORD_EXISTS; zero or several qualifying
        employments are 409 ATTENDANCE_STATE_CONFLICT. One transaction, under the tenant's
        scheduling lock, writes the CHECKED_IN event, the OPEN record, the audit record
        (attendance.check-in) and the outbox event (people.attendance.checked-in.v1). An exact
        retry returns the stored 201 with Idempotent-Replayed true while the caller is still
        linked to the recording employee; otherwise no stored response is returned (403
        EMPLOYEE_LINK_REQUIRED, or 409 IDEMPOTENCY_KEY_REUSED without params). Errors never echo
        an ID, name, number, label or shift detail. Shares the attendance-write limits.
        Cache-Control private, no-store.
      tags: [people]
