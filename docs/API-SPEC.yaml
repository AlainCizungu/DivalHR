      properties:
        legalEntityId:
          type: string
          format: uuid
        legalEntityCode:
          type: [string, "null"]
        legalEntityName:
          type: [string, "null"]
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        businessTimezone:
          type: string
    PayrollInputCounts:
      type: object
      description: MVP-090A. Timesheets, employees (employee and employment pairs), rows and approved worked minutes.
      required: [timesheets, employees, rows, workedMinutes]
      properties:
        timesheets:
          type: integer
          minimum: 0
        employees:
          type: integer
          minimum: 0
        rows:
          type: integer
          minimum: 0
        workedMinutes:
          type: integer
          minimum: 0
    PayrollInputCodeCount:
      type: object
