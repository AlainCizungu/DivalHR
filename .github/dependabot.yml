# Grouped, weekly updates per ecosystem to keep the polyglot stack current without noise
# (Issue #3 review, decision 6). Majors arrive as separate PRs for deliberate review.
# Java (ADR 0004: 21 LTS) and PostgreSQL (17) major versions are never proposed automatically:
# changing either is an architecture decision. Patch and minor updates within them still flow.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /apps/core-api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      # 2.x+ breaks the event-envelope contract-test API; migrate deliberately (Issue #17).
      - dependency-name: com.networknt:json-schema-validator
        versions: ['>= 2']
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/ai-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/apps/core-api, /apps/ai-service, /apps/web]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: eclipse-temurin
        versions: ['>= 22']
    groups:
      base-images:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /infrastructure/docker
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: postgres
        versions: ['>= 18']
    groups:
      compose-images:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
