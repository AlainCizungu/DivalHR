# Grouped, weekly updates per ecosystem to keep the polyglot stack current without noise
# (Issue #3 review, decision 6). Majors arrive as separate PRs for deliberate review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /apps/core-api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/ai-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/apps/core-api, /apps/ai-service, /apps/web]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      base-images:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /infrastructure/docker
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      compose-images:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
