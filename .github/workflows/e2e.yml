name: e2e
# Full stack validation on every pull request to main, regardless of changed paths.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  containers:
    name: container build validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core-api, context: apps/core-api, file: apps/core-api/Dockerfile }
          - { name: ai-service, context: apps/ai-service, file: apps/ai-service/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: keycloak, context: ., file: infrastructure/docker/keycloak/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: divalhr/${{ matrix.name }}:ci

  smoke:
    name: end-to-end smoke (login, health, fr/en, accessibility)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Start stack (development-only configuration)
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env.example up -d --build --wait --wait-timeout 300
      - run: pnpm install --frozen-lockfile
      - name: Verify the realm in final mode (read-only; MVP-011 MFA, Issue #31 narrow provisioning)
        run: pnpm realm:verify
        env:
          KEYCLOAK_VERIFY_TRANSPORT: compose
          KEYCLOAK_ADMIN_USER: dev-kc-admin
          KEYCLOAK_ADMIN_PASSWORD: dev-only-keycloak-admin
      - run: pnpm --filter @divalhr/web exec playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: pnpm --filter @divalhr/web exec playwright test
        env:
          CI: 'true'
      - if: failure()
        name: Service logs
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env.example logs --no-color
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env.example down -v
