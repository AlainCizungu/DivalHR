name: e2e
# Full stack validation on every pull request to main, regardless of changed paths, and on every
# commit of main (OPS-001 A65-7: a test-environment deployment requires green checks on its SHA).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  containers:
    name: container build validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core-api, context: apps/core-api, file: apps/core-api/Dockerfile }
          - { name: ai-service, context: apps/ai-service, file: apps/ai-service/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: keycloak, context: ., file: infrastructure/docker/keycloak/Dockerfile }
          # OPS-001: the production-mode Keycloak build of the test environment.
          - name: keycloak-hr-dev
            context: .
            file: infrastructure/docker/keycloak/Dockerfile
            build-args: KC_BUILD_OPTIONS=--db=postgres --cache=local --http-relative-path=/identity --health-enabled=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: divalhr/${{ matrix.name }}:ci
          build-args: ${{ matrix.build-args }}

  hr-dev:
    name: hr-dev ops validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HR_DEV_RELEASE: '0000000000000000000000000000000000000000'
      HR_DEV_HOST: hr-dev.dival.ai
      HR_DEV_ORIGIN: https://hr-dev.dival.ai
      HR_DEV_DATA: /srv/divalhr-test
      HR_DEV_TLS: internal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell scripts (shellcheck)
        run: >-
          shellcheck -x -S warning ops/host/*.sh ops/hr-dev/*.sh ops/aws/*.sh
          infrastructure/hr-dev/postgres/*.sh scripts/dev/verify-on-host.sh scripts/ops/access-log-canary.sh
      - name: Compose model of the test environment
        run: docker compose -f infrastructure/hr-dev/compose.yaml config -q
      - name: Caddyfile of the test environment
        run: >-
          docker run --rm -v "$PWD/infrastructure/hr-dev/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e HR_DEV_HOST=hr-dev.dival.ai -e HR_DEV_TLS=internal -e KEYCLOAK_REALM=divalhr-test
          -e KEYCLOAK_UPSTREAM=keycloak:8080 -e CORE_UPSTREAM=core-api:8080 -e AI_UPSTREAM=ai-service:8090
          -e WEB_UPSTREAM=web:8080 -e MAILPIT_UPSTREAM=mailpit:8025 -e HR_DEV_ADMIN_PORT=18180
          -e CADDY_IDP_INTERNAL_BIND=127.0.0.1 -e CADDY_ADMIN_BIND=127.0.0.1
          caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      # SEC-001: unique canaries in a callback query, Referer, redirect Location, Cookie,
      # Authorization and Set-Cookie never reach the logs of the pinned Caddy (committed filter)
      # and web nginx (committed template, nginx -t) images; every redaction removed in turn leaks.
      - name: Access logs keep OIDC authorization data out (runtime canaries)
        run: bash scripts/ops/access-log-canary.sh

  smoke:
    name: end-to-end smoke (login, health, fr/en, accessibility)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Start stack (development-only configuration)
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env.example up -d --build --wait --wait-timeout 300
      - run: pnpm install --frozen-lockfile
      - name: Verify the realm in final mode (read-only; MVP-011 MFA, Issue #31 narrow provisioning)
        run: pnpm realm:verify
        env:
          KEYCLOAK_VERIFY_TRANSPORT: compose
          KEYCLOAK_ADMIN_USER: dev-kc-admin
          KEYCLOAK_ADMIN_PASSWORD: dev-only-keycloak-admin
      - run: pnpm --filter @divalhr/web exec playwright install --with-deps chromium
      # DEVX-001A: features in parallel (SSO sessions from one real MFA sign-in per role), then the
      # identity tests alone; both always run and the step fails if either fails.
      - name: Playwright browser suite (features, then identity)
        run: pnpm --filter @divalhr/web run e2e:suite
        env:
          CI: 'true'
      - name: Membership preflight (read-only; MVP-012A, counts and IDs only)
        run: pnpm membership:preflight
        env:
          KEYCLOAK_ADMIN_USER: dev-kc-admin
          KEYCLOAK_ADMIN_PASSWORD: dev-only-keycloak-admin
          PREFLIGHT_DB_TRANSPORT: compose
      - if: failure()
        name: Service logs
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env.example logs --no-color
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env.example down -v
