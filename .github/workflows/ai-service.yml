name: ai-service
on:
  pull_request:
    paths:
      - apps/ai-service/**
      - packages/shared-contracts/openapi/**
      - .github/workflows/ai-service.yml
  push:
    branches: [main]
    paths:
      - apps/ai-service/**
      - packages/shared-contracts/openapi/**
      - .github/workflows/ai-service.yml
permissions:
  contents: read
concurrency:
  group: ai-service-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/ai-service
jobs:
  validate:
    name: ai-service
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
          enable-cache: true
      - run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Tests (including contract drift and log redaction)
        run: uv run pytest
