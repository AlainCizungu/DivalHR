name: core-api
on:
  pull_request:
    paths:
      - apps/core-api/**
      - apps/keycloak-provisioning/**
      - infrastructure/docker/**
      - docs/API-SPEC.yaml
      - .github/workflows/core-api.yml
  push:
    branches: [main]
    paths:
      - apps/core-api/**
      - apps/keycloak-provisioning/**
      - infrastructure/docker/**
      - docs/API-SPEC.yaml
      - .github/workflows/core-api.yml
permissions:
  contents: read
concurrency:
  group: core-api-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/core-api
jobs:
  validate:
    name: core-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Dependency and wrapper caching only; builds below run clean without the build cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - name: Format, static analysis, unit, integration, tenant-isolation, architecture and contract-drift tests
        run: ./gradlew --no-daemon --no-build-cache clean check bootJar
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-api-reports
          path: apps/core-api/build/reports
          retention-days: 7
