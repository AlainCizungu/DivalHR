name: core-api
on:
  pull_request:
    paths:
      - apps/core-api/**
      - docs/API-SPEC.yaml
      - .github/workflows/core-api.yml
  push:
    branches: [main]
    paths:
      - apps/core-api/**
      - docs/API-SPEC.yaml
      - .github/workflows/core-api.yml
permissions:
  contents: read
concurrency:
  group: core-api-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/core-api
jobs:
  validate:
    name: core-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Dependency and wrapper caching only; builds below run clean without the build cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - name: Format, static analysis, unit, integration, tenant-isolation, architecture and contract-drift tests
        run: ./gradlew --no-daemon --no-build-cache clean check bootJar
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-api-reports
          path: apps/core-api/build/reports
          retention-days: 7
