name: web
on:
  pull_request:
    paths:
      - apps/web/**
      - packages/**
      - docs/API-SPEC.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .prettierrc.json
      - .prettierignore
      - redocly.yaml
      - .redocly.lint-ignore.yaml
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - docs/API-SPEC.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .prettierrc.json
      - .prettierignore
      - redocly.yaml
      - .redocly.lint-ignore.yaml
      - .github/workflows/web.yml
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: web and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Translation-key parity (fails on any missing French or English key)
        run: pnpm i18n:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: OpenAPI contract lint
        run: pnpm api:lint
      - name: Generated API client is current
        run: pnpm api:check
      - name: Unit, French/English interface and accessibility tests
        run: pnpm test
      - name: Build
        run: pnpm build
