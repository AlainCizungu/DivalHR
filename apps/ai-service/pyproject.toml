[project]
name = "divalhr-ai-service"
version = "0.1.0"
description = "DivalHR AI service: the governed operational-summary capability (MVP-101) behind an authenticated Core-only boundary."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.146.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.0",
    "structlog==26.1.0",
    "httpx2==2.14.0",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divalhr_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "PT", "LOG", "G"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assertions and fake credentials are expected in tests
# Reviewed bilingual wording uses the typographic apostrophe and long literal sentences.
"src/divalhr_ai/summary/templates.py" = ["RUF001", "E501"]
"tests/test_summary_*.py" = ["S101", "S105", "S106", "RUF001", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=divalhr_ai --cov-report=term-missing --cov-fail-under=90"
