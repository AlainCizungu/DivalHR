# All environment-specific values come from environment variables. No secrets live here.
spring:
  application:
    name: core-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DIVALHR_DB_URL:jdbc:postgresql://localhost:5432/divalhr}
    username: ${DIVALHR_DB_USER:divalhr_core}
    password: ${DIVALHR_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # MVP-020 (A20-5): no endpoint accepts multipart. Disabling it means a multipart body is never
  # parsed before authorization (Spring parses multipart before interceptors run).
  servlet:
    multipart:
      enabled: false

server:
  port: ${DIVALHR_CORE_API_PORT:8080}
  shutdown: graceful
  # MVP-020 (A20-5): an idle connection, or a stalled request body between packets, is closed after
  # this time; the employee import also bounds the whole upload (divalhr.employee-import).
  tomcat:
    connection-timeout: 20s
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: ${DIVALHR_CORE_API_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    # An SMTP outage must not take the API out of rotation: invitation delivery degrades to
    # FAILED (the administrator resends) instead (Issue #25, A3).
    mail:
      enabled: false

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO

springdoc:
  api-docs:
    # Generated docs are verification output only; docs/API-SPEC.yaml is the contract.
    enabled: ${DIVALHR_API_DOCS_ENABLED:false}
  paths-to-match: /api/v1/**
  show-actuator: false

divalhr:
  # Required, no default (fail closed): development | test | staging | production
  environment: ${DIVALHR_ENVIRONMENT}
  version: ${DIVALHR_VERSION:0.1.0}
  security:
    issuer: ${DIVALHR_OIDC_ISSUER:http://localhost:8180/realms/divalhr-dev}
    audience: ${DIVALHR_OIDC_AUDIENCE:divalhr-core-api}
    jwk-set-uri: ${DIVALHR_OIDC_JWKS_URI:http://localhost:8180/realms/divalhr-dev/protocol/openid-connect/certs}
  idempotency:
    # Minimum retention; records are honoured until a cleanup job removes them after expires_at.
    retention: 7d
  pagination:
    # Required (fail closed): >= 32 bytes; dev-only- values are rejected outside development.
    cursor-signing-key: ${DIVALHR_CURSOR_SIGNING_KEY:}
  cors:
    allowed-origins: ${DIVALHR_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # MVP-010 invitations. Secrets have no defaults (fail closed); see .env.example for development.
  invitations:
    ttl: ${DIVALHR_INVITATION_TTL:7d}
    retention: ${DIVALHR_INVITATION_RETENTION:90d}
    create-per-hour: ${DIVALHR_INVITATION_CREATE_PER_HOUR:50}
    max-open: ${DIVALHR_INVITATION_MAX_OPEN:500}
    resend-interval: 5m
    delivery-stale-after: 10m
    acceptance-lease: 2m
    credential-setup-retry: 5m
    credential-setup-max-attempts: 5
    # Base URL of the web app used in invitation links (no trailing slash).
    web-base-url: ${DIVALHR_WEB_BASE_URL:http://localhost:5173}
    # Required (fail closed): >= 32 bytes; dev-only- values are rejected outside development.
    email-lookup-key: ${DIVALHR_EMAIL_LOOKUP_KEY:}
    jobs:
      enabled: ${DIVALHR_INVITATION_JOBS_ENABLED:true}
  # MVP-014: the shared organization lock of every tenant-admin creation path, and the bootstrap
  # limit per platform administrator (rolling hour, across organizations).
  tenant-administration:
    lock-timeout: ${DIVALHR_TENANT_ADMIN_LOCK_TIMEOUT:5s}
    bootstrap-per-actor-per-hour: ${DIVALHR_BOOTSTRAP_PER_ACTOR_PER_HOUR:5}
  # MVP-012B: per-subject access-review limit, in-process per instance (cluster ceiling: limit x
  # active instances).
  access-review:
    requests-per-minute: ${DIVALHR_ACCESS_REVIEW_REQUESTS_PER_MINUTE:30}
  # MVP-020 (A20-4): named request limits, in-process per instance (cluster ceiling: value x active
  # instances). Subject buckets are per one-minute window.
  request-limits:
    subject:
      employee-import: ${DIVALHR_EMPLOYEE_IMPORT_REQUESTS_PER_MINUTE:10}
      employee-read: ${DIVALHR_EMPLOYEE_READ_REQUESTS_PER_MINUTE:60}
      employment-change: ${DIVALHR_EMPLOYMENT_CHANGE_REQUESTS_PER_MINUTE:20}
      contract-read: ${DIVALHR_CONTRACT_READ_REQUESTS_PER_MINUTE:60}
      contract-write: ${DIVALHR_CONTRACT_WRITE_REQUESTS_PER_MINUTE:20}
      contract-self: ${DIVALHR_CONTRACT_SELF_REQUESTS_PER_MINUTE:30}
      contract-expiration: ${DIVALHR_CONTRACT_EXPIRATION_REQUESTS_PER_MINUTE:60}
    tenant:
      employee-import-upload:
        requests: ${DIVALHR_EMPLOYEE_IMPORT_TENANT_UPLOADS:30}
        window: 10m
      employee-import-commit:
        requests: ${DIVALHR_EMPLOYEE_IMPORT_TENANT_COMMITS:60}
        window: 10m
      employee-search:
        requests: ${DIVALHR_EMPLOYEE_SEARCH_TENANT_REQUESTS:300}
        window: 10m
      employment-change-write:
        requests: ${DIVALHR_EMPLOYMENT_CHANGE_TENANT_WRITES:200}
        window: 10m
      contract-write:
        requests: ${DIVALHR_CONTRACT_TENANT_WRITES:200}
        window: 10m
  # MVP-020: employee import bounds, staging lifetime, result retention (operational policy, not a
  # statutory period) and timeouts (A20-2, A20-5, A20-6).
  employee-import:
    max-bytes: 2097152
    max-rows: ${DIVALHR_EMPLOYEE_IMPORT_MAX_ROWS:1000}
    staging-ttl: ${DIVALHR_EMPLOYEE_IMPORT_STAGING_TTL:2h}
    result-retention: ${DIVALHR_EMPLOYEE_IMPORT_RESULT_RETENTION:30d}
    max-open-imports: 3
    upload-timeout: 30s
    validation-statement-timeout: 5s
    validation-transaction-timeout: 15s
    commit-statement-timeout: 10s
    commit-transaction-timeout: 30s
    cleanup-statement-timeout: 10s
    cleanup-batch-size: 100
    jobs:
      enabled: ${DIVALHR_EMPLOYEE_IMPORT_JOBS_ENABLED:true}
  # MVP-021: employment history. The retroactive window is a configurable pilot business rule,
  # not a statutory period (0 to 366 days).
  employment-history:
    retroactive-days: ${DIVALHR_EMPLOYMENT_RETROACTIVE_DAYS:60}
    statement-timeout: 5s
    transaction-timeout: 15s
  # MVP-022: identity-provider sign-in removal of separated employees (D22-14). DivalHR access never
  # depends on these jobs: the membership gate denies a revoked membership from its instant on.
  access-revocation:
    batch-size: ${DIVALHR_ACCESS_REVOCATION_BATCH_SIZE:20}
    lease: 2m
    max-attempts: 10
    first-backoff: 1m
    max-backoff: 60m
    jobs:
      enabled: ${DIVALHR_ACCESS_REVOCATION_JOBS_ENABLED:true}
      interval: PT1M
  separation:
    jobs:
      enabled: ${DIVALHR_SEPARATION_JOBS_ENABLED:true}
      interval: PT1M
  # MVP-030: contract write limits and the read-only daily integrity job (ADR 0009).
  contracts:
    statement-timeout: 5s
    transaction-timeout: 15s
    integrity-batch-size: 200
    jobs:
      enabled: ${DIVALHR_CONTRACT_JOBS_ENABLED:true}
      initial-delay: PT10M
      interval: P1D
  # MVP-013: durable evidence of privileged authorization denials. Budgets are in-process per
  # instance (cluster ceiling: value x active instances); the bulkhead pool is separate from the
  # application pool.
  denial-audit:
    per-actor-per-minute: ${DIVALHR_DENIAL_AUDIT_PER_ACTOR_PER_MINUTE:20}
    per-instance-per-minute: ${DIVALHR_DENIAL_AUDIT_PER_INSTANCE_PER_MINUTE:600}
    pool-size: 2
    connection-timeout: 1s
    statement-timeout: 2s
  identity-provider:
    admin-base-url: ${DIVALHR_KEYCLOAK_ADMIN_URL:http://localhost:8180}
    realm: ${DIVALHR_KEYCLOAK_REALM:divalhr-dev}
    client-id: ${DIVALHR_KEYCLOAK_PROVISIONER_CLIENT_ID:divalhr-core-provisioner}
    # Required (fail closed); dev-only- values are rejected outside development.
    client-secret: ${DIVALHR_KEYCLOAK_PROVISIONER_SECRET:}
  mail:
    host: ${DIVALHR_MAIL_HOST:}
    port: ${DIVALHR_MAIL_PORT:587}
    username: ${DIVALHR_MAIL_USERNAME:}
    password: ${DIVALHR_MAIL_PASSWORD:}
    from: ${DIVALHR_MAIL_FROM:}
    from-name: ${DIVALHR_MAIL_FROM_NAME:DivalHR}
    starttls: ${DIVALHR_MAIL_STARTTLS:true}
    ssl: ${DIVALHR_MAIL_SSL:false}
  # Anonymous endpoints: defense in depth only. Production MUST also rate limit /api/v1/public/**
  # at the ingress or WAF. Forwarding headers are trusted only from these exact proxy addresses.
  rate-limit:
    per-client-requests: 10
    global-requests: 600
    window: 1m
    trusted-proxies: ${DIVALHR_TRUSTED_PROXIES:}
