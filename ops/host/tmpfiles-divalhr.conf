# OPS-001 (A65-5): the DivalHR host-wide operation lock, recreated at every boot.
# Installed as /etc/tmpfiles.d/divalhr.conf by ops/aws/aws-dev-setup.sh install.
# Group divalhr-ops: the users allowed to run verifications and test-environment operations.
f /run/lock/divalhr-host.lock 0660 root divalhr-ops -
